<style>
:root{--navy:#001B4D;--blue:#48BAE2;--red:#C8102E;--ink:#11233f;--muted:#66758b;--bg:#f6f9fc;--line:#dce7f1;--green:#21864a;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}
body[dir="rtl"]{font-family:Cairo,Tahoma,sans-serif}
.display{font-family:Poppins,Inter,sans-serif;letter-spacing:.1px}

header{height:76px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.headerrow{max-width:1400px;height:100%;margin:auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{display:flex;align-items:center;gap:13px} .mark{width:45px;height:45px;border-radius:50%;border:2px solid var(--blue);display:grid;place-items:center;color:var(--navy);font-family:Poppins;font-weight:700;font-size:20px}
.brand h1{margin:0;color:var(--navy);font-size:22px} .brand p{margin:2px 0 0;color:#6b7a90;font-size:11px}
.lang{display:flex;background:#eef5fa;border-radius:10px;padding:3px} .lang button{border:0;background:transparent;padding:7px 11px;border-radius:8px;font-weight:700;cursor:pointer} .lang .active{background:white;color:var(--navy);box-shadow:0 2px 7px #001b4d18}
.shell{max-width:1400px;margin:auto;display:grid;grid-template-columns:285px 1fr;min-height:calc(100vh - 76px)}
aside{background:white;border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:76px;height:calc(100vh - 76px);overflow:auto} body[dir=rtl] aside{border-right:0;border-left:1px solid var(--line)}
.navlabel{font-size:11px;font-weight:800;color:#9aa7b8;text-transform:uppercase;letter-spacing:.09em;padding:10px 11px 7px}
.navbtn{width:100%;border:0;background:transparent;padding:11px 12px;margin-bottom:5px;border-radius:10px;text-align:left;cursor:pointer;color:#314158;display:flex;gap:10px;align-items:flex-start} body[dir=rtl] .navbtn{text-align:right}
.navbtn:hover{background:#f2f7fb} .navbtn.active{background:var(--navy);color:white} .navbtn .num{width:28px;height:28px;flex:0 0 28px;border-radius:50%;display:grid;place-items:center;background:#eaf7fb;color:var(--navy);font-weight:800;font-size:12px} .navbtn.active .num{background:#fff;color:var(--red)}
.navbtn .small{font-size:11px;opacity:.72;margin-top:3px}
.locknote{font-size:10px;color:#9aa7b8;margin-left:38px;margin-top:-3px;margin-bottom:5px}
main{padding:28px 30px;min-width:0} .container{max-width:1040px;margin:auto}
.hero{background:white;border:1px solid var(--line);border-radius:23px;padding:28px 30px;position:relative;overflow:hidden;margin-bottom:18px;box-shadow:0 8px 30px #001b4d0a}
.hero:after,.hero:before{display:none}

.hero .eyebrow{display:flex;align-items:center;gap:8px;color:var(--red);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;position:relative;z-index:2} .hero .eyebrow:before{content:"";width:5px;height:28px;background:var(--red);border-radius:4px}
.hero h2{position:relative;z-index:2;color:var(--navy);font-size:38px;line-height:1.05;margin:14px 0 10px;max-width:720px} .hero h2 .red{color:var(--red)} .hero p{position:relative;z-index:2;color:var(--muted);line-height:1.65;max-width:720px;margin:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px} .card{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 5px 18px #001b4d08} .card h3{margin:0 0 8px;color:var(--navy);font-family:Poppins;font-size:22px} body[dir=rtl] .card h3{font-family:Cairo} .card p{color:var(--muted);line-height:1.55;margin:0}
.modulecard{cursor:pointer;transition:.2s} .modulecard:hover{transform:translateY(-2px);border-color:#b6d9ea;box-shadow:0 10px 26px #001b4d12}
.ribbon{display:inline-block;background:#e9f7fc;color:#087ca5;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;margin-bottom:9px}
.tabs{display:flex;gap:7px;background:white;border:1px solid var(--line);border-radius:14px;padding:6px;margin:15px 0;position:sticky;top:86px;z-index:15} .tab{border:0;background:transparent;padding:10px 15px;border-radius:9px;font-weight:800;color:#5b6a7f;cursor:pointer} .tab.active{background:var(--navy);color:white}
.learn{background:white;border:1px solid var(--line);border-radius:16px;padding:19px;margin-bottom:12px} .learn h3{font-family:Poppins;color:var(--navy);margin:0 0 12px;font-size:24px} body[dir=rtl] .learn h3{font-family:Cairo} .learn li{margin:8px 0;line-height:1.6}
.quizpicker{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0} .pill{border:1px solid var(--line);background:white;padding:8px 11px;border-radius:999px;cursor:pointer;font-weight:700} .pill.active{background:var(--navy);color:white;border-color:var(--navy)}
.quizbox,.assessmentbox{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 7px 24px #001b4d0b}
.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px} .qnum{font-size:12px;font-weight:800;color:#65758b} .timer{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--red) var(--timer-pct,100%),#edf2f7 0);position:relative;flex:0 0 66px} .timer:after{content:"";position:absolute;inset:6px;background:white;border-radius:50%} .timer span{position:relative;z-index:2;font-family:Poppins;font-size:23px;color:var(--navy)}
.progress{height:7px;background:#edf2f7;border-radius:999px;overflow:hidden;margin:9px 0 20px} .progress>div{height:100%;background:linear-gradient(90deg,var(--blue),var(--navy));transition:.25s}
.qtext{font-size:20px;font-weight:700;line-height:1.5;margin:8px 0 17px;color:#1b2a41;max-width:860px}
.opt{display:block;width:100%;text-align:left;border:1px solid #d7e1eb;background:#fff;padding:13px 15px;margin:9px 0;border-radius:11px;cursor:pointer;line-height:1.45;transition:.15s} body[dir=rtl] .opt{text-align:right} .opt:hover{border-color:#7ccce9;background:#f7fcfe} .opt.selected{border-color:var(--navy);background:#eef5fb;box-shadow:0 0 0 2px #001b4d0a}
.next{border:0;background:var(--navy);color:white;border-radius:10px;padding:11px 18px;font-weight:800;cursor:pointer;margin-top:15px} .next.red{background:var(--red)}
.assessintro{display:grid;grid-template-columns:1.35fr .65fr;gap:18px} .sidepanel{background:var(--navy);color:white;border-radius:18px;padding:22px;position:relative;overflow:hidden} .sidepanel h3{font-family:Poppins;font-size:26px;margin:0 0 10px} .sidepanel p{opacity:.82;line-height:1.55;font-size:13px} .sidepanel .big{font-family:Poppins;font-size:64px;line-height:1;color:var(--blue);margin:8px 0} 
.resultsgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:15px} .domain{background:white;border:1px solid var(--line);border-radius:14px;padding:14px} .domainhead{display:flex;justify-content:space-between;gap:10px;font-weight:800} .bar{height:8px;background:#edf2f7;border-radius:999px;overflow:hidden;margin-top:9px} .bar>div{height:100%;background:var(--blue)} .bar>div.low{background:var(--red)} .bar>div.high{background:var(--green)}
.insight{background:white;border-left:5px solid var(--red);border-radius:10px;padding:14px 16px;margin-top:12px;line-height:1.55} body[dir=rtl] .insight{border-left:1px solid var(--line);border-right:5px solid var(--red)}
.compare{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;align-items:center;font-size:13px;margin-top:8px} .delta.pos{color:var(--green);font-weight:800} .delta.neg{color:var(--red);font-weight:800}
.activity{background:white;border:1px solid var(--line);border-radius:18px;padding:20px;overflow:auto} .placeholder{border:2px dashed #cad7e4;border-radius:16px;padding:28px;text-align:center;color:var(--muted);background:#fbfdff}
.status{font-size:11px;font-weight:800;color:var(--green);margin-top:3px}
footer{max-width:1040px;margin:25px auto 0;color:#91a0b2;text-align:center;font-size:11px}
@media(max-width:900px){.card>div[style*="repeat(4,1fr)"]{grid-template-columns:1fr 1fr!important}.shell{grid-template-columns:1fr} aside{position:static;height:auto;border:0;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;gap:5px;padding:9px} .navlabel,.locknote{display:none} .navbtn{min-width:190px;margin:0} main{padding:17px} .grid,.resultsgrid,.assessintro{grid-template-columns:1fr} .hero h2{font-size:31px} .tabs{top:76px;overflow:auto}}

.case-workspace{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}
.case-workspace h3{font-family:Poppins,Inter,sans-serif;color:var(--navy);margin:0 0 14px}
.case-item{background:#f9fbfd;border:1px solid #dfe8f0;border-radius:14px;padding:16px;margin:12px 0}
.case-item label{display:block;font-weight:700;line-height:1.5;margin-bottom:10px;color:#24364f}
.case-item textarea,.case-item select{width:100%;border:1px solid #cfdbe6;border-radius:10px;padding:11px 12px;font:inherit;background:white;color:var(--ink)}
.case-item textarea{min-height:100px;resize:vertical}
.case-choice{display:block;width:100%;text-align:left;border:1px solid #d7e1eb;background:white;padding:11px 13px;margin:7px 0;border-radius:10px;cursor:pointer}
body[dir=rtl] .case-choice{text-align:right}
.case-choice.selected{border-color:var(--navy);background:#eef5fb;box-shadow:0 0 0 2px #001b4d0a}
.saved-indicator{font-size:11px;font-weight:800;color:var(--green);margin-top:10px}
.case-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.secondary{border:1px solid #cbd7e2;background:white;color:var(--navy);border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}
</style>

<script>
const DATA={"modules": [{"id": 1, "title": {"en": "Module 1: Management Foundations", "ar": "الوحدة ١: أسس الإدارة"}, "icon": "🏢", "sections": ["1"], "subsections": [{"sourceId": "1", "title": {"en": "Module 1: Management Foundations", "ar": "الوحدة ١: أسس الإدارة"}, "takeaways": {"en": ["Management involves Planning, Organizing, Leading, and Controlling.", "Effective managers communicate transparently and treat mistakes as learning opportunities.", "Managers must balance the needs of the team with achieving organizational goals.", "Delegating carefully and acting as a change agent are core duties."], "ar": ["الإدارة تشمل التخطيط، التنظيم، القيادة، والرقابة.", "المديرون الفعالون يتواصلون بشفافية ويتعاملون مع الأخطاء كفرص للتعلم.", "يجب على المديرين الموازنة بين احتياجات الفريق وتحقيق الأهداف التنظيمية.", "التفويض بعناية والعمل كعامل للتغيير من الواجبات الأساسية."]}, "scoreFeedback": {"perfect": {"en": "Excellent! You have a solid understanding of the four management functions and the mindset of an effective leader.", "ar": "ممتاز! لديك فهم قوي لوظائف الإدارة الأربع وعقلية القائد الفعال."}, "high": {"en": "Excellent! You have a solid understanding of the four management functions and the mindset of an effective leader.", "ar": "ممتاز! لديك فهم قوي لوظائف الإدارة الأربع وعقلية القائد الفعال."}, "med": {"en": "Good job! You understand most concepts, but review the specific distinctions between planning, organizing, leading, and controlling.", "ar": "عمل جيد! أنت تفهم معظم المفاهيم، لكن راجع الفروق الدقيقة بين التخطيط، التنظيم، القيادة، والرقابة."}, "low": {"en": "You need a stronger grasp of the basics. Review the four functions of management and remember the importance of delegation and viewing mistakes as learning opportunities.", "ar": "تحتاج إلى فهم أقوى للأساسيات. راجع وظائف الإدارة الأربع وتذكر أهمية التفويض واعتبار الأخطاء فرصاً للتعلم."}}, "activity": {"en": "\n                <div class=\"bg-indigo-50 border border-indigo-100 rounded-xl p-6 shadow-sm\">\n                    <h3 class=\"font-bold text-indigo-900 mb-4 text-xl flex items-center gap-2 border-b border-indigo-200 pb-3\">\n                        <i class=\"fa-solid fa-users-viewfinder\"></i> Group Work Activity\n                    </h3>\n                    <h4 class=\"font-bold text-indigo-900 mb-2\">Case 1: The Manager Sets the Example</h4>\n                    <p class=\"text-sm text-indigo-900 leading-relaxed mb-4\">Kamal had recently been promoted to the position of Production Manager after consistently demonstrating excellent performance in various roles within the Sales department. His track record of success earned him respect among his colleagues, and his subordinates welcomed him into his new position. They were supportive and cooperative, helping him transition smoothly into his managerial role.</p>\n                    <p class=\"text-sm text-indigo-900 leading-relaxed mb-4\">During his third week as a manager, on a Thursday afternoon—the designated day for office work and reporting —a challenging situation arose. As Kamal was returning to his office from a meeting, he noticed two employees, Ali and Hassan, heading out to leave for the day. Kamal checked his watch and realized it was still twenty minutes before closing time. He called out to them, “Aren’t you leaving early?”</p>\n                    <p class=\"text-sm text-indigo-900 leading-relaxed mb-6\">Hassan, feeling taken aback, responded, “But Kamal, you used to leave a little early on Thursdays when you were in Sales, so we thought it would be okay.”</p>\n                    \n                    <div class=\"space-y-4\">\n                        <div class=\"bg-white/60 p-4 rounded-lg\">\n                            <p class=\"font-bold text-sm text-indigo-900 mb-2\">1. What are the potential risks of Kamal leaving early in his previous role, and how might it affect his current position as a manager?</p>\n                            <ul class=\"text-sm text-indigo-800 space-y-1 ml-2\">\n                                <li>A. It could set a bad precedent for his team, leading them to think it’s acceptable to leave early.</li>\n                                <li>B. It will motivate employees to work harder because they see Kamal as a flexible leader.</li>\n                                <li>C. It will have no impact on his new role because his past behavior as a Sales employee does not matter.</li>\n                            </ul>\n                        </div>\n                        <div class=\"bg-white/60 p-4 rounded-lg\">\n                            <p class=\"font-bold text-sm text-indigo-900 mb-2\">2. What should Kamal do to maintain his authority as a new manager while fostering positive relationships with his team?</p>\n                            <ul class=\"text-sm text-indigo-800 space-y-1 ml-2\">\n                                <li>A. Kamal should strictly enforce rules with little room for flexibility.</li>\n                                <li>B. Kamal should create clear expectations but also be approachable and open to discussion.</li>\n                                <li>C. Kamal should avoid confronting his employees to maintain a friendly relationship.</li>\n                            </ul>\n                        </div>\n                        <div class=\"bg-white/60 p-4 rounded-lg\">\n                            <p class=\"font-bold text-sm text-indigo-900 mb-2\">3. What role does consistency in behavior play in effective management? How might Kamal's past behavior influence the team's view of him as a leader?</p>\n                            <ul class=\"text-sm text-indigo-800 space-y-1 ml-2\">\n                                <li>A. Consistency is important because it builds trust and sets clear expectations for the team.</li>\n                                <li>B. Consistency doesn’t matter; being flexible and adapting to situations is more important.</li>\n                            </ul>\n                        </div>\n                        <div class=\"bg-white/60 p-4 rounded-lg\">\n                            <p class=\"font-bold text-sm text-indigo-900 mb-2\">4. How can Kamal use this incident as an opportunity for leadership growth? What lessons can he learn from this experience?</p>\n                            <ul class=\"text-sm text-indigo-800 space-y-1 ml-2\">\n                                <li>A. Kamal should ignore the incident as it’s a small mistake and won’t affect his leadership.</li>\n                                <li>B. Kamal can use this as a chance to establish clear boundaries and communicate expectations with the team.</li>\n                                <li>C. Kamal should focus solely on enforcing rules strictly to avoid any future confusion.</li>\n                            </ul>\n                        </div>\n                    </div>\n                </div>\n                ", "ar": "\n                <div class=\"bg-indigo-50 border border-indigo-100 rounded-xl p-6 shadow-sm\">\n                    <h3 class=\"font-bold text-indigo-900 mb-4 text-xl flex items-center gap-2 border-b border-indigo-200 pb-3\">\n                        <i class=\"fa-solid fa-users-viewfinder\"></i> نشاط عمل جماعي\n                    </h3>\n                    <h4 class=\"font-bold text-indigo-900 mb-2\">الحالة 1: المدير يضع المثال</h4>\n                    <p class=\"text-sm text-indigo-900 leading-relaxed mb-4\">تمت ترقية كمال مؤخرًا إلى منصب مدير الإنتاج بعد أن أظهر أداءً ممتازًا ومستمرًا في أدوار مختلفة داخل قسم المبيعات. أكسبه سجل نجاحه احترام زملائه، ورحب به مرؤوسوه في منصبه الجديد. كانوا داعمين ومتعاونين، مما ساعده على الانتقال بسلاسة إلى دوره الإداري.</p>\n                    <p class=\"text-sm text-indigo-900 leading-relaxed mb-4\">خلال أسبوعه الثالث كمدير، بعد ظهر يوم الخميس - وهو اليوم المخصص للعمل المكتبي وإعداد التقارير - نشأ موقف صعب. بينما كان كمال عائدًا إلى مكتبه من اجتماع، لاحظ أن موظفين، علي وحسن، يتجهان للمغادرة. نظر كمال إلى ساعته وأدرك أنه لا يزال هناك عشرون دقيقة قبل وقت الانصراف. نادى عليهما: \"ألن تغادرا مبكرًا؟\"</p>\n                    <p class=\"text-sm text-indigo-900 leading-relaxed mb-6\">شعر حسن بالمفاجأة ورد: \"لكن يا كمال، كنت تغادر مبكرًا بعض الشيء أيام الخميس عندما كنت في المبيعات، لذا اعتقدنا أن الأمر سيكون عاديًا.\"</p>\n                    \n                    <div class=\"space-y-4\">\n                        <div class=\"bg-white/60 p-4 rounded-lg\">\n                            <p class=\"font-bold text-sm text-indigo-900 mb-2\">1. ما هي المخاطر المحتملة لمغادرة كمال مبكرًا في دوره السابق، وكيف قد تؤثر على منصبه الحالي كمدير؟</p>\n                            <ul class=\"text-sm text-indigo-800 space-y-1 ml-2\">\n                                <li>أ. قد يشكل ذلك سابقة سيئة لفريقه، مما يدفعهم للاعتقاد بأنه من المقبول المغادرة مبكرًا.</li>\n                                <li>ب. سيحفز الموظفين على العمل بجدية أكبر لأنهم يرون كمال كقائد مرن.</li>\n                                <li>ج. لن يكون له أي تأثير على دوره الجديد لأن سلوكه الماضي كموظف مبيعات لا يهم.</li>\n                            </ul>\n                        </div>\n                        <div class=\"bg-white/60 p-4 rounded-lg\">\n                            <p class=\"font-bold text-sm text-indigo-900 mb-2\">2. ماذا يجب أن يفعل كمال للحفاظ على سلطته كمدير جديد مع تعزيز العلاقات الإيجابية مع فريقه؟</p>\n                            <ul class=\"text-sm text-indigo-800 space-y-1 ml-2\">\n                                <li>أ. يجب على كمال فرض القواعد بصرامة مع مساحة صغيرة للمرونة.</li>\n                                <li>ب. يجب على كمال وضع توقعات واضحة ولكنه يكون أيضًا ودودًا ومنفتحًا للنقاش.</li>\n                                <li>ج. يجب على كمال تجنب مواجهة موظفيه للحفاظ على علاقة ودية.</li>\n                            </ul>\n                        </div>\n                        <div class=\"bg-white/60 p-4 rounded-lg\">\n                            <p class=\"font-bold text-sm text-indigo-900 mb-2\">3. ما هو الدور الذي يلعبه الاتساق في السلوك في الإدارة الفعالة؟ كيف قد يؤثر سلوك كمال الماضي على نظرة الفريق إليه كقائد؟</p>\n                            <ul class=\"text-sm text-indigo-800 space-y-1 ml-2\">\n                                <li>أ. الاتساق مهم لأنه يبني الثقة ويحدد توقعات واضحة للفريق.</li>\n                                <li>ب. الاتساق لا يهم؛ كونك مرنًا وتتكيف مع المواقف هو الأكثر أهمية.</li>\n                            </ul>\n                        </div>\n                        <div class=\"bg-white/60 p-4 rounded-lg\">\n                            <p class=\"font-bold text-sm text-indigo-900 mb-2\">4. كيف يمكن لكمال استخدام هذا الحادث كفرصة للنمو القيادي؟ ما الدروس التي يمكن أن يتعلمها من هذه التجربة؟</p>\n                            <ul class=\"text-sm text-indigo-800 space-y-1 ml-2\">\n                                <li>أ. يجب على كمال تجاهل الحادث لأنه خطأ صغير ولن يؤثر على قيادته.</li>\n                                <li>ب. يمكن لكمال استخدام هذا كفرصة لوضع حدود واضحة وإيصال التوقعات للفريق.</li>\n                                <li>ج. يجب على كمال التركيز فقط على فرض القواعد بصرامة لتجنب أي ارتباك في المستقبل.</li>\n                            </ul>\n                        </div>\n                    </div>\n                </div>\n                "}, "questions": [{"s": {"en": "Your team missed a major project deadline. To prevent this, you review the timeline, analyze delays, and establish daily check-ins. Which management function is this?", "ar": "لقد فات فريقك موعد نهائي لمشروع كبير. لمنع حدوث ذلك، قمت بمراجعة الجدول الزمني وتحليل التأخيرات وتحديد اجتماعات يومية. ما هي وظيفة الإدارة هنا؟"}, "o": {"en": ["Planning", "Organizing", "Leading", "Controlling"], "ar": ["التخطيط", "التنظيم", "القيادة", "الرقابة"]}, "a": 3, "e": {"en": "Controlling involves monitoring progress and evaluating performance to make adjustments.", "ar": "تتضمن الرقابة مراقبة التقدم وتقييم الأداء لإجراء التعديلات."}}, {"s": {"en": "You are preparing for the upcoming quarter by defining the team's objectives and deciding which projects will take priority. Which function is this?", "ar": "أنت تستعد للربع القادم من خلال تحديد أهداف الفريق وتحديد المشاريع التي ستأخذ الأولوية. ما هي هذه الوظيفة؟"}, "o": {"en": ["Planning", "Organizing", "Leading", "Controlling"], "ar": ["التخطيط", "التنظيم", "القيادة", "الرقابة"]}, "a": 0, "e": {"en": "Planning is determining the right courses of action and setting objectives.", "ar": "التخطيط هو تحديد مسارات العمل الصحيحة ووضع الأهداف."}}, {"s": {"en": "A new project was approved. You assign specific tasks based on expertise and request a budget for tools. What are you doing?", "ar": "تمت الموافقة على مشروع جديد. تبدأ بتعيين مهام محددة بناءً على الخبرة وتطلب ميزانية للأدوات. ماذا تفعل؟"}, "o": {"en": ["Planning", "Organizing", "Leading", "Controlling"], "ar": ["التخطيط", "التنظيم", "القيادة", "الرقابة"]}, "a": 1, "e": {"en": "Organizing involves coordinating activities, people, and resources.", "ar": "التنظيم ينطوي على تنسيق الأنشطة والأفراد والموارد."}}, {"s": {"en": "Your team feels burned out. You hold a meeting to acknowledge their hard work, share an inspiring vision, and boost morale. Which function is this?", "ar": "يشعر فريقك بالإرهاق. تعقد اجتماعاً لتقدير عملهم الشاق، ومشاركة رؤية ملهمة، ورفع الروح المعنوية. ما هي هذه الوظيفة؟"}, "o": {"en": ["Planning", "Organizing", "Leading", "Controlling"], "ar": ["التخطيط", "التنظيم", "القيادة", "الرقابة"]}, "a": 2, "e": {"en": "Leading involves guiding, inspiring, and motivating people.", "ar": "القيادة تنطوي على توجيه وإلهام وتحفيز الأفراد."}}, {"s": {"en": "An employee made a mistake on a client report. You schedule a 1-on-1 to review the error and discuss how to prevent it. You are treating this mistake as a:", "ar": "ارتكب موظف خطأ في تقرير عميل. تقوم بجدولة اجتماع فردي لمراجعة الخطأ ومناقشة كيفية منعه. أنت تعامل هذا الخطأ على أنه:"}, "o": {"en": ["Reason for termination", "Learning opportunity", "Failure in organizing", "Breach of policy"], "ar": ["سبب لإنهاء الخدمة", "فرصة للتعلم", "فشل في التنظيم", "خرق للسياسة"]}, "a": 1, "e": {"en": "Effective managers treat mistakes as learning opportunities.", "ar": "المديرون الفعالون يعاملون الأخطاء كفرص للتعلم."}}, {"s": {"en": "A manager complains their team relies on them for every minor decision, leaving the manager overwhelmed. The manager likely failed to execute:", "ar": "يشتكي مدير من أن فريقه يعتمد عليه في كل قرار صغير، مما يجعله مثقلاً بالعمل. من المحتمل أن المدير فشل في تنفيذ:"}, "o": {"en": ["Delegating with care", "Communicating transparently", "Acting as a change agent", "Treating mistakes as learning"], "ar": ["التفويض بعناية", "التواصل بشفافية", "العمل كعامل تغيير", "معاملة الأخطاء كتعلم"]}, "a": 0, "e": {"en": "An overwhelmed manager usually indicates a failure to delegate properly.", "ar": "المدير المثقل بالعمل يشير عادة إلى الفشل في التفويض بشكل صحيح."}}, {"s": {"en": "Two team members have different approaches and are arguing. You clarify their roles and help them find a collaborative solution. What teamwork aspect are you enhancing?", "ar": "عضوان في الفريق لديهما مناهج مختلفة ويتجادلان. تقوم بتوضيح أدوارهم ومساعدتهم في إيجاد حل تعاوني. ما هو جانب العمل الجماعي الذي تعززه؟"}, "o": {"en": ["Diversity and collaboration", "Strict hierarchical control", "Theory X management", "Punitive controlling"], "ar": ["التنوع والتعاون", "الرقابة الهرمية الصارمة", "إدارة نظرية X", "الرقابة العقابية"]}, "a": 0, "e": {"en": "Effective teamwork is built through collaboration and respect for diverse thought.", "ar": "يتم بناء العمل الجماعي الفعال من خلال التعاون واحترام التفكير المتنوع."}}, {"s": {"en": "You are a new manager known for working late and doing everything yourself. If you continue this behavior, what is the likely outcome?", "ar": "أنت مدير جديد معروف بالعمل لوقت متأخر والقيام بكل شيء بنفسك. إذا واصلت هذا السلوك، فما هي النتيجة المحتملة؟"}, "o": {"en": ["High team morale", "Highly skilled team", "You become a bottleneck and burn out", "Faster projects"], "ar": ["روح معنوية عالية", "فريق ذو مهارات عالية", "تصبح عنق زجاجة وتحترق وظيفياً", "مشاريع أسرع"]}, "a": 2, "e": {"en": "Failing to delegate leads to personal burnout and stifles team growth.", "ar": "الفشل في التفويض يؤدي إلى الاحتراق الشخصي ويخنق نمو الفريق."}}, {"s": {"en": "You create a dashboard tracking weekly KPIs to ensure goals are achieved and resources used efficiently. This tool is primarily used for:", "ar": "قمت بإنشاء لوحة تحكم تتبع مؤشرات الأداء الرئيسية لضمان تحقيق الأهداف. تُستخدم هذه الأداة بشكل أساسي لـ:"}, "o": {"en": ["Planning", "Organizing", "Leading", "Controlling"], "ar": ["التخطيط", "التنظيم", "القيادة", "الرقابة"]}, "a": 3, "e": {"en": "KPI dashboards monitor progress, the core of the Controlling function.", "ar": "تراقب لوحات مؤشرات الأداء التقدم، وهو جوهر وظيفة الرقابة."}}, {"s": {"en": "The industry is shifting and your team must adopt a new platform. You actively champion this transition and help the team adapt. You are acting as a:", "ar": "تتغير الصناعة ويجب على فريقك تبني منصة جديدة. أنت تدافع بنشاط عن هذا الانتقال وتساعد الفريق على التكيف. أنت تعمل كـ:"}, "o": {"en": ["Controller", "Change Agent", "Theory X Leader", "Micro-manager"], "ar": ["مراقب", "عامل تغيير", "قائد نظرية X", "مدير دقيق (مايكرو)"]}, "a": 1, "e": {"en": "Effective managers act as change agents guiding teams through shifts.", "ar": "يعمل المديرون الفعالون كعوامل تغيير لتوجيه الفرق خلال التحولات."}}]}]}, {"id": 2, "title": {"en": "Module 2: Leadership Styles", "ar": "الوحدة ٢: أساليب القيادة"}, "icon": "⚖️", "sections": ["2", "8"], "subsections": [{"sourceId": "2", "title": {"en": "Module 2.a: Leadership Style XY", "ar": "الوحدة ٢.أ: أسلوب القيادة XY"}, "takeaways": {"en": ["Theory X assumes employees inherently dislike work, avoid responsibility, and need strict control.", "Theory Y assumes employees are self-motivated, seek responsibility, and thrive with autonomy.", "Theory X management is often directive, relying on external rewards and consequences.", "Theory Y management is participative, encouraging creativity and problem-solving.", "Applying the wrong approach (like micromanaging a highly skilled team) causes severe demotivation."], "ar": ["نظرية X تفترض أن الموظفين يكرهون العمل بطبيعتهم، ويتجنبون المسؤولية، ويحتاجون إلى رقابة صارمة.", "نظرية Y تفترض أن الموظفين لديهم دوافع ذاتية، ويسعون للمسؤولية، ويزدهرون بالاستقلالية.", "إدارة نظرية X غالباً ما تكون توجيهية، وتعتمد على المكافآت والعواقب الخارجية.", "إدارة نظرية Y تشاركية، وتشجع على الإبداع وحل المشكلات.", "تطبيق النهج الخاطئ (مثل الإدارة الدقيقة لفريق عالي المهارة) يسبب إحباطاً شديداً."]}, "scoreFeedback": {"perfect": {"en": "Perfect! You clearly understand how to apply Theory X and Theory Y appropriately based on team needs.", "ar": "مثالي! أنت تفهم بوضوح كيفية تطبيق نظرية X ونظرية Y بشكل مناسب بناءً على احتياجات الفريق."}, "high": {"en": "Perfect! You clearly understand how to apply Theory X and Theory Y appropriately based on team needs.", "ar": "مثالي! أنت تفهم بوضوح كيفية تطبيق نظرية X ونظرية Y بشكل مناسب بناءً على احتياجات الفريق."}, "med": {"en": "Solid effort! Make sure to review when Theory X (strict control) is necessary versus when Theory Y (autonomy) is most effective.", "ar": "جهد جيد! تأكد من مراجعة متى تكون نظرية X (الرقابة الصارمة) ضرورية مقابل متى تكون نظرية Y (الاستقلالية) أكثر فعالية."}, "low": {"en": "Review the core assumptions. Remember: Theory X relies on external control for routine tasks, while Theory Y empowers employees for creative tasks.", "ar": "راجع الافتراضات الأساسية. تذكر: تعتمد نظرية X على الرقابة الخارجية للمهام الروتينية، بينما تمكّن نظرية Y الموظفين في المهام الإبداعية."}}, "activity": null, "questions": [{"s": {"en": "You assume your team dislikes work, avoids responsibility, and needs constant monitoring. Which theory aligns with your beliefs?", "ar": "أنت تفترض أن فريقك يكره العمل ويتجنب المسؤولية ويحتاج إلى مراقبة مستمرة. أي نظرية تتماشى مع معتقداتك؟"}, "o": {"en": ["Theory Y", "Transformational", "Theory X", "Country Club"], "ar": ["نظرية Y", "التحويلية", "نظرية X", "النادي الاجتماعي"]}, "a": 2, "e": {"en": "Theory X assumes employees dislike work and require close supervision.", "ar": "تفترض نظرية X أن الموظفين يكرهون العمل ويحتاجون لإشراف دقيق."}}, {"s": {"en": "You give your creative designers a general goal but allow them autonomy to choose how they work. Which approach are you using?", "ar": "أنت تعطي المصممين لديك هدفاً عاماً ولكن تسمح لهم بالاستقلالية في اختيار كيفية عملهم. أي نهج تستخدمه؟"}, "o": {"en": ["Theory X", "Theory Y", "Task Management", "Impoverished"], "ar": ["نظرية X", "نظرية Y", "إدارة المهام", "الإدارة الضعيفة"]}, "a": 1, "e": {"en": "Theory Y assumes employees are self-motivated and thrive with autonomy.", "ar": "نظرية Y تفترض أن الموظفين محفزون ذاتياً ويزدهرون بالاستقلالية."}}, {"s": {"en": "You manage a highly regulated assembly line where safety protocols must be followed perfectly. Which approach is most suitable?", "ar": "أنت تدير خط تجميع منظم للغاية حيث يجب اتباع بروتوكولات السلامة بشكل مثالي. أي نهج هو الأنسب؟"}, "o": {"en": ["Theory Y", "Theory X", "Country Club", "Transformational"], "ar": ["نظرية Y", "نظرية X", "نادي اجتماعي", "تحويلية"]}, "a": 1, "e": {"en": "Theory X is useful when tasks require strict adherence to rules and procedures.", "ar": "نظرية X مفيدة عندما تتطلب المهام التزاماً صارماً بالقواعد والإجراءات."}}, {"s": {"en": "You have a highly skilled, self-motivated team, but you constantly monitor their screens and dictate their reports. What is the likely result?", "ar": "لديك فريق عالي المهارة ومحفز ذاتياً، لكنك تراقب شاشاتهم باستمرار وتملي عليهم تقاريرهم. ما هي النتيجة المحتملة؟"}, "o": {"en": ["Increased creativity", "Demotivation due to mismatch", "Transition to Team Management", "Higher motivation"], "ar": ["زيادة الإبداع", "إحباط بسبب عدم التوافق", "انتقال لإدارة الفريق", "دافع أعلى"]}, "a": 1, "e": {"en": "Applying Theory X (micromanagement) to Theory Y employees demotivates them severely.", "ar": "تطبيق نظرية X على موظفي نظرية Y يحبطهم بشدة."}}, {"s": {"en": "An employee approaches you asking for more responsibility and suggests a new way to streamline a process. This behavior strongly reflects:", "ar": "يتقرب منك موظف يطلب المزيد من المسؤولية ويقترح طريقة جديدة لتبسيط عملية. هذا السلوك يعكس بقوة:"}, "o": {"en": ["Theory X avoidance", "Theory Y assumptions", "Low intrinsic motivation", "Need for close supervision"], "ar": ["تجنب نظرية X", "افتراضات نظرية Y", "دافع داخلي منخفض", "حاجة لإشراف دقيق"]}, "a": 1, "e": {"en": "Seeking responsibility and solving problems creatively are core traits of Theory Y.", "ar": "السعي للمسؤولية وحل المشكلات بإبداع هي سمات أساسية لنظرية Y."}}, {"s": {"en": "You believe your team will only meet targets if you threaten to withhold their bonuses. This management style relies heavily on:", "ar": "أنت تعتقد أن فريقك سيحقق الأهداف فقط إذا هددت بحجب مكافآتهم. يعتمد أسلوب الإدارة هذا بشدة على:"}, "o": {"en": ["Intrinsic Motivation", "Theory Y empowerment", "Theory X external control", "Participative leadership"], "ar": ["الدافع الداخلي", "تمكين نظرية Y", "الرقابة الخارجية لنظرية X", "القيادة التشاركية"]}, "a": 2, "e": {"en": "Theory X often relies on external controls, rewards, and punishments.", "ar": "غالباً ما تعتمد نظرية X على الضوابط الخارجية، المكافآت، والعقوبات."}}, {"s": {"en": "You are leading an R&D team creating a groundbreaking new software. Which environment should you foster?", "ar": "أنت تقود فريق بحث وتطوير يبتكر برنامجاً جديداً رائداً. ما هي البيئة التي يجب أن تعززها؟"}, "o": {"en": ["Strict Theory X rules", "Authoritarian directives", "Theory Y autonomy and creativity", "Micromanagement"], "ar": ["قواعد نظرية X صارمة", "توجيهات استبدادية", "استقلالية وإبداع نظرية Y", "إدارة دقيقة (مايكرو)"]}, "a": 2, "e": {"en": "Theory Y works best in environments requiring innovation and creative problem-solving.", "ar": "نظرية Y تعمل بشكل أفضل في البيئات التي تتطلب الابتكار وحل المشكلات الإبداعي."}}, {"s": {"en": "According to Theory Y, where does primary motivation come from?", "ar": "وفقاً لنظرية Y، من أين يأتي الدافع الأساسي؟"}, "o": {"en": ["Fear of job loss", "Responsibility, purpose, and fulfillment", "Strict disciplinary rules", "Only financial bonuses"], "ar": ["الخوف من فقدان الوظيفة", "المسؤولية، الهدف، والرضا", "قواعد تأديبية صارمة", "المكافآت المالية فقط"]}, "a": 1, "e": {"en": "Theory Y posits that people seek fulfillment and are motivated by responsibility.", "ar": "تفترض نظرية Y أن الناس يسعون للرضا ويتحفزون بالمسؤولية."}}, {"s": {"en": "What is a major risk of applying Theory Y to a workforce that actually requires a Theory X approach?", "ar": "ما هو الخطر الرئيسي لتطبيق نظرية Y على قوى عاملة تتطلب فعلياً نهج نظرية X؟"}, "o": {"en": ["Too much innovation", "Lack of structure leading to chaos and missed standards", "Excessive team harmony", "They will work too hard"], "ar": ["ابتكار مفرط", "نقص الهيكل يؤدي للفوضى وتفويت المعايير", "انسجام مفرط للفريق", "سيعملون بجد أكثر من اللازم"]}, "a": 1, "e": {"en": "Giving autonomy to a team that needs clear rules can result in missed deadlines and chaos.", "ar": "إعطاء الاستقلالية لفريق يحتاج إلى قواعد واضحة يمكن أن يؤدي إلى تفويت المواعيد النهائية والفوضى."}}, {"s": {"en": "An employee completely avoids taking any initiative and waits for you to tell them exactly what to do every hour. This confirms:", "ar": "يتجنب الموظف تماماً أخذ أي مبادرة وينتظرك لتخبره بما يجب فعله كل ساعة. هذا يؤكد:"}, "o": {"en": ["Theory Y independence", "A Theory X assumption about avoiding work", "High intrinsic motivation", "Transformational behavior"], "ar": ["استقلالية نظرية Y", "افتراض نظرية X حول تجنب العمل", "دافع داخلي عالي", "سلوك تحويلي"]}, "a": 1, "e": {"en": "Waiting for constant direction aligns with the Theory X view that some employees avoid responsibility.", "ar": "انتظار التوجيه المستمر يتماشى مع وجهة نظر نظرية X بأن بعض الموظفين يتجنبون المسؤولية."}}]}, {"sourceId": "8", "title": {"en": "Module 2.b: The Managerial Grid", "ar": "الوحدة ٢.ب: الشبكة الإدارية"}, "takeaways": {"en": ["The Managerial Grid balances Concern for People vs. Concern for Production.", "1.9 Country Club Management focuses heavily on team harmony, often at the expense of results.", "9.1 Task Management focuses strictly on results and efficiency, useful in emergencies.", "9.9 Team Management maximizes both team development and high performance.", "5.5 Middle-of-the-Road balances both needs but maximizes neither.", "1.1 Impoverished Management represents the bare minimum effort to keep a job."], "ar": ["الشبكة الإدارية توازن بين الاهتمام بالأفراد والاهتمام بالإنتاج.", "أسلوب 1.9 (نادي اجتماعي) يركز بشدة على انسجام الفريق، غالباً على حساب النتائج.", "إدارة المهام 9.1 تركز بصرامة على النتائج والكفاءة، ومفيدة في حالات الطوارئ.", "إدارة الفريق 9.9 تزيد من تطور الفريق والأداء العالي إلى أقصى حد.", "أسلوب 5.5 (منتصف الطريق) يوازن بين الاحتياجين ولكنه لا يعظم أياً منهما.", "الإدارة الضعيفة 1.1 تمثل الحد الأدنى من الجهد للحفاظ على الوظيفة."]}, "scoreFeedback": {"perfect": {"en": "Outstanding! You've mastered Blake and Mouton's Managerial Grid and know exactly when to use each style.", "ar": "رائع! لقد أتقنت الشبكة الإدارية لبليك وموتون وتعرف بالضبط متى تستخدم كل أسلوب."}, "high": {"en": "Outstanding! You've mastered Blake and Mouton's Managerial Grid and know exactly when to use each style.", "ar": "رائع! لقد أتقنت الشبكة الإدارية لبليك وموتون وتعرف بالضبط متى تستخدم كل أسلوب."}, "med": {"en": "Good work. Review the subtle differences between 5.5 Middle-of-the-Road and 9.9 Team Management.", "ar": "عمل جيد. راجع الفروق الدقيقة بين أسلوب 5.5 (منتصف الطريق) وأسلوب 9.9 (إدارة الفريق)."}, "low": {"en": "Focus your review on the two dimensions: Concern for People vs. Concern for Production, and how they combine to form the 5 distinct styles.", "ar": "ركز في مراجعتك على البعدين: الاهتمام بالأفراد مقابل الاهتمام بالإنتاج، وكيف يندمجان لتشكيل أساليب القيادة الخمسة المختلفة."}}, "activity": {"en": "\n                <div class=\"bg-indigo-50 border border-indigo-100 rounded-xl p-6 shadow-sm\">\n                    <h3 class=\"font-bold text-indigo-900 mb-4 text-xl flex items-center gap-2 border-b border-indigo-200 pb-3\">\n                        <i class=\"fa-solid fa-users-viewfinder\"></i> Group Work: Leadership Styles\n                    </h3>\n                    <p class=\"text-sm text-indigo-900 leading-relaxed mb-4\"><strong>Instructions:</strong> For each of the following real-life scenarios, identify the correct leadership style (1,9 – Country Club, 9,1 – Task Management, 1,1 – Impoverished, 5,5 – Middle of the Road, 9,9 – Team Management). Discuss with your group and fill in the blanks.</p>\n                    <div class=\"space-y-4\">\n                        <div class=\"bg-white/60 p-4 rounded-lg text-sm text-indigo-900\">\n                            <p class=\"mb-3\"><strong>Scenario 1:</strong> A new team has just been formed in your organization. The team members come from different backgrounds, and there is a need to quickly build trust and morale. You focus on motivating the team through recognition, creating a positive atmosphere, and fostering strong relationships.</p>\n                            <div class=\"flex items-center gap-2\"><span class=\"font-bold\">Leadership Style:</span> <div class=\"border-b-2 border-indigo-300 flex-1 border-dashed max-w-xs h-4\"></div></div>\n                        </div>\n                        <div class=\"bg-white/60 p-4 rounded-lg text-sm text-indigo-900\">\n                            <p class=\"mb-3\"><strong>Scenario 2:</strong> You’re facing an urgent crisis situation in your company, and quick decisions need to be made to resolve the issue. You give clear, non-negotiable tasks to your team, with strict deadlines and little room for discussion. The focus is on completing the task as efficiently as possible.</p>\n                            <div class=\"flex items-center gap-2\"><span class=\"font-bold\">Leadership Style:</span> <div class=\"border-b-2 border-indigo-300 flex-1 border-dashed max-w-xs h-4\"></div></div>\n                        </div>\n                        <div class=\"bg-white/60 p-4 rounded-lg text-sm text-indigo-900\">\n                            <p class=\"mb-3\"><strong>Scenario 3:</strong> You have a team working on a routine project where the tasks are repetitive and the situation is not critical. The decisions you make are not expected to have a significant impact, and the team doesn’t require much guidance or input. You allow team members to carry out their tasks with minimal interference.</p>\n                            <div class=\"flex items-center gap-2\"><span class=\"font-bold\">Leadership Style:</span> <div class=\"border-b-2 border-indigo-300 flex-1 border-dashed max-w-xs h-4\"></div></div>\n                        </div>\n                        <div class=\"bg-white/60 p-4 rounded-lg text-sm text-indigo-900\">\n                            <p class=\"mb-3\"><strong>Scenario 4:</strong> You are managing a moderately motivated team, and there’s ongoing conflict between team members. You schedule feedback sessions to address concerns, while trying to balance team performance with individual needs. You aim to maintain a moderate level of productivity while keeping the team’s morale stable.</p>\n                            <div class=\"flex items-center gap-2\"><span class=\"font-bold\">Leadership Style:</span> <div class=\"border-b-2 border-indigo-300 flex-1 border-dashed max-w-xs h-4\"></div></div>\n                        </div>\n                        <div class=\"bg-white/60 p-4 rounded-lg text-sm text-indigo-900\">\n                            <p class=\"mb-3\"><strong>Scenario 5:</strong> You are leading a highly skilled and motivated team that excels in their work. You focus on fostering innovation, encouraging idea generation, and helping your team members grow professionally. You provide support and guidance while promoting collaboration.</p>\n                            <div class=\"flex items-center gap-2\"><span class=\"font-bold\">Leadership Style:</span> <div class=\"border-b-2 border-indigo-300 flex-1 border-dashed max-w-xs h-4\"></div></div>\n                        </div>\n                    </div>\n                </div>\n                ", "ar": "\n                <div class=\"bg-indigo-50 border border-indigo-100 rounded-xl p-6 shadow-sm\">\n                    <h3 class=\"font-bold text-indigo-900 mb-4 text-xl flex items-center gap-2 border-b border-indigo-200 pb-3\">\n                        <i class=\"fa-solid fa-users-viewfinder\"></i> نشاط عمل جماعي: أساليب القيادة\n                    </h3>\n                    <p class=\"text-sm text-indigo-900 leading-relaxed mb-4\"><strong>التعليمات:</strong> لكل من السيناريوهات الواقعية التالية، ناقش مع مجموعتك وحدد أسلوب القيادة الصحيح (1.9 – نادي اجتماعي، 9.1 – إدارة المهام، 1.1 – إدارة ضعيفة، 5.5 – منتصف الطريق، 9.9 – إدارة الفريق). املأ الفراغ بأسلوب القيادة المناسب.</p>\n                    <div class=\"space-y-4\">\n                        <div class=\"bg-white/60 p-4 rounded-lg text-sm text-indigo-900\">\n                            <p class=\"mb-3\"><strong>السيناريو 1:</strong> تم تشكيل فريق جديد للتو في مؤسستك. يأتي أعضاء الفريق من خلفيات مختلفة، وهناك حاجة لبناء الثقة والروح المعنوية بسرعة. أنت تركز على تحفيز الفريق من خلال التقدير، وخلق جو إيجابي، وتعزيز العلاقات القوية.</p>\n                            <div class=\"flex items-center gap-2\"><span class=\"font-bold\">أسلوب القيادة:</span> <div class=\"border-b-2 border-indigo-300 flex-1 border-dashed max-w-xs h-4\"></div></div>\n                        </div>\n                        <div class=\"bg-white/60 p-4 rounded-lg text-sm text-indigo-900\">\n                            <p class=\"mb-3\"><strong>السيناريو 2:</strong> أنت تواجه وضع أزمة عاجلة في شركتك، ويجب اتخاذ قرارات سريعة لحل المشكلة. تعطي مهام واضحة وغير قابلة للتفاوض لفريقك، مع مواعيد نهائية صارمة ومساحة صغيرة للنقاش. التركيز ينصب على إكمال المهمة بكفاءة قدر الإمكان.</p>\n                            <div class=\"flex items-center gap-2\"><span class=\"font-bold\">أسلوب القيادة:</span> <div class=\"border-b-2 border-indigo-300 flex-1 border-dashed max-w-xs h-4\"></div></div>\n                        </div>\n                        <div class=\"bg-white/60 p-4 rounded-lg text-sm text-indigo-900\">\n                            <p class=\"mb-3\"><strong>السيناريو 3:</strong> لديك فريق يعمل على مشروع روتيني حيث المهام متكررة والوضع ليس حرجًا. لا يُتوقع أن يكون للقرارات التي تتخذها تأثير كبير، ولا يحتاج الفريق إلى الكثير من التوجيه أو المدخلات. تسمح لأعضاء الفريق بتنفيذ مهامهم بأقل تدخل.</p>\n                            <div class=\"flex items-center gap-2\"><span class=\"font-bold\">أسلوب القيادة:</span> <div class=\"border-b-2 border-indigo-300 flex-1 border-dashed max-w-xs h-4\"></div></div>\n                        </div>\n                        <div class=\"bg-white/60 p-4 rounded-lg text-sm text-indigo-900\">\n                            <p class=\"mb-3\"><strong>السيناريو 4:</strong> أنت تدير فريقًا متحفزًا باعتدال، وهناك نزاع مستمر بين أعضاء الفريق. تقوم بجدولة جلسات ملاحظات لمعالجة المخاوف، مع محاولة الموازنة بين أداء الفريق والاحتياجات الفردية. تهدف إلى الحفاظ على مستوى معتدل من الإنتاجية مع الحفاظ على استقرار الروح المعنوية للفريق.</p>\n                            <div class=\"flex items-center gap-2\"><span class=\"font-bold\">أسلوب القيادة:</span> <div class=\"border-b-2 border-indigo-300 flex-1 border-dashed max-w-xs h-4\"></div></div>\n                        </div>\n                        <div class=\"bg-white/60 p-4 rounded-lg text-sm text-indigo-900\">\n                            <p class=\"mb-3\"><strong>السيناريو 5:</strong> أنت تقود فريقًا عالي المهارة والدافع يتفوق في عمله. أنت تركز على تعزيز الابتكار، وتشجيع توليد الأفكار، ومساعدة أعضاء فريقك على النمو مهنيًا. أنت تقدم الدعم والتوجيه مع تعزيز التعاون.</p>\n                            <div class=\"flex items-center gap-2\"><span class=\"font-bold\">أسلوب القيادة:</span> <div class=\"border-b-2 border-indigo-300 flex-1 border-dashed max-w-xs h-4\"></div></div>\n                        </div>\n                    </div>\n                </div>\n                "}, "questions": [{"s": {"en": "Your primary focus is ensuring everyone gets along and is happy. However, your department frequently misses deadlines. What Grid style is this?", "ar": "تركيزك الأساسي هو التأكد من انسجام وسعادة الجميع. ومع ذلك، تفوت إدارتك المواعيد النهائية بشكل متكرر. ما هو أسلوب الشبكة هذا؟"}, "o": {"en": ["Task Management", "1.9 Country Club", "Team Management", "Middle-of-the-Road"], "ar": ["إدارة المهام", "1.9 نادي اجتماعي", "إدارة الفريق", "منتصف الطريق"]}, "a": 1, "e": {"en": "1.9 Country Club focuses heavily on harmony at the expense of results.", "ar": "أسلوب 1.9 يركز بشدة على الانسجام على حساب النتائج."}}, {"s": {"en": "There is an absolute emergency: the main server is down. You start giving direct, strict orders to fix it immediately without discussion. Which style is most appropriate here?", "ar": "هناك حالة طوارئ مطلقة: الخادم الرئيسي معطل. تبدأ في إعطاء أوامر مباشرة وصارمة لإصلاحه فوراً دون نقاش. أي أسلوب هو الأنسب هنا؟"}, "o": {"en": ["Country Club", "Team Management", "9.1 Task Management", "Impoverished"], "ar": ["النادي الاجتماعي", "إدارة الفريق", "9.1 إدارة المهام", "الإدارة الضعيفة"]}, "a": 2, "e": {"en": "9.1 Task Management is necessary during emergencies and strict deadlines.", "ar": "إدارة المهام 9.1 ضرورية أثناء الطوارئ والمواعيد النهائية الصارمة."}}, {"s": {"en": "You balance moderate production goals with maintaining acceptable morale. You compromise often to keep things moving. Which Grid style are you exhibiting?", "ar": "أنت توازن بين أهداف الإنتاج المعتدلة والحفاظ على الروح المعنوية المقبولة. أنت تساوم كثيراً لإبقاء الأمور تسير. أي أسلوب تظهره؟"}, "o": {"en": ["Impoverished", "5.5 Middle-of-the-Road", "Team Management", "Country Club"], "ar": ["ضعيفة", "5.5 منتصف الطريق", "إدارة الفريق", "نادي اجتماعي"]}, "a": 1, "e": {"en": "5.5 Middle-of-the-Road balances results and people needs moderately.", "ar": "أسلوب 5.5 يوازن بين النتائج واحتياجات الأفراد بشكل معتدل."}}, {"s": {"en": "You empower your team to collaborate on goals. You focus on maximizing both team development and high performance. Which style is this?", "ar": "أنت تمكن فريقك من التعاون في الأهداف. تركز على تعظيم كل من تطوير الفريق والأداء العالي. أي أسلوب هذا؟"}, "o": {"en": ["9.9 Team Management", "Task Management", "Middle-of-the-Road", "Impoverished"], "ar": ["9.9 إدارة الفريق", "إدارة المهام", "منتصف الطريق", "إدارة ضعيفة"]}, "a": 0, "e": {"en": "9.9 Team Management is collaborative, focusing on high performance and people.", "ar": "إدارة الفريق 9.9 تعاونية، تركز على الأداء العالي والأفراد."}}, {"s": {"en": "A manager does the bare minimum to keep their job, avoids making decisions, and isolates themselves from the team. What style is this?", "ar": "مدير يبذل الحد الأدنى للحفاظ على وظيفته، يتجنب اتخاذ القرارات، ويعزل نفسه عن الفريق. ما هذا الأسلوب؟"}, "o": {"en": ["Middle-of-the-Road", "1.1 Impoverished", "Theory Y", "Task Management"], "ar": ["منتصف الطريق", "1.1 إدارة ضعيفة", "نظرية Y", "إدارة المهام"]}, "a": 1, "e": {"en": "1.1 Impoverished involves minimum effort, lacking concern for people or production.", "ar": "الإدارة الضعيفة 1.1 تنطوي على الحد الأدنى من الجهد دون اهتمام بالأفراد أو الإنتاج."}}, {"s": {"en": "You notice your leadership approach usually stays the same across different teams and situations. This is an example of leadership:", "ar": "تلاحظ أن نهج قيادتك يظل كما هو عادة عبر فرق ومواقف مختلفة. هذا مثال على:"}, "o": {"en": ["Adaptability", "Inconsistency", "Consistency", "Transformationalism"], "ar": ["القدرة على التكيف", "عدم الاتساق", "الاتساق / الثبات", "التحويلية"]}, "a": 2, "e": {"en": "Consistency means a leader's foundational style remains stable over time.", "ar": "الاتساق يعني أن الأسلوب الأساسي للقائد يظل مستقراً بمرور الوقت."}}, {"s": {"en": "Your team just finished an exhausting 6-month crunch period and morale is severely low. What short-term style might help rebuild trust and energy?", "ar": "لقد أنهى فريقك للتو فترة ضغط مرهقة استمرت 6 أشهر والروح المعنوية منخفضة للغاية. ما الأسلوب قصير المدى الذي قد يساعد في إعادة بناء الثقة والطاقة؟"}, "o": {"en": ["9.1 Task Management", "1.1 Impoverished", "1.9 Country Club", "Strict Theory X"], "ar": ["9.1 إدارة المهام", "1.1 إدارة ضعيفة", "1.9 نادي اجتماعي", "نظرية X صارمة"]}, "a": 2, "e": {"en": "1.9 Country Club focuses purely on people needs, useful for recovery and morale building.", "ar": "النادي الاجتماعي 1.9 يركز بحتة على احتياجات الأفراد، وهو مفيد للتعافي وبناء الروح المعنوية."}}, {"s": {"en": "A factory is failing to meet basic output metrics, and the company's survival is at stake. The manager must strictly enforce quotas immediately. Best style?", "ar": "يفشل مصنع في تلبية مقاييس الإنتاج الأساسية، وبقاء الشركة على المحك. يجب على المدير فرض حصص صارمة على الفور. ما هو أفضل أسلوب؟"}, "o": {"en": ["1.9 Country Club", "9.1 Task Management", "5.5 Middle-of-the-Road", "1.1 Impoverished"], "ar": ["1.9 نادي اجتماعي", "9.1 إدارة المهام", "5.5 منتصف الطريق", "1.1 إدارة ضعيفة"]}, "a": 1, "e": {"en": "When survival and strict targets are priority, 9.1 Task Management is required.", "ar": "عندما تكون النجاة والأهداف الصارمة هي الأولوية، فإن إدارة المهام 9.1 مطلوبة."}}, {"s": {"en": "According to Blake and Mouton, what is generally the ultimate goal style for sustainable, long-term organizational success?", "ar": "وفقاً لبليك وموتون، ما هو بشكل عام أسلوب الهدف النهائي للنجاح التنظيمي المستدام طويل الأجل؟"}, "o": {"en": ["5.5 Middle-of-the-Road", "9.1 Task Management", "9.9 Team Management", "1.9 Country Club"], "ar": ["5.5 منتصف الطريق", "9.1 إدارة المهام", "9.9 إدارة الفريق", "1.9 نادي اجتماعي"]}, "a": 2, "e": {"en": "9.9 Team Management maximizes both human capital and production outputs.", "ar": "إدارة الفريق 9.9 تزيد من رأس المال البشري ومخرجات الإنتاج إلى أقصى حد."}}, {"s": {"en": "The Managerial Grid maps leadership styles across which two dimensions?", "ar": "ترسم الشبكة الإدارية أساليب القيادة عبر أي بُعدين؟"}, "o": {"en": ["Skill and Will", "Concern for People and Concern for Production", "Intrinsic and Extrinsic Motivation", "Directing and Coaching"], "ar": ["المهارة والإرادة", "الاهتمام بالأفراد والاهتمام بالإنتاج", "الدافع الداخلي والخارجي", "التوجيه والتدريب"]}, "a": 1, "e": {"en": "The Grid specifically measures Concern for People against Concern for Production.", "ar": "تقيس الشبكة تحديداً الاهتمام بالأفراد مقابل الاهتمام بالإنتاج."}}]}]}, {"id": 3, "title": {"en": "Module 3: Skill-Will Matrix", "ar": "الوحدة ٣: مصفوفة المهارة والإرادة"}, "icon": "🧭", "sections": ["3"], "subsections": [{"sourceId": "3", "title": {"en": "Module 3: Skill-Will Matrix", "ar": "الوحدة ٣: مصفوفة المهارة والإرادة"}, "takeaways": {"en": ["Managers must assess both Skill (ability) and Will (motivation).", "Low Skill / High Will: Guide them (coaching and feedback).", "High Skill / High Will: Delegate to them (empower and challenge).", "Low Skill / Low Will: Direct them (set clear rules and monitor).", "High Skill / Low Will: Excite them (find what motivates them to re-engage)."], "ar": ["يجب على المديرين تقييم كل من المهارة (القدرة) والإرادة (الدافع).", "مهارة منخفضة / إرادة عالية: التوجيه (تدريب وملاحظات).", "مهارة عالية / إرادة عالية: التفويض (التمكين والتحدي).", "مهارة منخفضة / إرادة منخفضة: الإصدار المباشر للأوامر (وضع قواعد واضحة ومراقبة).", "مهارة عالية / إرادة منخفضة: التحفيز والإثارة (اكتشاف الدوافع لإعادة إدماجهم)."]}, "scoreFeedback": {"perfect": {"en": "Great job! You know exactly how to Guide, Delegate, Direct, and Excite based on an employee's skill and motivation.", "ar": "عمل رائع! أنت تعرف بالضبط كيف تقوم بالتوجيه، التفويض، الأوامر، والتحفيز بناءً على مهارة الموظف ودافعه."}, "high": {"en": "Great job! You know exactly how to Guide, Delegate, Direct, and Excite based on an employee's skill and motivation.", "ar": "عمل رائع! أنت تعرف بالضبط كيف تقوم بالتوجيه، التفويض، الأوامر، والتحفيز بناءً على مهارة الموظف ودافعه."}, "med": {"en": "Good! Make sure you don't confuse 'Guide' (Low Skill/High Will) with 'Direct' (Low Skill/Low Will).", "ar": "جيد! تأكد من عدم الخلط بين 'التوجيه' (مهارة منخفضة/إرادة عالية) و 'الأوامر' (مهارة منخفضة/إرادة منخفضة)."}, "low": {"en": "Review the four quadrants of the Skill-Will Matrix. Remember that assessing both ability (skill) and motivation (will) is critical.", "ar": "راجع الأرباع الأربعة لمصفوفة المهارة-الإرادة. تذكر أن تقييم كل من القدرة (المهارة) والدافع (الإرادة) أمر بالغ الأهمية."}}, "activity": {"en": "\n                <div class=\"bg-indigo-50 border border-indigo-100 rounded-xl p-6 shadow-sm\">\n                    <h3 class=\"font-bold text-indigo-900 mb-4 text-xl flex items-center gap-2 border-b border-indigo-200 pb-3\">\n                        <i class=\"fa-solid fa-users-viewfinder\"></i> Group Work: Managing a New Team\n                    </h3>\n                    <p class=\"text-sm text-indigo-900 leading-relaxed mb-4\">Salah has recently joined an organization as the HR Manager, overseeing a team of four employees:</p>\n                    <ul class=\"list-disc ml-5 text-sm text-indigo-900 leading-relaxed space-y-2 mb-6\">\n                        <li><strong>Khalid:</strong> Senior HR Generalist, highly experienced, ambitious, and a consistent high performer. He applied for the manager role but didn’t get it due to lack of managerial experience.</li>\n                        <li><strong>Sarah:</strong> Recruiter with strong skills and years of experience. However, she seems disengaged and unmotivated. Sarah gets bored once she masters tasks and has a history of changing jobs every 3–4 years.</li>\n                        <li><strong>Laila:</strong> Payroll Officer with a positive attitude and strong willingness to learn but lacks attention to detail and makes frequent mistakes.</li>\n                        <li><strong>Omar:</strong> HR Coordinator with limited skills and motivation. He has expressed an interest in moving to a career in Marketing & Communications instead of HR.</li>\n                    </ul>\n                    <p class=\"text-sm text-indigo-900 font-medium mb-4\">After observing the team for two months, Salah wants to address their motivation and performance challenges to better align with organizational goals.</p>\n                    \n                    <div class=\"bg-white/60 p-4 rounded-lg\">\n                        <h4 class=\"font-bold text-indigo-900 mb-3\"><i class=\"fa-solid fa-clipboard-question mr-1\"></i> The Situation (Imagine you are in Salah’s position):</h4>\n                        <ol class=\"list-decimal ml-4 text-sm text-indigo-900 space-y-2 font-semibold\">\n                            <li>How would you handle this team?</li>\n                            <li>What steps would you take to better understand and support each team member?</li>\n                            <li>How would you approach improving their performance and engagement?</li>\n                        </ol>\n                    </div>\n                </div>\n                ", "ar": "\n                <div class=\"bg-indigo-50 border border-indigo-100 rounded-xl p-6 shadow-sm\">\n                    <h3 class=\"font-bold text-indigo-900 mb-4 text-xl flex items-center gap-2 border-b border-indigo-200 pb-3\">\n                        <i class=\"fa-solid fa-users-viewfinder\"></i> نشاط عمل جماعي: إدارة فريق جديد\n                    </h3>\n                    <p class=\"text-sm text-indigo-900 leading-relaxed mb-4\">انضم صلاح مؤخرًا إلى مؤسسة كمدير للموارد البشرية، ويشرف على فريق مكون من أربعة موظفين:</p>\n                    <ul class=\"list-disc mr-5 text-sm text-indigo-900 leading-relaxed space-y-2 mb-6\">\n                        <li><strong>خالد:</strong> أخصائي موارد بشرية أول، ذو خبرة عالية وطموح، وأداء عالٍ باستمرار. تقدم بطلب للحصول على منصب المدير لكنه لم يحصل عليه بسبب افتقاره للخبرة الإدارية.</li>\n                        <li><strong>سارة:</strong> مسؤولة توظيف بمهارات قوية وسنوات من الخبرة. ومع ذلك، تبدو غير مندمجة وغير متحفزة. تشعر سارة بالملل بمجرد إتقانها للمهام ولديها تاريخ في تغيير الوظائف كل 3-4 سنوات.</li>\n                        <li><strong>ليلى:</strong> مسؤولة رواتب تتمتع بموقف إيجابي ورغبة قوية في التعلم، لكنها تفتقر إلى الاهتمام بالتفاصيل وترتكب أخطاء متكررة.</li>\n                        <li><strong>عمر:</strong> منسق موارد بشرية بمهارات ودافع محدودين. أعرب عن اهتمامه بالانتقال إلى مسار مهني في التسويق والاتصالات بدلاً من الموارد البشرية.</li>\n                    </ul>\n                    <p class=\"text-sm text-indigo-900 font-medium mb-4\">بعد مراقبة الفريق لمدة شهرين، يرغب صلاح في معالجة تحديات التحفيز والأداء لديهم للتوافق بشكل أفضل مع الأهداف التنظيمية.</p>\n                    \n                    <div class=\"bg-white/60 p-4 rounded-lg\">\n                        <h4 class=\"font-bold text-indigo-900 mb-3\"><i class=\"fa-solid fa-clipboard-question ml-1\"></i> الموقف (تخيل أنك في موقف صلاح):</h4>\n                        <ol class=\"list-decimal mr-4 text-sm text-indigo-900 space-y-2 font-semibold\">\n                            <li>كيف ستدير هذا الفريق؟</li>\n                            <li>ما الخطوات التي ستتخذها لفهم ودعم كل عضو في الفريق بشكل أفضل؟</li>\n                            <li>كيف ستتعامل مع مسألة تحسين أدائهم ومشاركتهم؟</li>\n                        </ol>\n                    </div>\n                </div>\n                "}, "questions": [{"s": {"en": "Sarah is eager to learn but has never used the software required for her role. Based on the Skill-Will Matrix, how should you manage her?", "ar": "سارة متحمسة للتعلم لكنها لم تستخدم أبداً البرنامج المطلوب لدورها. بناءً على مصفوفة المهارة-الإرادة، كيف يجب أن تديرها؟"}, "o": {"en": ["Delegate", "Direct", "Guide", "Excite"], "ar": ["تفويض", "إصدار أوامر", "توجيه", "إثارة وتحفيز"]}, "a": 2, "e": {"en": "Low Skill / High Will requires a 'Guide' approach: coaching and instructions.", "ar": "مهارة منخفضة/إرادة عالية تتطلب التوجيه: التدريب والتعليمات."}}, {"s": {"en": "David knows the systems perfectly, but recently seems bored and lacks enthusiasm. Which category does he fall into?", "ar": "يعرف ديفيد الأنظمة تماماً، لكنه يبدو مؤخراً يشعر بالملل ويفتقر إلى الحماس. في أي فئة يقع؟"}, "o": {"en": ["High Skill / High Will", "High Skill / Low Will", "Low Skill / Low Will", "Low Skill / High Will"], "ar": ["مهارة عالية/إرادة عالية", "مهارة عالية/إرادة منخفضة", "مهارة منخفضة/إرادة منخفضة", "مهارة منخفضة/إرادة عالية"]}, "a": 1, "e": {"en": "High Skill but Low Will places him in the 'Excite' category.", "ar": "مهارة عالية لكن إرادة منخفضة تضعه في فئة 'الإثارة'."}}, {"s": {"en": "Maria consistently exceeds targets and suggests improvements. How should you manage her?", "ar": "ماريا تتجاوز الأهداف باستمرار وتقترح تحسينات. كيف يجب أن تديرها؟"}, "o": {"en": ["Guide step-by-step", "Delegate responsibilities", "Direct with rules", "Counsel on motivation"], "ar": ["توجيه خطوة بخطوة", "تفويض المسؤوليات", "إصدار أوامر بقواعد", "تقديم استشارة للدافع"]}, "a": 1, "e": {"en": "High Skill / High Will employees should be Delegated to. Empower them.", "ar": "يجب التفويض للموظفين ذوي المهارة/الإرادة العالية وتمكينهم."}}, {"s": {"en": "John lacks technical skills for his new role and is very unhappy about the transfer. What is your management approach?", "ar": "يفتقر جون للمهارات الفنية لدوره الجديد وهو غير سعيد بالنقل. ما هو نهجك الإداري؟"}, "o": {"en": ["Delegate", "Guide", "Excite", "Direct"], "ar": ["تفويض", "توجيه", "إثارة", "إصدار أوامر"]}, "a": 3, "e": {"en": "Low Skill / Low Will requires 'Direct': clear direction and monitoring.", "ar": "مهارة/إرادة منخفضة تتطلب 'إصدار أوامر': توجيه واضح ومراقبة."}}, {"s": {"en": "You are 'Guiding' an employee (Low Skill/High Will). Which action is most appropriate?", "ar": "أنت 'توجه' موظفاً (مهارة منخفضة/إرادة عالية). أي إجراء هو الأنسب؟"}, "o": {"en": ["Explore reasons for low motivation", "Empower all decisions", "Provide hands-on practice", "Issue formal warning"], "ar": ["استكشاف أسباب انخفاض الدافع", "تمكين كل القرارات", "توفير ممارسة عملية", "إصدار تحذير رسمي"]}, "a": 2, "e": {"en": "Guiding involves building skills through coaching and practice.", "ar": "التوجيه ينطوي على بناء المهارات من خلال التدريب والممارسة."}}, {"s": {"en": "To 'Excite' a High Skill / Low Will employee, what action should you take?", "ar": "لـ 'إثارة' موظف (مهارة عالية/إرادة منخفضة)، ما الإجراء الذي يجب اتخاذه؟"}, "o": {"en": ["Step-by-step instructions", "Open discussion to reconnect with goals", "Promote immediately", "Micromanage"], "ar": ["تعليمات خطوة بخطوة", "مناقشة مفتوحة لإعادة ربط الأهداف", "ترقية فورية", "إدارة دقيقة (مايكرو)"]}, "a": 1, "e": {"en": "Exciting involves exploring motivation reasons to re-engage them.", "ar": "الإثارة تنطوي على استكشاف أسباب الدافع لإعادة إدماجهم."}}, {"s": {"en": "An employee in 'Direct' fails to improve after months of structured plans. What is the goal of this approach?", "ar": "فشل موظف في فئة 'الأوامر' في التحسن بعد أشهر. ما هو الهدف من هذا النهج؟"}, "o": {"en": ["To promote them", "Clarify if they need a new role/direction", "Make them team leader", "Delegate everything"], "ar": ["ترقيتهم", "توضيح ما إذا كانوا بحاجة لدور/اتجاه جديد", "جعلهم قادة", "تفويض كل شيء"]}, "a": 1, "e": {"en": "The goal of Direct is to clarify if they can improve or need a different role.", "ar": "الهدف من الأوامر هو توضيح ما إذا كان بإمكانهم التحسن أو يحتاجون لدور آخر."}}, {"s": {"en": "According to the Skill-Will Matrix, why is treating all employees the same ineffective?", "ar": "بناءً على المصفوفة، لماذا يعتبر معاملة جميع الموظفين بنفس الطريقة غير فعال؟"}, "o": {"en": ["Skill and motivation vary per person", "All have High Will", "Delegation is the only style", "Theory X is always right"], "ar": ["المهارة والدافع يختلفان لكل شخص", "الجميع لديهم إرادة عالية", "التفويض هو الأسلوب الوحيد", "نظرية X صحيحة دائماً"]}, "a": 0, "e": {"en": "Managers must assess unique skill and motivation to choose the right approach.", "ar": "يجب على المديرين تقييم المهارة والدافع الفريدين لاختيار النهج الصحيح."}}, {"s": {"en": "You delegated a major project to a High Skill/High Will employee. What else should you do?", "ar": "قمت بتفويض مشروع لموظف عالي المهارة/الإرادة. ماذا يجب أن تفعل أيضاً؟"}, "o": {"en": ["Check work hourly", "Recognize their contribution", "Demote them", "Provide basic training"], "ar": ["فحص العمل كل ساعة", "الاعتراف بمساهمتهم", "خفض رتبتهم", "توفير تدريب أساسي"]}, "a": 1, "e": {"en": "Recognizing contributions keeps delegated employees engaged and growing.", "ar": "الاعتراف بالمساهمات يحافظ على تفاعل الموظفين المفوضين ونموهم."}}, {"s": {"en": "Will (Motivation) in the Matrix is influenced by which of the following?", "ar": "الإرادة (الدافع) في المصفوفة تتأثر بأي مما يلي؟"}, "o": {"en": ["Only base salary", "Years of experience", "Professional goals and job satisfaction", "Manager's tech abilities"], "ar": ["الراتب الأساسي فقط", "سنوات الخبرة", "الأهداف المهنية والرضا الوظيفي", "القدرات الفنية للمدير"]}, "a": 2, "e": {"en": "Will is influenced by goals, team culture, satisfaction, and aspirations.", "ar": "تتأثر الإرادة بالأهداف وثقافة الفريق والرضا والطموحات."}}]}]}, {"id": 4, "title": {"en": "Module 4: Directing", "ar": "الوحدة ٤: التوجيه المباشر"}, "icon": "➡️", "subsections": [{"sourceId": "directing", "title": {"en": "Module 4: Directing", "ar": "الوحدة ٤: التوجيه المباشر"}, "takeaways": {"en": ["Content for this module will be developed and added later."], "ar": ["سيتم تطوير محتوى هذه الوحدة وإضافته لاحقًا."]}, "scoreFeedback": {}, "activity": null, "questions": []}]}, {"id": 5, "title": {"en": "Module 5: Coaching", "ar": "الوحدة ٥: التوجيه (الكوتشينج)"}, "icon": "🎯", "sections": ["5"], "subsections": [{"sourceId": "5", "title": {"en": "Module 5: Coaching", "ar": "الوحدة ٥: التوجيه (الكوتشينج)"}, "takeaways": {"en": ["Coaching develops job-related Technical and Behavioral skills.", "It requires personalized, specific, and actionable feedback.", "The 7 steps include determining current skills, setting goals, demonstrating, and observing.", "Following up is essential to ensure mastery of the new skill."], "ar": ["التوجيه يطور المهارات الفنية والسلوكية المتعلقة بالعمل.", "يتطلب ملاحظات مخصصة ومحددة وقابلة للتنفيذ.", "الخطوات الـ 7 تشمل تحديد المهارات الحالية، تحديد الأهداف، الشرح، والمراقبة.", "المتابعة ضرورية لضمان إتقان المهارة الجديدة."]}, "scoreFeedback": {"perfect": {"en": "Perfect! You've mastered the 7 steps of skills coaching and understand how to provide actionable feedback.", "ar": "مثالي! لقد أتقنت الخطوات السبع للتوجيه وتفهم كيفية تقديم ملاحظات قابلة للتنفيذ."}, "high": {"en": "Perfect! You've mastered the 7 steps of skills coaching and understand how to provide actionable feedback.", "ar": "مثالي! لقد أتقنت الخطوات السبع للتوجيه وتفهم كيفية تقديم ملاحظات قابلة للتنفيذ."}, "med": {"en": "Good job! Review the specific order of the 7 coaching steps, especially observing current skills before demonstrating.", "ar": "عمل جيد! راجع الترتيب المحدد لخطوات التوجيه السبع، خاصة أهمية مراقبة المهارات الحالية قبل الشرح العملي."}, "low": {"en": "Review the 7 coaching steps. Remember that coaching is about developing specific skills through personalized, actionable feedback.", "ar": "راجع الخطوات السبع للتوجيه. تذكر أن التوجيه يتعلق بتطوير مهارات محددة من خلال ملاحظات مخصصة وقابلة للتنفيذ."}}, "activity": {"en": "\n                <div class=\"bg-indigo-50 border border-indigo-100 rounded-xl p-6 shadow-sm\">\n                    <h3 class=\"font-bold text-indigo-900 mb-4 text-xl flex items-center gap-2 border-b border-indigo-200 pb-3\">\n                        <i class=\"fa-solid fa-users-viewfinder\"></i> Group Work: Coaching Application\n                    </h3>\n                    <p class=\"text-sm text-indigo-900 leading-relaxed mb-4\"><strong>Scenario:</strong> Khalid, a Sales Executive, has been tasked with delivering a presentation to potential clients about a new product. His manager, Laila, notices that Khalid’s presentations lack structure, rely too much on text-heavy slides, and fail to engage the audience. She decides to coach him using the 7 steps.</p>\n                    <div class=\"bg-white/60 p-4 rounded-lg\">\n                        <h4 class=\"font-bold text-indigo-900 mb-3\"><i class=\"fa-solid fa-list-ol mr-1\"></i> Steps in Action (Discuss how Laila should apply each):</h4>\n                        <ol class=\"list-decimal ml-5 text-sm text-indigo-900 space-y-2 font-semibold\">\n                            <li>Determine Current Skills & Knowledge</li>\n                            <li>Establish Goals & Objectives</li>\n                            <li>Inspire Confidence & Commitment</li>\n                            <li>Explain the Process & Demonstrate</li>\n                            <li>Observe Employee at Work</li>\n                            <li>Evaluate Learning & Give Feedback</li>\n                            <li>Follow Up</li>\n                        </ol>\n                    </div>\n                </div>\n                ", "ar": "\n                <div class=\"bg-indigo-50 border border-indigo-100 rounded-xl p-6 shadow-sm\">\n                    <h3 class=\"font-bold text-indigo-900 mb-4 text-xl flex items-center gap-2 border-b border-indigo-200 pb-3\">\n                        <i class=\"fa-solid fa-users-viewfinder\"></i> نشاط عمل جماعي: تطبيق التوجيه (الكوتشينج)\n                    </h3>\n                    <p class=\"text-sm text-indigo-900 leading-relaxed mb-4\"><strong>السيناريو:</strong> تم تكليف خالد، مسؤول مبيعات، بتقديم عرض تقديمي للعملاء المحتملين حول منتج جديد. لاحظت مديرته، ليلى، أن عروض خالد تفتقر إلى الهيكل، وتعتمد كثيرًا على الشرائح المليئة بالنصوص، وتفشل في جذب انتباه الجمهور. قررت توجيهه باستخدام الخطوات السبع.</p>\n                    <div class=\"bg-white/60 p-4 rounded-lg\">\n                        <h4 class=\"font-bold text-indigo-900 mb-3\"><i class=\"fa-solid fa-list-ol ml-1\"></i> الخطوات العملية (ناقش كيف يجب أن تطبق ليلى كل خطوة):</h4>\n                        <ol class=\"list-decimal mr-5 text-sm text-indigo-900 space-y-2 font-semibold\">\n                            <li>تحديد المهارات والمعرفة الحالية</li>\n                            <li>تحديد الأهداف والغايات</li>\n                            <li>إلهام الثقة والالتزام</li>\n                            <li>شرح العملية والتوضيح العملي</li>\n                            <li>مراقبة الموظف في العمل</li>\n                            <li>تقييم التعلم وتقديم الملاحظات</li>\n                            <li>المتابعة</li>\n                        </ol>\n                    </div>\n                </div>\n                "}, "questions": [{"s": {"en": "An employee struggles to use CRM software, causing data errors. You should provide:", "ar": "يجد موظف صعوبة في استخدام برنامج CRM، مما يسبب أخطاء. يجب أن توفر:"}, "o": {"en": ["Formal Counseling", "Behavioral Coaching", "Technical Coaching", "Written warning"], "ar": ["استشارة رسمية", "توجيه سلوكي", "توجيه فني", "تحذير كتابي"]}, "a": 2, "e": {"en": "Technical coaching focuses on job-related skills like software use.", "ar": "يركز التوجيه الفني على المهارات المتعلقة بالعمل مثل استخدام البرامج."}}, {"s": {"en": "An employee is highly skilled but interrupts colleagues aggressively. You need to provide:", "ar": "موظف ماهر للغاية لكنه يقاطع زملائه بعدوانية. تحتاج إلى توفير:"}, "o": {"en": ["Technical Coaching", "Behavioral Coaching", "Informal Counseling", "Job Enlargement"], "ar": ["توجيه فني", "توجيه سلوكي", "استشارة غير رسمية", "توسيع وظيفي"]}, "a": 1, "e": {"en": "Behavioral coaching focuses on interpersonal skills and workplace behaviors.", "ar": "يركز التوجيه السلوكي على مهارات التعامل مع الآخرين وسلوكيات العمل."}}, {"s": {"en": "Step 1 of coaching is to 'Determine current skills'. What should you do?", "ar": "الخطوة 1 من التوجيه هي 'تحديد المهارات الحالية'. ماذا يجب أن تفعل؟"}, "o": {"en": ["Show a perfect video", "Ask them to demonstrate their current skill", "Set a goal to close 10 deals", "Follow up next week"], "ar": ["عرض فيديو مثالي", "الطلب منهم إظهار مهارتهم الحالية", "تحديد هدف لـ 10 صفقات", "المتابعة الأسبوع القادم"]}, "a": 1, "e": {"en": "You must assess their current baseline by observing their current skill level.", "ar": "يجب تقييم خط الأساس الخاص بهم من خلال ملاحظة مستوى مهارتهم الحالي."}}, {"s": {"en": "You show the employee exactly how to format a report by sharing your screen. Which coaching step is this?", "ar": "تُظهر للموظف بالضبط كيفية تنسيق تقرير بمشاركة شاشتك. أي خطوة توجيه هذه؟"}, "o": {"en": ["Establish goals", "Observe the employee", "Explain the process and demonstrate", "Follow up"], "ar": ["تحديد الأهداف", "مراقبة الموظف", "شرح العملية والتوضيح العملي", "المتابعة"]}, "a": 2, "e": {"en": "Step 4 is 'Explain and demonstrate', modeling the correct behavior.", "ar": "الخطوة 4 هي 'الشرح والتوضيح العملي'، ونمذجة السلوك الصحيح."}}, {"s": {"en": "After demonstrating, you ask the employee to try it while you watch. Which step is this?", "ar": "بعد التوضيح العملي، تطلب من الموظف تجربتها بينما تشاهده. أي خطوة هذه؟"}, "o": {"en": ["Determine current skills", "Observe the employee at work", "Inspire confidence", "Establish objectives"], "ar": ["تحديد المهارات", "مراقبة الموظف في العمل", "إلهام الثقة", "تحديد الأهداف"]}, "a": 1, "e": {"en": "Step 5 is 'Observe' to ensure they can apply what was demonstrated.", "ar": "الخطوة 5 هي 'المراقبة' للتأكد من قدرتهم على تطبيق ما تم شرحه."}}, {"s": {"en": "Effective coaching should be:", "ar": "يجب أن يكون التوجيه (الكوتشينج) الفعال:"}, "o": {"en": ["Generic for everyone", "Done once", "Personalized based on actionable feedback", "Only focused on negatives"], "ar": ["عام للجميع", "يتم مرة واحدة", "مخصص بناءً على ملاحظات قابلة للتنفيذ", "يركز فقط على السلبيات"]}, "a": 2, "e": {"en": "Coaching must be personalized to learning styles and skill gaps.", "ar": "يجب تخصيص التوجيه ليناسب أساليب التعلم والفجوات المهارية."}}, {"s": {"en": "You check in 3 days after a coaching session to answer questions. Which step is this?", "ar": "تتحقق بعد 3 أيام من جلسة التوجيه للإجابة على الأسئلة. أي خطوة هذه؟"}, "o": {"en": ["Evaluate learning", "Follow up", "Inspire confidence", "Determine skills"], "ar": ["تقييم التعلم", "المتابعة", "إلهام الثقة", "تحديد المهارات"]}, "a": 1, "e": {"en": "Step 7 is 'Follow up' ensuring consistency until mastery.", "ar": "الخطوة 7 هي 'المتابعة' لضمان الاستمرارية حتى الإتقان."}}, {"s": {"en": "Khalid's slides are text-heavy. To provide actionable feedback, you say:", "ar": "شرائح خالد مليئة بالنصوص. لتقديم ملاحظات قابلة للتنفيذ، تقول:"}, "o": {"en": ["'Slides are terrible.'", "'Try bullet points and one image per slide.'", "'Be engaging.'", "'I will make them.'"], "ar": ["'الشرائح سيئة.'", "'جرب النقاط وصورة واحدة لكل شريحة.'", "'كن جذاباً.'", "'سأصنعها أنا.'"]}, "a": 1, "e": {"en": "Feedback must be specific and actionable so they know how to improve.", "ar": "يجب أن تكون الملاحظات محددة وقابلة للتنفيذ ليعرفوا كيفية التحسين."}}, {"s": {"en": "To 'Inspire confidence' (Step 3) before teaching a complex skill, you say:", "ar": "لـ 'إلهام الثقة' (الخطوة 3) قبل تعليم مهارة معقدة، تقول:"}, "o": {"en": ["'This is really hard.'", "'If you fail, you lose your job.'", "'With your skills, you'll learn quickly. I'm here to help.'", "'Watch me, it's easy.'"], "ar": ["'هذا صعب جداً.'", "'إذا فشلت، ستفقد وظيفتك.'", "'بمهاراتك، ستتعلم بسرعة. أنا هنا للمساعدة.'", "'شاهدني، الأمر سهل.'"]}, "a": 2, "e": {"en": "Inspiring confidence connects their strengths to the new challenge.", "ar": "إلهام الثقة يربط نقاط قوتهم بالتحدي الجديد."}}, {"s": {"en": "Coaching is defined primarily as a process to:", "ar": "يُعرّف التوجيه (الكوتشينج) بشكل أساسي كعملية لـ:"}, "o": {"en": ["Address life crises", "Punish employees", "Help improve specific job skills", "Shift blame"], "ar": ["معالجة أزمات الحياة", "معاقبة الموظفين", "المساعدة في تحسين مهارات وظيفية محددة", "تحويل اللوم"]}, "a": 2, "e": {"en": "Coaching is a development process for job-related technical/behavioral skills.", "ar": "التوجيه عملية تطويرية للمهارات الفنية/السلوكية المتعلقة بالوظيفة."}}]}]}, {"id": 6, "title": {"en": "Module 6: Counseling", "ar": "الوحدة ٦: الاستشارة (الكاونسلينج)"}, "icon": "🤝", "sections": ["6"], "subsections": [{"sourceId": "6", "title": {"en": "Module 6: Counseling", "ar": "الوحدة ٦: الاستشارة (الكاونسلينج)"}, "takeaways": {"en": ["Counseling addresses personal or behavioral challenges affecting work performance.", "Formal counseling is documented for serious issues; Informal builds rapport for minor issues.", "Requires a safe, empathetic environment while maintaining confidentiality.", "Focus on solutions, reviewing impacts, and documenting agreed action plans."], "ar": ["الاستشارة تعالج التحديات الشخصية أو السلوكية التي تؤثر على أداء العمل.", "الاستشارة الرسمية يتم توثيقها للقضايا الخطيرة؛ وغير الرسمية تبني الألفة للقضايا البسيطة.", "تتطلب بيئة آمنة متعاطفة مع الحفاظ على السرية.", "التركيز على الحلول، ومراجعة التأثيرات، وتوثيق خطط العمل المتفق عليها."]}, "scoreFeedback": {"perfect": {"en": "Outstanding! You clearly understand how to handle sensitive employee issues with empathy, confidentiality, and structured action plans.", "ar": "رائع! أنت تفهم بوضوح كيفية التعامل مع قضايا الموظفين الحساسة بتعاطف وسرية وخطط عمل منظمة."}, "high": {"en": "Outstanding! You clearly understand how to handle sensitive employee issues with empathy, confidentiality, and structured action plans.", "ar": "رائع! أنت تفهم بوضوح كيفية التعامل مع قضايا الموظفين الحساسة بتعاطف وسرية وخطط عمل منظمة."}, "med": {"en": "Solid effort. Remember to review the difference between formal (documented) and informal (casual) counseling.", "ar": "جهد جيد. تذكر مراجعة الفرق بين الاستشارة الرسمية (الموثقة) وغير الرسمية (الودية)."}, "low": {"en": "Focus on the 8 steps of counseling. Remember that counseling addresses personal challenges, requires a safe environment, and focuses on solutions.", "ar": "ركز على خطوات الاستشارة الثمانية. تذكر أن الاستشارة تعالج التحديات الشخصية، وتتطلب بيئة آمنة، وتركز على الحلول."}}, "activity": {"en": "\n                <div class=\"bg-indigo-50 border border-indigo-100 rounded-xl p-6 shadow-sm\">\n                    <h3 class=\"font-bold text-indigo-900 mb-4 text-xl flex items-center gap-2 border-b border-indigo-200 pb-3\">\n                        <i class=\"fa-solid fa-users-viewfinder\"></i> Group Work: Counseling Application\n                    </h3>\n                    <p class=\"text-sm text-indigo-900 leading-relaxed mb-4\"><strong>Scenario:</strong> Salam, an employee in your team, has been struggling with punctuality and maintaining consistent presence at her desk. Despite previous friendly reminders and formal counseling sessions, the issue persists. Salam has shared that she suffers from migraines and is dealing with ongoing family challenges. Despite these difficulties, Salam has shown potential, as she is a quick learner with the capability to excel in her role. However, her lack of focus has hindered her performance. As her manager, you genuinely want to help her overcome these obstacles and improve her productivity.</p>\n                    <div class=\"bg-white/60 p-4 rounded-lg\">\n                        <h4 class=\"font-bold text-indigo-900 mb-3\"><i class=\"fa-solid fa-list-ol mr-1\"></i> Steps in Action (Discuss how to handle each phase):</h4>\n                        <ol class=\"list-decimal ml-5 text-sm text-indigo-900 space-y-2 font-semibold\">\n                            <li>Identify the Gap/Problem</li>\n                            <li>Impact and Consequences</li>\n                            <li>Discuss the Problem</li>\n                            <li>Document the Problem</li>\n                            <li>Implement agreed-upon solutions</li>\n                        </ol>\n                    </div>\n                </div>\n                ", "ar": "\n                <div class=\"bg-indigo-50 border border-indigo-100 rounded-xl p-6 shadow-sm\">\n                    <h3 class=\"font-bo
