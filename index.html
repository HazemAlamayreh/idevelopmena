ld text-indigo-900 mb-4 text-xl flex items-center gap-2 border-b border-indigo-200 pb-3\">\n                        <i class=\"fa-solid fa-users-viewfinder\"></i> نشاط عمل جماعي: تطبيق الاستشارة\n                    </h3>\n                    <p class=\"text-sm text-indigo-900 leading-relaxed mb-4\"><strong>السيناريو:</strong> تعاني سلام، الموظفة في فريقك، من مشكلة في الالتزام بالمواعيد والحفاظ على تواجد مستمر في مكتبها. على الرغم من التذكيرات الودية السابقة وجلسات الاستشارة الرسمية، لا تزال المشكلة قائمة. شاركت سلام أنها تعاني من الصداع النصفي وتتعامل مع تحديات عائلية مستمرة. على الرغم من هذه الصعوبات، أظهرت سلام إمكانات، حيث أنها سريعة التعلم ولديها القدرة على التفوق في دورها. ومع ذلك، أدى افتقارها إلى التركيز إلى إعاقة أدائها. بصفتك مديرها، فأنت تريد حقًا مساعدتها في التغلب على هذه العقبات وتحسين إنتاجيتها.</p>\n                    <div class=\"bg-white/60 p-4 rounded-lg\">\n                        <h4 class=\"font-bold text-indigo-900 mb-3\"><i class=\"fa-solid fa-list-ol ml-1\"></i> الخطوات العملية (ناقش كيفية التعامل مع كل مرحلة):</h4>\n                        <ol class=\"list-decimal mr-5 text-sm text-indigo-900 space-y-2 font-semibold\">\n                            <li>تحديد الفجوة/المشكلة</li>\n                            <li>التأثير والعواقب</li>\n                            <li>مناقشة المشكلة</li>\n                            <li>توثيق المشكلة</li>\n                            <li>تنفيذ الحلول المتفق عليها</li>\n                        </ol>\n                    </div>\n                </div>\n                "}, "questions": [{"s": {"en": "An employee is upset about a minor conflict over desk space. You have a supportive chat. This is:", "ar": "موظف منزعج من صراع بسيط حول مساحة المكتب. تجري دردشة داعمة. هذا:"}, "o": {"en": ["Formal Counseling", "Informal Counseling", "Technical Coaching", "Written warning"], "ar": ["استشارة رسمية", "استشارة غير رسمية", "توجيه فني", "تحذير كتابي"]}, "a": 1, "e": {"en": "Informal counseling is spontaneous guidance for minor concerns.", "ar": "الاستشارة غير الرسمية هي توجيه عفوي للمخاوف البسيطة."}}, {"s": {"en": "An employee is consistently late. You schedule a closed-door meeting to document an action plan. This is:", "ar": "موظف يتأخر باستمرار. تجدول اجتماعاً مغلقاً لتوثيق خطة عمل. هذا:"}, "o": {"en": ["Informal Counseling", "Formal Counseling", "Behavioral Coaching", "Job Enlargement"], "ar": ["استشارة غير رسمية", "استشارة رسمية", "توجيه سلوكي", "توسيع وظيفي"]}, "a": 1, "e": {"en": "Formal counseling is structured and documented for serious issues.", "ar": "الاستشارة الرسمية مهيكلة وموثقة للقضايا الخطيرة."}}, {"s": {"en": "During counseling, the employee shares they are going through a difficult divorce. The best response is to:", "ar": "أثناء الاستشارة، يشارك الموظف أنه يمر بطلاق صعب. أفضل رد هو:"}, "o": {"en": ["Tell them to leave problems at home", "Empathize and listen actively", "Fire them", "Change subject to KPIs"], "ar": ["أخبرهم بترك المشاكل بالمنزل", "التعاطف والاستماع بنشاط", "فصلهم", "تغيير الموضوع لمؤشرات الأداء"]}, "a": 1, "e": {"en": "Step 5 is 'Empathize', requiring a safe and supportive environment.", "ar": "الخطوة 5 هي 'التعاطف'، وتتطلب بيئة آمنة وداعمة."}}, {"s": {"en": "You are conducting formal counseling. Which is a crucial best practice?", "ar": "أنت تجري استشارة رسمية. أي من التالي هو ممارسة فضلى حاسمة؟"}, "o": {"en": ["Maintain confidentiality and document", "Share issues with team", "Focus only on problems", "Take employee's side against company"], "ar": ["الحفاظ على السرية والتوثيق", "مشاركة القضايا مع الفريق", "التركيز فقط على المشاكل", "الوقوف مع الموظف ضد الشركة"]}, "a": 0, "e": {"en": "Confidentiality builds trust, and documentation is necessary for HR processes.", "ar": "السرية تبني الثقة، والتوثيق ضروري لعمليات الموارد البشرية."}}, {"s": {"en": "After 'Identifying the gap' and 'Analyzing', what should you do during the meeting?", "ar": "بعد 'تحديد الفجوة' و'التحليل'، ماذا يجب أن تفعل أثناء الاجتماع؟"}, "o": {"en": ["Document actions immediately", "Offer solutions before they speak", "Discuss problem and listen for explanations", "Issue warning"], "ar": ["توثيق الإجراءات فوراً", "تقديم حلول قبل أن يتحدثوا", "مناقشة المشكلة والاستماع للتفسيرات", "إصدار تحذير"]}, "a": 2, "e": {"en": "You must discuss openly and listen (Steps 3 & 4) before solutions.", "ar": "يجب المناقشة بانفتاح والاستماع (خطوات 3 و 4) قبل الحلول."}}, {"s": {"en": "An employee complains their workload is too heavy. You review their tasks and help prioritize. You are focusing on:", "ar": "يشتكي موظف من ثقل عبء العمل. تراجع مهامه وتساعده في الأولويات. أنت تركز على:"}, "o": {"en": ["Punishment", "Micromanagement", "Solutions, not only problems", "Ignoring the issue"], "ar": ["العقاب", "الإدارة الدقيقة", "الحلول، وليس المشاكل فقط", "تجاهل المشكلة"]}, "a": 2, "e": {"en": "Effective counseling explores options and finds actionable solutions.", "ar": "الاستشارة الفعالة تستكشف الخيارات وتجد حلولاً قابلة للتنفيذ."}}, {"s": {"en": "You explain how frequent absences mean the team must work overtime. Which step is this?", "ar": "تشرح كيف أن الغياب المتكرر يعني أن الفريق يجب أن يعمل لوقت إضافي. أي خطوة هذه؟"}, "o": {"en": ["Listen for explanations", "Offer solutions", "Review impact and consequences", "Analyze problem"], "ar": ["الاستماع للتفسيرات", "تقديم حلول", "مراجعة التأثير والعواقب", "تحليل المشكلة"]}, "a": 2, "e": {"en": "Step 6 is 'Review impact' so they understand how their behavior affects others.", "ar": "الخطوة 6 'مراجعة التأثير' ليفهموا كيف يؤثر سلوكهم على الآخرين."}}, {"s": {"en": "Salam suffers from migraines causing tardiness. An appropriate action plan (Step 8) might involve:", "ar": "سلام تعاني من صداع نصفي يسبب التأخير. خطة عمل مناسبة (خطوة 8) قد تتضمن:"}, "o": {"en": ["Telling her to wake up earlier", "Adjusting start time by 30 mins while keeping total hours", "Demoting her", "Ignoring it"], "ar": ["إخبارها بالاستيقاظ مبكراً", "تعديل وقت البدء 30 دقيقة مع الحفاظ على إجمالي الساعات", "خفض رتبتها", "تجاهل الأمر"]}, "a": 1, "e": {"en": "A good action plan offers reasonable accommodation while meeting business needs.", "ar": "تقدم خطة العمل الجيدة ترتيبات معقولة مع تلبية احتياجات العمل."}}, {"s": {"en": "What is the primary difference between Coaching and Counseling?", "ar": "ما هو الفرق الأساسي بين التوجيه والاستشارة؟"}, "o": {"en": ["Coaching is for personal issues", "Coaching develops skills; Counseling addresses challenges affecting work", "No difference", "Counseling is always documented"], "ar": ["التوجيه للمشاكل الشخصية", "التوجيه يطور المهارات؛ الاستشارة تعالج تحديات تؤثر على العمل", "لا يوجد فرق", "الاستشارة موثقة دائماً"]}, "a": 1, "e": {"en": "Coaching improves skills; Counseling supports employees through personal/behavioral challenges.", "ar": "التوجيه يحسن المهارات؛ الاستشارة تدعم الموظفين خلال التحديات."}}, {"s": {"en": "An employee starts crying during counseling about performance. You should:", "ar": "يبدأ موظف بالبكاء أثناء استشارة حول الأداء. يجب عليك:"}, "o": {"en": ["Stop and tell them to return when professional", "Offer tissue, pause, maintain safe environment", "Ignore crying", "Cry with them"], "ar": ["التوقف وإخبارهم بالعودة حين يكونون مهنيين", "تقديم منديل، التوقف مؤقتاً، الحفاظ على بيئة آمنة", "تجاهل البكاء", "البكاء معهم"]}, "a": 1, "e": {"en": "Creating a safe, empathetic environment is a core practice in counseling.", "ar": "خلق بيئة آمنة ومتعاطفة هو ممارسة أساسية في الاستشارة."}}]}]}, {"id": 7, "title": {"en": "Module 7: Delegation", "ar": "الوحدة ٧: التفويض"}, "icon": "🔄", "sections": ["7"], "subsections": [{"sourceId": "7", "title": {"en": "Module 7: Delegation", "ar": "الوحدة ٧: التفويض"}, "takeaways": {"en": ["Delegation shifts responsibility and authority, but the manager retains accountability.", "Match the person to the task based on their skill and motivation.", "Avoid 'reverse delegation' (employees handing tasks back).", "Never delegate confidential HR issues or highly sensitive strategic decisions."], "ar": ["التفويض ينقل المسؤولية والسلطة، لكن المدير يحتفظ بالمساءلة.", "يجب مطابقة الشخص للمهمة بناءً على مهارته ودوافعه.", "تجنب 'التفويض العكسي' (إعادة الموظفين للمهام إليك).", "لا تقم أبدًا بتفويض قضايا الموارد البشرية السرية أو القرارات الاستراتيجية الحساسة."]}, "scoreFeedback": {"perfect": {"en": "Excellent! You understand that delegation is about developing people and shifting responsibility while retaining accountability.", "ar": "ممتاز! أنت تدرك أن التفويض يتعلق بتطوير الأفراد ونقل المسؤولية مع الاحتفاظ بالمساءلة."}, "high": {"en": "Excellent! You understand that delegation is about developing people and shifting responsibility while retaining accountability.", "ar": "ممتاز! أنت تدرك أن التفويض يتعلق بتطوير الأفراد ونقل المسؤولية مع الاحتفاظ بالمساءلة."}, "med": {"en": "Good work! Review the specific types of tasks that should NOT be delegated (like HR issues and strategic decisions).", "ar": "عمل جيد! راجع الأنواع المحددة من المهام التي لا ينبغي تفويضها (مثل قضايا الموارد البشرية والقرارات الاستراتيجية)."}, "low": {"en": "Review the rules of delegation. Remember: match the person to the task, delegate authority (not just responsibility), and never accept reverse delegation.", "ar": "راجع قواعد التفويض. تذكر: طابق الشخص للمهمة، وفوّض السلطة (ليس فقط المسؤولية)، ولا تقبل أبداً التفويض العكسي."}}, "activity": null, "questions": [{"s": {"en": "A supervisor gives a rep responsibility for a regional report but keeps every decision right with himself. What is missing?", "ar": "يعطي المشرف موظف المبيعات مسؤولية تقرير إقليمي لكنه يحتفظ بكل حق في اتخاذ القرار. ما العنصر المفقود؟"}, "o": {"en": ["A clearer performance target", "Sufficient authority to act", "A stronger financial reward", "A more formal counseling process"], "ar": ["هدف أداء أوضح", "صلاحية كافية للتصرف", "مكافأة مالية أقوى", "عملية استشارة رسمية أكثر"]}, "a": 1, "e": {"en": "Delegation requires enough authority to complete the assigned responsibility; responsibility without authority creates a bottleneck.", "ar": "يتطلب التفويض منح صلاحية كافية لتنفيذ المسؤولية {"id": "followup", "type": "mcq", "q": {"en": "Which follow-up approach best supports good delegation?", "ar": "أي أسلوب متابعة يدعم التفويض الفعال بشكل أفضل؟"}, "options": {"en": ["Check every small decision continuously", "Agree on checkpoints and review outcomes", "Avoid follow-up so the employee feels trusted", "Take the task back when the first difficulty appears"], "ar": ["متابعة كل قرار صغير باستمرار", "الاتفاق على نقاط متابعة ومراجعة النتائج", "عدم المتابعة حتى يشعر الموظف بالثقة", "استرجاع المهمة عند أول صعوبة"]}}, {"id": "notes", "type": "text", "q": {"en": "What risks or support needs should you discuss before you leave?", "ar": "ما المخاطر أو احتياجات الدعم التي يجب مناقشتها قبل المغادرة؟"}, "placeholder": {"en": "Add your notes...", "ar": "أضف ملاحظاتك..."}}]}, "4": {"title": {"en": "Directing Practice – Draft Case", "ar": "تطبيق Directing – حالة أولية"}, "items": [{"id": "diagnosis", "type": "dropdown", "q": {"en": "A newly promoted sales representative is enthusiastic but repeatedly asks what to do first, what standard is expected, and when to escalate issues. What does the situation need most?", "ar": "موظف مبيعات تمت ترقيته حديثاً متحمس، لكنه يسأل باستمرار ماذا يفعل أولاً وما المعيار المتوقع ومتى يصعّد المشكلة. ما الذي يحتاجه الموقف أكثر؟"}, "options": {"en": ["Select your answer", "Clear direction and priorities", "More autonomy immediately", "A formal counseling session", "A change of territory"], "ar": ["اختر إجابتك", "توجيه واضح وأولويات محددة", "استقلالية أكبر فوراً", "جلسة استشارة رسمية", "تغيير المنطقة"]}}, {"id": "instruction", "type": "text", "q": {"en": "Write the exact direction you would give this employee in 2–4 sentences.", "ar": "اكتب التوجيه الدقيق الذي ستعطيه لهذا الموظف في 2–4 جمل."}, "placeholder": {"en": "Include priority, expected result and when to check back...", "ar": "ضمن الأولوية والنتيجة المتوقعة وموعد المتابعة..."}}, {"id": "check", "type": "mcq", "q": {"en": "After giving direction, what should the supervisor do to confirm understanding?", "ar": "بعد إعطاء التوجيه، ماذا ينبغي على المشرف أن يفعل للتأكد من الفهم؟"}, "options": {"en": ["Ask the employee to restate the expectation and next step", "Repeat the same instruction more loudly", "Leave immediately so the employee learns independently", "Send the task to another employee as backup"], "ar": ["يطلب من الموظف إعادة صياغة التوقع والخطوة التالية", "يكرر التعليمات نفسها بصوت أعلى", "يغادر فوراً حتى يتعلم الموظف بشكل مستقل", "يرسل المهمة إلى موظف آخر كخطة احتياطية"]}}]}};
const DETAILED_LEARN={"1": [{"title": {"en": "What Management Really Means", "ar": "ما المقصود بالإدارة فعلياً؟"}, "body": {"en": "Management is the process of planning, organizing, leading, and controlling people and resources so organizational goals are achieved effectively and efficiently. The manager’s role is not simply to be the strongest individual performer; it is to create the conditions in which the team can perform.", "ar": "الإدارة هي عملية التخطيط والتنظيم والقيادة والرقابة على الأشخاص والموارد بهدف تحقيق أهداف المنظمة بفاعلية وكفاءة. دور المدير ليس أن يكون أقوى منفّذ فردي فقط؛ بل أن يهيئ الظروف التي تمكّن الفريق من الأداء."}, "points": {"en": ["Planning: decide what needs to happen and the course of action.", "Organizing: coordinate people, responsibilities and resources.", "Leading: guide, communicate with and influence people.", "Controlling: monitor results, compare them with expectations and take corrective action."], "ar": ["التخطيط: تحديد ما المطلوب وما مسار العمل.", "التنظيم: تنسيق الأشخاص والمسؤوليات والموارد.", "القيادة: توجيه الأشخاص والتواصل معهم والتأثير فيهم.", "الرقابة: متابعة النتائج ومقارنتها بالتوقعات واتخاذ الإجراء التصحيحي."]}}, {"title": {"en": "From Performer to Manager", "ar": "من منفّذ قوي إلى مدير"}, "body": {"en": "A common transition challenge is continuing to think like an individual contributor. Effective managers shift from “What can I do?” to “What does the team need to succeed?” Their behavior also becomes a visible standard: what they model, tolerate, recognize and correct shapes team expectations.", "ar": "أحد تحديات الانتقال الشائعة هو الاستمرار بالتفكير كموظف منفّذ. المدير الفعّال ينتقل من سؤال «ماذا أستطيع أن أنجز؟» إلى «ماذا يحتاج الفريق كي ينجح؟». كما يصبح سلوكه معياراً مرئياً؛ فما يطبقه وما يتسامح معه وما يقدره وما يصححه يشكل توقعات الفريق."}, "points": {"en": ["Set the example before enforcing the standard.", "Communicate directly and transparently.", "Delegate with care rather than doing everything yourself.", "Treat appropriate mistakes as learning opportunities.", "Continuously improve your management practice."], "ar": ["كن قدوة قبل أن تطلب الالتزام بالمعيار.", "تواصل بشكل مباشر وشفاف.", "فوّض بعناية بدلاً من تنفيذ كل شيء بنفسك.", "تعامل مع الأخطاء المناسبة كفرص للتعلم.", "طوّر ممارساتك الإدارية باستمرار."]}}], "2": [{"title": {"en": "Leadership Style Is Not Static", "ar": "أسلوب القيادة ليس ثابتاً"}, "body": {"en": "Leadership style is the way a manager leads, makes decisions and interacts with the team. Effective leadership is not one fixed behavior. The manager adjusts the approach according to the person, the situation and the moment because capability, motivation, urgency and risk change.", "ar": "أسلوب القيادة هو الطريقة التي يقود بها المدير فريقه ويتخذ القرارات ويتفاعل مع الآخرين. القيادة الفعالة ليست سلوكاً ثابتاً واحداً؛ بل يكيّف المدير أسلوبه حسب الشخص والموقف واللحظة لأن القدرة والدافعية والاستعجال ومستوى المخاطر تتغير."}, "points": {"en": ["Person: different strengths, needs and experience.", "Situation: different challenges and business dynamics.", "Moment: different timing, energy and priorities."], "ar": ["الشخص: اختلاف نقاط القوة والاحتياجات والخبرة.", "الموقف: اختلاف التحديات وديناميكيات العمل.", "اللحظة: اختلاف التوقيت والطاقة والأولويات."]}}, {"title": {"en": "Theory X and Theory Y", "ar": "نظرية X ونظرية Y"}, "body": {"en": "Theory X and Theory Y describe contrasting assumptions managers may hold about employees. Theory X assumes people may avoid work, need close supervision and respond mainly to external control. Theory Y assumes people can be self-directed, responsible, creative and motivated by growth and purpose. The practical lesson is to notice how the manager’s assumptions shape the way the team is treated.", "ar": "تصف نظرية X ونظرية Y افتراضين مختلفين قد يحملهما المدير تجاه الموظفين. تفترض نظرية X أن بعض الأشخاص قد يتجنبون العمل ويحتاجون رقابة قريبة ويتأثرون أكثر بالسيطرة الخارجية. أما نظرية Y فترى أن الأشخاص قادرون على التوجيه الذاتي وتحمل المسؤولية والإبداع والتحفز بالنمو والهدف. الدرس العملي هو الانتباه إلى أن افتراضات المدير تؤثر في طريقة تعامله مع الفريق."}, "points": {"en": ["Theory X may fit highly standardized or tightly regulated work requiring close control.", "Theory Y fits work where autonomy, creativity, ownership and problem-solving are important.", "Over-controlling a capable team can reduce ownership and motivation."], "ar": ["قد تناسب نظرية X الأعمال شديدة التوحيد أو التنظيم التي تحتاج رقابة قريبة.", "تناسب نظرية Y الأعمال التي تتطلب الاستقلالية والإبداع والملكية وحل المشكلات.", "المبالغة في الرقابة على فريق قادر قد تقلل الملكية والدافعية."]}}, {"title": {"en": "Blake & Mouton Managerial Grid", "ar": "الشبكة الإدارية لبليك وموتون"}, "body": {"en": "The Managerial Grid uses two dimensions: concern for people and concern for production. Different combinations create five recognizable patterns and help managers reflect on whether their current behavior protects relationships, drives results, or balances both.", "ar": "تعتمد الشبكة الإدارية على بُعدين: الاهتمام بالأشخاص والاهتمام بالإنتاج. وينتج عن تداخل البعدين خمسة أنماط معروفة تساعد المدير على مراجعة ما إذا كان سلوكه يحمي العلاقات أو يدفع النتائج أو يوازن بينهما."}, "points": {"en": ["1.9 Country Club: high people, low production.", "9.1 Task Management: high production, low people.", "5.5 Middle of the Road: moderate concern for both.", "1.1 Impoverished: low concern for both.", "9.9 Team Management: high concern for people and production."], "ar": ["1.9 نادي اجتماعي: اهتمام مرتفع بالأشخاص ومنخفض بالإنتاج.", "9.1 إدارة المهام: اهتمام مرتفع بالإنتاج ومنخفض بالأشخاص.", "5.5 منتصف الطريق: اهتمام متوسط بكلا الجانبين.", "1.1 إدارة ضعيفة: اهتمام منخفض بكلا الجانبين.", "9.9 إدارة الفريق: اهتمام مرتفع بالأشخاص والإنتاج معاً."]}}], "3": [{"title": {"en": "Diagnose Skill and Will Before You Act", "ar": "شخّص المهارة والإرادة قبل أن تتصرف"}, "body": {"en": "The Skill–Will Matrix prevents managers from treating every employee in the same way. Skill means the employee’s ability to perform the task effectively; will means the employee’s motivation and willingness to perform. Diagnose both before deciding how much direction, support or autonomy to provide.", "ar": "تمنع مصفوفة المهارة–الإرادة المدير من التعامل مع جميع الموظفين بالطريقة نفسها. المهارة تعني قدرة الموظف على تنفيذ المهمة بفاعلية، والإرادة تعني الدافعية والاستعداد للأداء. يجب تشخيص الجانبين قبل تحديد مقدار التوجيه أو الدعم أو الاستقلالية."}, "points": {"en": ["Skill develops through learning, practice, experience and feedback.", "Will can be influenced by goals, culture, job satisfaction, circumstances and career aspirations.", "A wrong diagnosis often produces the wrong management response."], "ar": ["تتطور المهارة من خلال التعلم والممارسة والخبرة والتغذية الراجعة.", "قد تتأثر الإرادة بالأهداف والثقافة والرضا الوظيفي والظروف والطموحات المهنية.", "التشخيص الخاطئ غالباً يؤدي إلى استجابة إدارية خاطئة."]}}, {"title": {"en": "The Four Management Responses", "ar": "الاستجابات الإدارية الأربع"}, "body": {"en": "Each quadrant calls for a different management response. The goal is not to label the employee permanently, but to choose the support that fits the current task and situation.", "ar": "كل ربع من المصفوفة يحتاج إلى استجابة إدارية مختلفة. الهدف ليس وضع تصنيف دائم على الموظف، بل اختيار نوع الدعم الأنسب للمهمة والموقف الحالي."}, "points": {"en": ["Low Skill / Low Will → Direct: clear expectations, structure and close monitoring.", "Low Skill / High Will → Guide: coaching, instruction, practice and frequent feedback.", "High Skill / Low Will → Excite: explore the cause of low motivation and reconnect to meaningful goals.", "High Skill / High Will → Delegate: provide autonomy, challenge and ownership of outcomes."], "ar": ["مهارة منخفضة / إرادة منخفضة → Direct: توقعات واضحة وهيكل ومتابعة قريبة.", "مهارة منخفضة / إرادة عالية → Guide: تدريب وتوجيه وممارسة وتغذية راجعة متكررة.", "مهارة عالية / إرادة منخفضة → Excite: استكشاف سبب انخفاض الدافعية وإعادة الربط بأهداف ذات معنى.", "مهارة عالية / إرادة عالية → Delegate: منح الاستقلالية والتحدي وملكية النتائج."]}}], "4": [{"title": {"en": "Directing", "ar": "Directing"}, "body": {"en": "The PDF uploaded in this turn does not contain the Directing module content. This section is intentionally kept as a structured placeholder so the approved theory, steps and tools can be added without inventing source material.", "ar": "ملف PDF المرفوع في هذه الرسالة لا يحتوي على محتوى موديول Directing. لذلك تم الإبقاء على هذا القسم كهيكل منظم مؤقت حتى نضيف النظرية والخطوات والأدوات المعتمدة دون اختراع محتوى غير موجود في المصدر."}, "points": {"en": ["Approved content source: pending.", "Knowledge Check: pending final Directing content.", "A draft practice case is included and should be validated once the Directing material is supplied."], "ar": ["مصدر المحتوى المعتمد: بانتظار المادة.", "اختبار الفهم: بانتظار اعتماد محتوى Directing النهائي.", "تمت إضافة حالة تطبيقية أولية ويجب اعتمادها بعد تزويد محتوى Directing."]}}], "5": [{"title": {"en": "What Coaching Is", "ar": "ما هو الـCoaching؟"}, "body": {"en": "Coaching is a development process in which the manager helps an employee improve specific job-related skills. The focus is performance improvement through guidance, support, feedback, training and follow-up—not punishment.", "ar": "الـCoaching هو عملية تطوير يساعد فيها المدير الموظف على تحسين مهارات محددة مرتبطة بالعمل. التركيز يكون على تحسين الأداء من خلال التوجيه والدعم والتغذية الراجعة والتدريب والمتابعة، وليس العقوبة."}, "points": {"en": ["Technical coaching: job-specific capability, tools, processes and functional expertise.", "Behavioral coaching: communication, leadership, decision-making, emotional intelligence and adaptability.", "Effective coaching is personalized, specific, actionable and connected to real work."], "ar": ["التوجيه الفني: القدرات الفنية الخاصة بالوظيفة والأدوات والعمليات والخبرة الوظيفية.", "التوجيه السلوكي: التواصل والقيادة واتخاذ القرار والذكاء العاطفي والمرونة.", "الـCoaching الفعال يكون مخصصاً ومحدداً وقابلاً للتطبيق ومرتبطاً بالعمل الحقيقي."]}}, {"title": {"en": "The 7 Coaching Steps", "ar": "الخطوات السبع للـCoaching"}, "body": {"en": "The coaching process starts with understanding the current level and ends with follow-up. Skipping diagnosis or follow-up often produces short-lived improvement.", "ar": "تبدأ عملية الـCoaching بفهم المستوى الحالي وتنتهي بالمتابعة. تجاوز مرحلة التشخيص أو المتابعة غالباً يؤدي إلى تحسن مؤقت فقط."}, "points": {"en": ["1. Determine current skills and knowledge.", "2. Establish goals and objectives.", "3. Inspire confidence and commitment.", "4. Explain the process and demonstrate.", "5. Observe the employee at work.", "6. Evaluate learning and give feedback.", "7. Follow up."], "ar": ["1. تحديد المهارات والمعرفة الحالية.", "2. وضع الأهداف والنتائج المطلوبة.", "3. بناء الثقة والالتزام.", "4. شرح العملية وعرض الطريقة.", "5. مراقبة الموظف أثناء التطبيق.", "6. تقييم التعلم وتقديم التغذية الراجعة.", "7. المتابعة."]}}], "6": [{"title": {"en": "What Counseling Is", "ar": "ما هي الاستشارة الإدارية؟"}, "body": {"en": "Counseling is a supportive process in which a manager helps an employee address personal or professional challenges affecting work. The goal is improved well-being and effectiveness through guidance, understanding, constructive feedback and confidentiality.", "ar": "الاستشارة الإدارية هي عملية داعمة يساعد فيها المدير الموظف على التعامل مع تحديات شخصية أو مهنية تؤثر في العمل. الهدف هو تحسين الرفاه والفاعلية من خلال التوجيه والفهم والتغذية الراجعة البنّاءة والسرية."}, "points": {"en": ["Formal counseling is structured and documented for serious or repeated issues.", "Informal counseling is conversational and useful for early or minor concerns.", "Create a safe environment, remain empathetic and objective, focus on solutions and document when necessary."], "ar": ["الاستشارة الرسمية تكون منظمة وموثقة للقضايا الجدية أو المتكررة.", "الاستشارة غير الرسمية تكون حوارية ومناسبة للمخاوف المبكرة أو البسيطة.", "وفّر بيئة آمنة، واظهر التعاطف مع الموضوعية، وركز على الحلول ووثّق عند الحاجة."]}}, {"title": {"en": "The 8 Counseling Steps", "ar": "الخطوات الثماني للاستشارة"}, "body": {"en": "Effective counseling moves from identifying the issue to understanding it, exploring reasonable explanations, agreeing solutions and documenting the action.", "ar": "تنتقل الاستشارة الفعالة من تحديد المشكلة إلى فهمها واستكشاف التفسيرات المنطقية والاتفاق على الحلول وتوثيق الإجراء."}, "points": {"en": ["1. Identify the gap or problem.", "2. Analyze the problem.", "3. Discuss the problem.", "4. Listen for reasonable explanations.", "5. Empathize with the employee’s situation.", "6. Review impact and consequences.", "7. Offer solutions when needed.", "8. Document the problem and agreed actions."], "ar": ["1. تحديد الفجوة أو المشكلة.", "2. تحليل المشكلة.", "3. مناقشة المشكلة.", "4. الاستماع للتفسيرات المنطقية.", "5. التعاطف مع وضع الموظف.", "6. مراجعة الأثر والعواقب.", "7. تقديم الحلول عند الحاجة.", "8. توثيق المشكلة والإجراءات المتفق عليها."]}}], "7": [{"title": {"en": "What Delegation Means", "ar": "ما المقصود بالتفويض؟"}, "body": {"en": "Delegation is the process used by a manager to shift responsibility for task implementation to another team member while the manager maintains accountability for the final result. Effective delegation is not about getting rid of work; it is a structured management practice that develops people and improves performance.", "ar": "التفويض هو العملية التي يستخدمها المدير لنقل مسؤولية تنفيذ مهمة إلى عضو آخر في الفريق مع بقاء المدير مسؤولاً عن النتيجة النهائية. التفويض الفعال ليس التخلص من العمل؛ بل ممارسة إدارية منظمة تطور الأشخاص وتحسن الأداء."}, "points": {"en": ["Responsibility: the specific tasks or duties assigned.", "Authority: the power or right to make decisions and take action.", "Accountability: being answerable for actions, decisions and results."], "ar": ["المسؤولية Responsibility: المهام أو الواجبات المحددة التي يتم إسنادها.", "الصلاحية Authority: القدرة أو الحق في اتخاذ القرارات والتصرف.", "المساءلة Accountability: تحمل المسؤولية عن الأفعال والقرارات والنتائج."]}}, {"title": {"en": "Recognize Weak Delegation Patterns", "ar": "التعرف على مؤشرات ضعف التفويض"}, "body": {"en": "Delegation often needs improvement when the manager remains the bottleneck: the inbox is always full, overtime is constant, employees repeatedly ask for clarification, the manager intervenes in delegated work, the team does not take ownership, or delegated tasks are delayed or missed.", "ar": "غالباً يحتاج التفويض إلى تحسين عندما يصبح المدير هو نقطة الاختناق: صندوق البريد ممتلئ دائماً، والعمل الإضافي مستمر، والموظفون يطلبون التوضيح باستمرار، والمدير يتدخل في المهام المفوضة، والفريق لا يتحمل الملكية، أو تتأخر المهام المفوضة أو لا تكتمل."}, "points": {"en": ["Common myths: “If you want it done right, do it yourself,” “There is no time to delegate,” “My staff is not competent enough,” and “People will think I am not on top of things.”", "Common barriers: lack of trust, fear of losing control, weak communication, unclear roles, over-involvement, lack of development and failure to recognize employee potential."], "ar": ["خرافات شائعة: «إذا أردت إنجاز المهمة جيداً فافعلها بنفسك»، «لا يوجد وقت للتفويض»، «فريقي غير كفؤ»، و«سيعتقد الناس أنني لا أسيطر على الأمور».", "عوائق شائعة: ضعف الثقة، الخوف من فقدان السيطرة، ضعف التواصل، عدم وضوح الأدوار، التدخل الزائد، نقص التطوير، وعدم التعرف على إمكانات الموظفين."]}}, {"title": {"en": "The Delegation Sequence", "ar": "تسلسل التفويض الفعال"}, "body": {"en": "The material presents delegation as a sequence: assign the task, authorize the employee, provide support and follow up. Each step protects both performance and employee development.", "ar": "تقدم المادة التفويض كسلسلة واضحة: إسناد المهمة، منح الصلاحية، توفير الدعم، ثم المتابعة. كل خطوة تحمي الأداء وتدعم تطوير الموظف في الوقت نفسه."}, "points": {"en": ["Define the task clearly and decide what should be delegated.", "Consider priority: A items are high importance/high impact; B items are important but manageable; C items are lower-priority or routine.", "Match the person to the task based on skill, motivation, experience, development needs, availability and potential.", "Provide purpose, roles, deadlines, information, resources, training/support, coaching checkpoints, follow-up and clarity on when the manager should become involved."], "ar": ["حدد المهمة بوضوح وقرر ما الذي يمكن تفويضه.", "ضع أولوية المهمة في الاعتبار: مهام A عالية الأهمية والتأثير، B مهمة ولكن قابلة للإدارة، C أقل أولوية أو روتينية.", "طابق الشخص مع المهمة بناءً على المهارة والدافعية والخبرة واحتياجات التطوير والتوفر والإمكانات.", "وضح الهدف والأدوار والمواعيد والمعلومات والموارد والتدريب والدعم ونقاط المتابعة ومتى يجب أن يتدخل المدير."]}}, {"title": {"en": "Authority, Follow-Up and What Not to Delegate", "ar": "الصلاحية والمتابعة وما لا يجب تفويضه"}, "body": {"en": "Responsibility without enough authority creates weak delegation. The employee needs enough authority to get the work done, keep progress moving in the manager’s absence, develop capability and establish accountability. The manager should also prevent reverse delegation—when the employee returns the task to the manager instead of solving it with appropriate support.", "ar": "إسناد المسؤولية دون منح صلاحية كافية يؤدي إلى تفويض ضعيف. يحتاج الموظف إلى صلاحية كافية لإنجاز العمل واستمرار التقدم في غياب المدير وتطوير قدراته وتعزيز المساءلة. كما يجب على المدير منع التفويض العكسي عندما يعيد الموظف المهمة للمدير بدلاً من حلها مع الدعم المناسب."}, "points": {"en": ["Usually retain confidential or sensitive information and issues.", "Retain tasks requiring specialized knowledge or expertise when the employee is not qualified.", "Retain tasks with legal or regulatory implications.", "Retain tasks with major business impact when manager ownership is essential.", "Retain work that is part of the manager’s core responsibility."], "ar": ["عادةً احتفظ بالمعلومات والقضايا السرية أو الحساسة.", "احتفظ بالمهام التي تتطلب معرفة أو خبرة متخصصة عندما لا يكون الموظف مؤهلاً لها.", "احتفظ بالمهام ذات الآثار القانونية أو التنظيمية.", "احتفظ بالمهام ذات الأثر التجاري الكبير عندما تكون ملكية المدير ضرورية.", "احتفظ بالأعمال التي تعد جزءاً من المسؤوليات الجوهرية للمدير."]}}]};
const STOREKEY='managementInActionLearning_v6';

state.moduleScores=state.moduleScores||{}; state.visits=state.visits||{};
let lang='en', view='home', currentModuleId=null, currentTab='learn', currentSub=0, qi=0, qscore=0, answered=false, wrong=[];

function save(){localStorage.setItem(STOREKEY,JSON.stringify(state));}
function setLang(l){lang=l;document.body.lang=l;document.body.dir=l==='ar'?'rtl':'ltr';enBtn.classList.toggle('active',l==='en');arBtn.classList.toggle('active',l==='ar');renderSide();render();}
function renderSide(){
 let html=`<div class="navlabel">${lang==='en'?'Learning Journey':'رحلة التعلّم'}</div><button class="navbtn ${view==='home'?'active':''}" onclick="goHome()"><span class="num">⌂</span><div><b>${ui.home[lang]}</b></div></button>`;
 html+=`<button class="navbtn ${view==='assessment'&&assessType==='pre'?'active':''}" onclick="openAssessment('pre')"><span class="num">P</span><div><b>${ui.pre[lang]}</b><div class="small">${lang==='en'?'20 questions • 25 sec each':'20 سؤال • 25 ثانية لكل سؤال'}</div>${state.pre?`<div class="status">${lang==='en'?'Completed':'مكتمل'} • ${state.pre.total}%</div>`:''}</div></button>`;
 DATA.modules.forEach(m=>{let sc=state.moduleScores[m.id];html+=`<button class="navbtn ${view==='module'&&currentModuleId===m.id?'active':''}" onclick="openModule(${m.id})"><span class="num">${m.id}</span><div><b>${m.title[lang]}</b>${sc?`<div class="status">${lang==='en'?'Quiz':'اختبار'}: ${sc.pct}%</div>`:''}</div></button>`});
 html+=`<button class="navbtn ${view==='assessment'&&assessType==='post'?'active':''}" onclick="openAssessment('post')"><span class="num">8</span><div><b>${ui.post[lang]}</b><div class="small">${lang==='en'?'20 questions • comparison with pre':'20 سؤال • مقارنة مع التقييم القبلي'}</div>${state.post?`<div class="status">${lang==='en'?'Completed':'مكتمل'} • ${state.post.total}%</div>`:''}</div></button>`;
 side.innerHTML=html;
}
function goHome(){stopTimer();view='home';currentModuleId=null;renderSide();render();}
function openModule(id){stopTimer();view='module';currentModuleId=id;currentTab='learn';currentSub=0;qi=0;qscore=0;answered=false;wrong=[];state.visits[id]=state.visits[id]||{};state.visits[id].learn=true;save();renderSide();render();}

function render(){if(view==='home')renderHome();else if(view==='assessment')renderAssess();else renderModule();}
function renderHome(){
 app.innerHTML=`<section class="hero"><div class="eyebrow">Management Fundamentals</div><h2 class="display">${lang==='en'?'Learn. Apply. <span class="red">Lead.</span>':'تعلّم. طبّق. <span class="red">قُد.</span>'}</h2><p>${lang==='en'?'Start with the diagnostic self-assessment, move through the seven management modules, then complete the post-training assessment to see where your capability improved and what still needs attention.':'ابدأ بالتقييم التشخيصي، ثم انتقل عبر الوحدات الإدارية السبع، وأنهِ بالتقييم البعدي لمعرفة مجالات التحسن وما يحتاج إلى مزيد من التطوير.'}</p></section>
 <div class="grid"><div class="card modulecard" onclick="openAssessment('pre')"><span class="ribbon">START HERE</span><h3>${ui.pre[lang]}</h3><p>${lang==='en'?'20 medium-to-challenging questions focused mainly on sales-supervisor situations. No feedback until the end.':'20 سؤالاً متوسطاً إلى متقدم، معظمها مواقف لمشرفي المبيعات. لا تظهر التغذية الراجعة إلا في النهاية.'}</p></div>
 ${DATA.modules.map(m=>`<div class="card modulecard" onclick="openModule(${m.id})"><span class="ribbon">MODULE ${m.id}</span><h3>${m.title[lang].replace(/^Module \d+: /,'')}</h3><p>${m.subsections.map(s=>s.title[lang].replace(/^Module\s*\d+[.:a-zA-Z]*\s*:?\s*/,'')).join(' • ')}</p></div>`).join('')}
 <div class="card modulecard" onclick="openAssessment('post')"><span class="ribbon">MODULE 8</span><h3>${ui.post[lang]}</h3><p>${lang==='en'?'A parallel 20-question assessment that compares your capability by module against your pre-course baseline.':'تقييم بعدي موازٍ من 20 سؤالاً يقارن قدراتك حسب كل وحدة مع خط الأساس قبل الكورس.'}</p></div></div>`;
}
function renderModule(){
 const m=DATA.modules.find(x=>x.id===currentModuleId);
 app.innerHTML=`<section class="hero"><div class="eyebrow">Module ${m.id}</div><h2 class="display">${m.title[lang].replace(/^Module \d+: /,'')}</h2><p>${lang==='en'?'Review the key learning content, complete the knowledge check, then use the case activity for application and discussion.':'راجع المحتوى التعليمي، أكمل اختبار الفهم، ثم استخدم الحالة للتطبيق والنقاش.'}</p></section>
 <div class="tabs"><button class="tab ${currentTab==='learn'?'active':''}" onclick="switchTab('learn')">${ui.learn[lang]}</button><button class="tab ${currentTab==='check'?'active':''}" onclick="switchTab('check')">${ui.check[lang]}</button><button class="tab ${currentTab==='case'?'active':''}" onclick="switchTab('case')">${ui.case[lang]}</button></div><div id="tabbody"></div>`;
 if(currentTab==='learn')renderLearn();else if(currentTab==='check')renderCheck();else renderCase();
}
function renderLearn(){
 const sections=DETAILED_LEARN[String(currentModuleId)]||[];
 if(!sections.length){tabbody.innerHTML='<div class="placeholder">Content pending.</div>';return;}
 tabbody.innerHTML=sections.map(s=>`<div class="learn">
   <span class="ribbon">${lang==='en'?'DETAILED MODULE GUIDE':'دليل تفصيلي للوحدة'}</span>
   <h3>${s.title[lang]}</h3>
   <p style="line-height:1.75;color:#526176;margin:0 0 13px">${s.body[lang]}</p>
   <ul>${s.points[lang].map(x=>`<li>${x}</li>`).join('')}</ul>
 </div>`).join('')+(currentModuleId===4?`<div class="insight"><b>${lang==='en'?'Source note':'ملاحظة المصدر'}</b><br>${lang==='en'?'The PDF uploaded in this turn contains Delegation only. Directing theory is intentionally not invented here; add the approved Directing material when available.':'ملف PDF المرفوع في هذه الرسالة يحتوي على التفويض فقط. لم يتم اختراع نظرية Directing هنا؛ أضف المادة المعتمدة عندما تصبح متاحة.'}</div>`:'');
}
function renderCheck(){const m=DATA.modules.find(x=>x.id===currentModuleId);if(currentModuleId===4){tabbody.innerHTML=`<div class="placeholder"><h3>${lang==='en'?'Knowledge Check will be added later':'سيتم إضافة اختبار الفهم لاحقًا'}</h3><p>${lang==='en'?'The quiz will be developed after the Directing content is finalized.':'سيتم تطوير الاختبار بعد اعتماد محتوى Directing.'}</p></div>`;return;}let picks=m.subsections.length>1?`<div class="quizpicker">${m.subsections.map((s,i)=>`<button class="pill ${currentSub===i?'active':''}" onclick="currentSub=${i};qi=0;qscore=0;answered=false;wrong=[];renderCheck()">${s.title[lang]}</button>`).join('')}</div>`:'';tabbody.innerHTML=picks+'<div id="quizarea"></div>';renderQuizQ();}
function renderQuizQ(){const m=DATA.modules.find(x=>x.id===currentModuleId),s=m.subsections[currentSub],qs=s.questions||[];if(!qs.length){quizarea.innerHTML='<div class="placeholder">No quiz data.</div>';return}if(qi>=qs.length){let pct=Math.round(qscore/qs.length*100);state.moduleScores[currentModuleId]={score:qscore,total:qs.length,pct,date:new Date().toISOString()};save();renderSide();quizarea.innerHTML=`<div class="quizbox" style="text-align:center"><div class="display" style="font-size:54px;color:var(--navy)">${qscore}/${qs.length}</div><h3>${pct}%</h3><button class="next" onclick="qi=0;qscore=0;answered=false;wrong=[];renderCheck()">${lang==='en'?'Retry Quiz':'إعادة الاختبار'}</button></div>`;return}let q=qs[qi];quizarea.innerHTML=`<div class="quizbox"><div class="qtop"><div class="qnum">${lang==='en'?'QUESTION':'السؤال'} ${qi+1} / ${qs.length}</div></div><div class="progress"><div style="width:${(qi/qs.length)*100}%"></div></div><div class="qtext">${q.s[lang]}</div>${q.o[lang].map((o,i)=>`<button class="opt" onclick="answerQuiz(${i},this)">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}<div id="qfb"></div></div>`;}
function answerQuiz(i,b){if(answered)return;answered=true;const m=DATA.modules.find(x=>x.id===currentModuleId),s=m.subsections[currentSub],q=s.questions[qi];document.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(j===q.a)x.style.borderColor='#21864a'});if(i===q.a)qscore++;else b.style.borderColor='var(--red)';qfb.innerHTML=`<div class="insight">${q.e[lang]}</div><button class="next" onclick="qi++;answered=false;renderQuizQ()">${ui.next[lang]}</button>`;}
function renderCase(){
 const m=DATA.modules.find(x=>x.id===currentModuleId),acts=m.subsections.filter(s=>s.activity&&s.activity[lang]);
 let sourceHtml=acts.length?acts.map(s=>`<div class="activity">${s.activity[lang]}</div>`).join('<div style="height:13px"></div>'):`<div class="placeholder"><h3>${lang==='en'?'Case will be added':'سيتم إضافة الحالة'}</h3><p>${lang==='en'?'The module structure is ready for the approved case activity.':'هيكل الوحدة جاهز لإضافة الحالة المعتمدة.'}</p></div>`;
 const cfg=CASE_CONFIG[String(currentModuleId)];
 tabbody.innerHTML=sourceHtml+(cfg?renderCaseWorkspace(cfg):'');
}
function getCaseStore(){
 state.caseResponses=state.caseResponses||{};
 state.caseResponses[currentModuleId]=state.caseResponses[currentModuleId]||{};
 return state.caseResponses[currentModuleId];
}
function renderCaseWorkspace(cfg){
 const saved=getCaseStore();
 return `<div class="case-workspace"><span class="ribbon">${lang==='en'?'YOUR WORKSPACE':'مساحة عملك'}</span><h3>${cfg.title[lang]}</h3>${cfg.items.map(item=>renderCaseItem(item,saved[item.id])).join('')}<div class="case-actions"><button class="next" onclick="save()">💾 ${lang==='en'?'Save Responses':'حفظ الإجابات'}</button><button class="secondary" onclick="clearCaseResponses()">${lang==='en'?'Clear Responses':'مسح الإجابات'}</button></div><div class="saved-indicator" id="caseSaved">${lang==='en'?'Responses save automatically on this browser/device.':'يتم حفظ الإجابات تلقائياً على هذا المتصفح/الجهاز.'}</div></div>`;
}
function renderCaseItem(item,value){
 if(item.type==='text'){
   return `<div class="case-item"><label>${item.q[lang]}</label><textarea placeholder="${item.placeholder[lang]}" oninput="saveCaseValue('${item.id}',this.value)">${value||''}</textarea></div>`;
 }
 if(item.type==='dropdown'){
   return `<div class="case-item"><label>${item.q[lang]}</label><select onchange="saveCaseValue('${item.id}',this.value)">${item.options[lang].map((o,i)=>`<option value="${i===0?'':o.replace(/"/g,'&quot;')}" ${value===o?'selected':''}>${o}</option>`).join('')}</select></div>`;
 }
 if(item.type==='mcq'){
   return `<div class="case-item"><label>${item.q[lang]}</label>${item.options[lang].map((o,i)=>`<button class="case-choice ${value===o?'selected':''}" onclick="selectCaseChoice('${item.id}',${i},this)">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div>`;
 }
 return '';
}
function saveCaseValue(id,value){
 const store=getCaseStore();store[id]=value;save();flashCaseSaved();
}
function selectCaseChoice(id,index,btn){
 const cfg=CASE_CONFIG[String(currentModuleId)],item=cfg.items.find(x=>x.id===id),value=item.options[lang][index];
 const store=getCaseStore();store[id]=value;save();
 const parent=btn.parentElement;parent.querySelectorAll('.case-choice').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');flashCaseSaved();
}
function flashCaseSaved(){
 const el=document.getElementById('caseSaved');if(!el)return;el.textContent=lang==='en'?'Saved ✓':'تم الحفظ ✓';setTimeout(()=>{if(el)el.textContent=lang==='en'?'Responses save automatically on this browser/device.':'يتم حفظ الإجابات تلقائياً على هذا المتصفح/الجهاز.'},1200);
}
function clearCaseResponses(){
 if(!state.caseResponses)return;delete state.caseResponses[currentModuleId];save();renderCase();
}
function openAssessment(type){stopTimer();view='assessment';assessType=type;currentModuleId=null;ai=0;aAnswers=[];selected=null;renderSide();render();}
function renderAssess(){
 const saved=state[assessType];
 if(saved){renderAssessResult(saved);return}
 let title=assessType==='pre'?ui.pre[lang]:ui.post[lang];
 let isPost=assessType==='post';
 app.innerHTML=`<section class="hero"><div class="eyebrow">${isPost?'Module 8':'Baseline Diagnostic'}</div><h2 class="display">${title}</h2><p>${lang==='en'?(isPost?'Measure what changed after the course. Your results will be compared with your pre-course profile across all seven management areas.':'This is a diagnostic, not a pass/fail test. You will answer 20 questions, mostly based on realistic sales-supervisor situations. Each question has a 25-second limit and no feedback appears until the end.'):(isPost?'قِس ما تغير بعد الكورس. ستتم مقارنة نتيجتك مع تقييمك القبلي عبر المجالات الإدارية السبعة.':'هذا تقييم تشخيصي وليس نجاحاً أو رسوباً. ستجيب عن 20 سؤالاً معظمها مواقف واقعية لمشرفي المبيعات، ولكل سؤال 25 ثانية، ولا تظهر التغذية الراجعة إلا في النهاية.')}</p></section>
 <div class="assessintro"><div class="card"><h3>${lang==='en'?'How it works':'كيف يعمل التقييم'}</h3><p>${lang==='en'?'• 20 multiple-choice questions<br>• 25 seconds per question<br>• No question-by-question feedback<br>• Unanswered questions move forward automatically<br>• Final feedback identifies your learning priorities':'• 20 سؤال اختيار من متعدد<br>• 25 ثانية لكل سؤال<br>• بدون تغذية راجعة بعد كل سؤال<br>• ينتقل السؤال تلقائياً عند انتهاء الوقت<br>• التغذية الراجعة النهائية تحدد أولويات التعلم'}</p><button class="next red" onclick="beginAssessment()">${ui.start[lang]}</button></div><div class="sidepanel"><h3>${lang==='en'?'Your Learning Baseline':'خط أساس التعلم'}</h3><div class="big">20</div><p>${lang==='en'?'Questions across 7 capability areas':'سؤالاً عبر 7 مجالات قدرات'}</p><div class="big">25s</div><p>${lang==='en'?'Maximum time for each question':'الحد الأقصى لكل سؤال'}</p></div></div>`;
}
function beginAssessment(){ai=0;aAnswers=[];selected=null;renderAssessQ();}
function renderAssessQ(){stopTimer();const qs=ASSESS[assessType];if(ai>=qs.length){finishAssessment();return}const q=qs[ai];const arq=ASSESS_AR[assessType][ai];const qText=lang==='ar'?arq[0]:q.q;const qOpts=lang==='ar'?arq[1]:q.o;const domainLabel=lang==='ar'?(DOMAIN_AR[q.d]?.ar||ASSESS.domains[q.d].en):ASSESS.domains[q.d].en;seconds=25;selected=null;app.innerHTML=`<section class="hero" style="padding:20px 26px"><div class="eyebrow">${lang==='ar'?(assessType==='pre'?'التقييم القبلي':'التقييم البعدي'):(assessType==='pre'?'Pre Self-Assessment':'Post-Training Assessment')}</div><h2 class="display" style="font-size:30px">${lang==='en'?'Think like a Sales Supervisor':'فكّر كمشرف مبيعات'}</h2></section><div class="assessmentbox"><div class="qtop"><div><div class="qnum">${lang==='en'?'QUESTION':'السؤال'} ${ai+1} / 20</div><div style="font-size:11px;color:#91a0b2;margin-top:3px">${domainLabel}</div></div><div class="timer" id="timerCircle"><span id="timeNum">25</span></div></div><div class="progress"><div style="width:${(ai/20)*100}%"></div></div><div class="qtext">${qText}</div><div id="aopts">${qOpts.map((o,i)=>`<button class="opt" onclick="selectAssess(${i},this)">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div><div id="anext"></div></div>`;startTimer();}
function startTimer(){stopTimer();timerId=setInterval(()=>{seconds--;if(timeNum)timeNum.textContent=seconds;if(timerCircle)timerCircle.style.setProperty('--timer-pct',(seconds/25*100)+'%');if(seconds<=0){stopTimer();submitAssess(null,true)}},1000)}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function selectAssess(i,b){if(selected!==null)return;selected=i;stopTimer();document.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(j===i)x.classList.add('selected')});anext.innerHTML=`<button class="next" onclick="submitAssess(${i},false)">${ai===19?ui.finish[lang]:ui.next[lang]}</button>`;}
function submitAssess(i,timedout){aAnswers.push(i);ai++;selected=null;if(ai>=20)finishAssessment();else renderAssessQ();}
function finishAssessment(){stopTimer();const qs=ASSESS[assessType];let correct=0,by={};Object.keys(ASSESS.domains).forEach(d=>by[d]={correct:0,total:0});qs.forEach((q,i)=>{by[q.d].total++;if(aAnswers[i]===q.a){correct++;by[q.d].correct++}});let scores={};Object.keys(by).forEach(d=>scores[d]=Math.round(by[d].correct/by[d].total*100));let result={correct,total:Math.round(correct/20*100),scores,answers:aAnswers,date:new Date().toISOString()};state[assessType]=result;save();renderSide();renderAssessResult(result);}
function renderAssessResult(r){stopTimer();let title=assessType==='pre'?ui.pre[lang]:ui.post[lang];let entries=Object.entries(r.scores).sort((a,b)=>a[1]-b[1]);let cards=entries.map(([d,v])=>`<div class="domain"><div class="domainhead"><span>${lang==='ar'?(DOMAIN_AR[d]?.ar||ASSESS.domains[d].en):ASSESS.domains[d].en}</span><span>${v}%</span></div><div class="bar"><div class="${v<60?'low':v>=80?'high':''}" style="width:${v}%"></div></div></div>`).join('');let extra='';
 if(assessType==='pre'){let weak=entries.slice(0,3);extra=`<div class="insight"><b>${ui.weak[lang]}</b><br>${weak.map(([d,v])=>`<strong>${lang==='ar'?(DOMAIN_AR[d]?.ar||ASSESS.domains[d].en):ASSESS.domains[d].en}</strong>: ${lang==='ar'?(DOMAIN_AR[d]?.focusAr||ASSESS.domains[d].focus):ASSESS.domains[d].focus}`).join('<br><br>')}</div>`}
 else if(state.pre){
 let deltas=Object.keys(r.scores).map(d=>[d,r.scores[d]-state.pre.scores[d],r.scores[d],state.pre.scores[d]]).sort((a,b)=>b[1]-a[1]);
 let improved=deltas.filter(x=>x[1]>0).slice(0,3);
 let still=deltas.filter(x=>x[2]<70).sort((a,b)=>a[2]-b[2]).slice(0,3);
 let preCorrect=state.pre.correct??Math.round((state.pre.total/100)*20);
 let postCorrect=r.correct??Math.round((r.total/100)*20);
 let correctGrowth=postCorrect-preCorrect;
 let pctGrowth=r.total-state.pre.total;
 let domainCounts={};
 const preQs=ASSESS.pre, postQs=ASSESS.post;
 Object.keys(ASSESS.domains).forEach(d=>{
   const preTotal=preQs.filter(q=>q.d===d).length;
   const postTotal=postQs.filter(q=>q.d===d).length;
   const preCorrectD=preQs.map((q,i)=>q.d===d&&state.pre.answers?.[i]===q.a?1:0).reduce((a,b)=>a+b,0);
   const postCorrectD=postQs.map((q,i)=>q.d===d&&r.answers?.[i]===q.a?1:0).reduce((a,b)=>a+b,0);
   domainCounts[d]={preCorrect:preCorrectD,preTotal,postCorrect:postCorrectD,postTotal,growth:postCorrectD-preCorrectD};
 });
 extra=`<div class="card" style="margin-top:16px">
   <h3>${lang==='en'?'Overall Growth':'النمو الإجمالي'}</h3>
   <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px">
     <div class="domain" style="text-align:center"><div style="font-size:11px;color:#7a889b">${lang==='en'?'PRE CORRECT':'الصحيح قبل'}</div><div class="display" style="font-size:32px;color:var(--navy)">${preCorrect}/20</div></div>
     <div class="domain" style="text-align:center"><div style="font-size:11px;color:#7a889b">${lang==='en'?'POST CORRECT':'الصحيح بعد'}</div><div class="display" style="font-size:32px;color:var(--navy)">${postCorrect}/20</div></div>
     <div class="domain" style="text-align:center"><div style="font-size:11px;color:#7a889b">${lang==='en'?'GROWTH':'النمو'}</div><div class="display" style="font-size:32px;color:${correctGrowth>=0?'var(--green)':'var(--red)'}">${correctGrowth>=0?'+':''}${correctGrowth}</div></div>
     <div class="domain" style="text-align:center"><div style="font-size:11px;color:#7a889b">${lang==='en'?'SCORE CHANGE':'تغير النتيجة'}</div><div class="display" style="font-size:32px;color:${pctGrowth>=0?'var(--green)':'var(--red)'}">${pctGrowth>=0?'+':''}${pctGrowth} pts</div></div>
   </div>
   <div class="insight" style="margin-top:14px">
     <b>${lang==='en'?'Growth Summary':'ملخص النمو'}</b><br>
     ${lang==='en'
       ?`You answered <strong>${preCorrect}/20</strong> correctly before the course and <strong>${postCorrect}/20</strong> after the course. Your change is <strong>${correctGrowth>=0?'+':''}${correctGrowth} correct answers</strong> and <strong>${pctGrowth>=0?'+':''}${pctGrowth} percentage points</strong>.`
       :`أجبت بشكل صحيح عن <strong>${preCorrect}/20</strong> قبل الكورس و<strong>${postCorrect}/20</strong> بعد الكورس. مقدار التغير هو <strong>${correctGrowth>=0?'+':''}${correctGrowth} إجابات صحيحة</strong> و<strong>${pctGrowth>=0?'+':''}${pctGrowth} نقطة مئوية</strong>.`}
   </div>
 </div>
 <div class="card" style="margin-top:16px">
   <h3>${lang==='en'?'Growth by Learning Area':'النمو حسب مجال التعلم'}</h3>
   ${Object.keys(domainCounts).map(d=>{let x=domainCounts[d];return `<div class="compare"><span>${lang==='ar'?(DOMAIN_AR[d]?.ar||ASSESS.domains[d].en):ASSESS.domains[d].en}</span><span>${x.preCorrect}/${x.preTotal} → ${x.postCorrect}/${x.postTotal}</span><span class="delta ${x.growth>=0?'pos':'neg'}">${x.growth>=0?'+':''}${x.growth}</span></div>`}).join('')}
 </div>
 <div class="card" style="margin-top:16px"><h3>${lang==='en'?'Pre vs Post Percentage Comparison':'مقارنة النسب قبل وبعد'}</h3>${deltas.map(x=>`<div class="compare"><span>${lang==='ar'?(DOMAIN_AR[x[0]]?.ar||ASSESS.domains[x[0]].en):ASSESS.domains[x[0]].en}</span><span>${x[3]}% → ${x[2]}%</span><span class="delta ${x[1]>=0?'pos':'neg'}">${x[1]>=0?'+':''}${x[1]} pts</span></div>`).join('')}</div>
 <div class="insight"><b>${ui.improved[lang]}</b><br>${improved.length?improved.map(x=>ASSESS.domains[x[0]].en+' (+'+x[1]+' pts)').join(' • '):(lang==='en'?'No measurable increase yet.':'لا يوجد تحسن قابل للقياس بعد.')}</div>
 <div class="insight"><b>${ui.still[lang]}</b><br>${still.length?still.map(x=>`<strong>${lang==='ar'?(DOMAIN_AR[x[0]]?.ar||ASSESS.domains[x[0]].en):ASSESS.domains[x[0]].en}</strong>: ${lang==='ar'?(DOMAIN_AR[x[0]]?.focusAr||ASSESS.domains[x[0]].focus):ASSESS.domains[x[0]].focus}`).join('<br>'):(lang==='en'?'No major gaps identified below 70%.':'لا توجد فجوات رئيسية أقل من 70٪.')}</div>`}
 app.innerHTML=`<section class="hero"><div class="eyebrow">${assessType==='pre'?'Diagnostic Profile':'Module 8 • Final Profile'}</div><h2 class="display">${title}</h2><p>${lang==='en'?'Your result is shown by capability area so you know what to focus on next.':'تظهر نتيجتك حسب مجال القدرة حتى تعرف أين تركز بعد ذلك.'}</p></section><div class="quizbox" style="text-align:center"><div class="display" style="font-size:62px;color:var(--navy)">${r.total}%</div><div style="color:#738196">${ui.score[lang]}</div></div><div class="resultsgrid">${cards}</div>${extra}<div style="margin-top:15px"><button class="next" onclick="resetAssessment('${assessType}')">${lang==='en'?'Retake Assessment':'إعادة التقييم'}</button>${assessType==='pre'?` <button class="next red" onclick="openModule(1)">${lang==='en'?'Continue to Module 1':'الانتقال إلى الوحدة 1'}</button>`:''}</div>`;}
function resetAssessment(type){delete state[type];save();openAssessment(type);}
renderSide();render();
</script>
</body></html>
