<script>
"use strict";

const field = (id, label, options = {}) => ({id,label,...options});
const choice = (id, label, choices) => field(id,label,{choices});
const evidencePrompts = [
  "The pilot started on Monday in two departments.",
  "“If two departments managed the change, every department will find it easy.”",
  "The pilot log shows that 19 of 20 routine requests reached the intended team.",
  "Can we test whether urgent requests reach the intended team on both shifts?",
  "The team used the same handover form throughout the pilot.",
  "“The day shift found the form easy to use, so the night shift will too.”",
  "Can we compare both shifts’ handover records to check whether the error rate is similar?",
  "The signed attendance sheet lists 8 of the 10 pilot staff at the process briefing."
];
const biasPrompts = [
  '“This process is faster, so it must give us the best overall result.”',
  '“Let’s keep the current form. We’ve always used it.”',
  '“The first estimate was 20 days. The new estimate is 14, so that sounds reasonable.”',
  '“The pilot worked. Include the successful handovers in the review and leave the failed cases out.”',
  '“We need a decision today. Let’s skip the readiness check.”',
  '“We’ve already spent six weeks on this rollout. We should keep going even though the pilot missed its targets.”',
  '“The department director prefers this option. That settles it.”',
  '“Yesterday’s missed handover was a mess. This must be our most frequent problem.”',
];
const biasBank = ['Anchoring','Authority','Availability','Confirmation','Familiarity','Overweighting one criterion','Sunk cost','Urgency'];
const mustPrompts = ['Documented approval','Compatibility with the existing tracking system','Rollout within 15 calendar days','Faster support','Lower staff effort','Shorter training'];
const purchasePrompts = ['Wi-Fi connectivity','Compatibility with the existing label software','Delivery within five business days','An extra roll of labels','A two-year warranty','Total cost of JOD 200 or less'];
const choicesABC = ['A · Shared tracker','B · Standard form and queue','C · Dedicated workflow'];
const ratings = Array.from({length:10},(_,i)=>String(i+1));
const metrics = [
  {id:'reliability',label:'Handover reliability',weight:'35%',values:['91%','97%','99%']},
  {id:'effort',label:'Staff effort to implement',weight:'30%',values:['Low','Medium','High']},
  {id:'coverage',label:'Request types supported',weight:'20%',values:['20','28','32']},
  {id:'speed',label:'Time to start',weight:'15%',values:['4 days','7 days','10 days']},
];
const metricsMatrix = metrics.map(m=>({
  label:m.label,
  weight:m.weight,
  fields:['A','B','C'].map(o=>choice(m.id+o,m.label+' rating for Option '+o,ratings)),
}));
const finalScores = ['A','B','C'].map(o=>field('total'+o,'Weighted total for Option '+o,{number:true}));
const pitch = () => [
  field('recommendation','Your final recommendation and the decision you want approved'),
  field('evidence','What evidence supports your recommendation?'),
  field('tradeoff','What trade-off are you asking the stakeholder to accept?'),
  field('next','What should be verified before proceeding, and who should verify it?'),
  field('pitch','Write your 60-second response to the stakeholder'),
];
const modules = [
  {
    title:'Check & Challenge',
    intro:'Test what the available information supports before you act on it.',
    cases:[
      {
        id:'m1-classify',title:'Fact, Assumption, Evidence, or Validation?',
        brief:'Your pharmaceutical company has piloted a new process for handing over requests between departments. The project team wants to roll it out across the company.',
        instruction:'Group 1 reviews items 1–4. Group 2 reviews items 5–8. Choose one category per item. A fact states what happened, evidence points to a record or finding, and validation asks how to check a claim.',
        rows:evidencePrompts.map((text,i)=>({text,fields:[choice('classification'+(i+1),'Classification',['Fact','Assumption','Evidence','Validation'])]})),
        fields:[],
      },
      {
        id:'m1-bias',title:'Catch the Bias',
        brief:'The project team is discussing the handover pilot. Listen for what may be shaping each colleague’s judgment.',
        instruction:'Group 1 reviews situations 1–4. Group 2 reviews situations 5–8. Match each situation to a bias or decision pattern. Each option can be used once.',
        rows:biasPrompts.map((text,i)=>({text,fields:[choice('bias'+(i+1),'Bias or decision pattern',biasBank)]})),
        uniqueChoices:true,
        fields:[],
      },
    ],
  },
  {
    title:'Compare & Choose',
    intro:'Check which options can proceed, then compare the eligible options against the same criteria.',
    cases:[
      {
        id:'m2-musts',title:'Must or Want?',
        brief:'A pharmaceutical company wants to improve how departments hand over internal requests. The project lead says, “Faster support would help. We need documented approval before rollout. Keep training short if possible. The new process has to use our current tracking system. I’d prefer lower staff effort, and we must start within 15 calendar days.”',
        callout:'Option X has documented approval, can be ready in 10 days, and offers low effort, fast support, and short training. It cannot use the existing tracking system.',
        instruction:'Classify the six criteria. Then decide whether Option X should proceed to scoring.',
        rows:mustPrompts.map((text,i)=>({text,fields:[choice('must'+i,'Classification',['Must','Want'])]})),
        fields:[choice('eligible','Should Option X proceed to scoring?',['Yes','No']),field('reason','Explain your decision in one sentence.')],
      },
      {
        id:'m2-purchase',title:'Must or Want? · The Label Printer Request',
        brief:'A manager asks an employee to buy a label printer for shared office storage. “Wi-Fi would be useful. The printer must work with our existing label software and arrive within five business days. I’d prefer an extra roll and a two-year warranty. Keep the total cost within JOD 200.”',
        callout:'Option Y costs JOD 165 and works with the existing label software. It has Wi-Fi, includes an extra roll, and comes with a two-year warranty. The seller confirms delivery in seven business days.',
        instruction:'Classify the six criteria. Then decide whether Option Y should proceed to scoring.',
        rows:purchasePrompts.map((text,i)=>({text,fields:[choice('purchase'+i,'Classification',['Must','Want'])]})),
        fields:[choice('eligible','Should Option Y proceed to scoring?',['Yes','No']),field('reason','Explain your decision in one sentence.')],
      },
      {
        id:'m2-matrix',ratingScale:10,title:'The Option That Looks Best',
        brief:'Three ways to handle internal requests across departments have passed the agreed Musts. Which would you recommend?',
        instruction:'Review the options and record your first impression. The criteria weights appear after you save your initial choice.',
        firstTable:{headers:['Criterion',...choicesABC],items:metrics.map(m=>[m.label,...m.values])},
        before:[
          choice('firstChoice','Which option would you recommend on first impression?',choicesABC),
          field('firstReason','Why did you choose it?'),
        ],
        revealLabel:'Save First Choice & Show Weights',
        revealTitle:'The agreed weights',
        revealText:'Use a 1–10 scale. For this exercise, give 10 to the strongest result, 5 to the middle, and 1 to the weakest. Lower effort and a shorter time to start score higher. Multiply each rating by its weight and add the results for a total out of 10.',
        matrix:metricsMatrix,
        fields:[
          ...finalScores,
          choice('finalChoice','Which option has the highest weighted score?',choicesABC),
        ],
      },
    ],
  },
  {
    title:'Critique, Validate & Convince',
    intro:'Challenge the recommendation, revisit it when evidence changes, and explain what you want approved.',
    cases:[
      {
        id:'m3-handover',ratingScale:10,title:'The Handover Workflow',
        brief:'A pharmaceutical company wants to roll out a new internal request workflow. A pilot that used routine requests ranked Option C first. C covers 32 request types and B covers 28.',
        firstTable:{headers:['Option','Initial reliability rating','Initial weighted score'],items:[
          [choicesABC[0],'1','5.05'],[choicesABC[1],'5','5.00'],[choicesABC[2],'10','5.95'],
        ]},
        instruction:'Play the Devil’s Advocate. Write your strongest objection and record your initial recommendation.',
        before:[
          field('objection','What could make the original result misleading?'),
          field('initial','What would you initially recommend, and what evidence would you ask for?'),
        ],
        revealLabel:'Save Initial Response & Reveal Evidence',
        revealTitle:'The repeat test',
        revealText:'The repeat test included urgent and cross-shift requests. Handover reliability was 91% for A, 97% for B, and 93% for C. All options still meet the Musts. Reliability carries 35% of the weighted score.',
        matrix:[{label:'Handover reliability',weight:'35%',fields:['A','B','C'].map(o=>choice('updatedRating'+o,'Updated reliability rating for Option '+o,ratings))}],
        afterInstruction:'Use the same 1–10 scale: 10 for the highest reliability, 5 for the middle, and 1 for the lowest. Update the weighted totals out of 10 while keeping the other ratings unchanged.',
        stakeholder:'“What do we give up if we move from C to B?”',
        fields:[
          ...finalScores,
          choice('changeType','What changed in the decision matrix?',['A Must','A weighted criterion','Neither']),
          field('validation','Explain what changed in your comparison and why.'),
          ...pitch(),
        ],
      },
      {
        id:'m3-training',title:'The Training Rollout',
        brief:'A pharmaceutical company plans to start using a new shift handover form on Monday. The day shift has signed off. The night shift is scheduled to practice on Friday. The initial recommendation is to switch both shifts on Monday.',
        callout:'The Must · Each shift must complete supervised practice and sign-off before it switches.',
        instruction:'Play the Devil’s Advocate. Challenge the initial recommendation before you see the update.',
        before:[
          field('objection','What are we assuming about night-shift readiness?'),
          field('initial','What is your initial recommendation, and what would you check first?'),
        ],
        revealLabel:'Save Initial Response & Reveal Evidence',
        revealTitle:'The missed sign-off',
        revealText:'Night-shift practice moved to Wednesday. The shared handover record cannot support the old and new forms in parallel.',
        stakeholder:'“Why can’t the day shift start on Monday?”',
        fields:[
          choice('option','What would you do now?',['Switch both shifts on Monday','Switch only the day shift on Monday','Keep the current form until both shifts are signed off']),
          field('validation','Which option still meets the Must and the shared-record constraint? Explain your reasoning.'),
          ...pitch(),
        ],
      },
    ],
  },
];

const arabic = {"DAD Academy": "أكاديمية دار الدواء", "Decision Making & Critical Thinking": "اتخاذ القرار والتفكير النقدي", "Three modules and seven workplace exercises.": "ثلاث وحدات وسبعة تمارين من بيئة العمل.", "Skip to workshop content": "انتقل إلى محتوى الورشة", "Modules": "الوحدات", "Module content": "محتوى الوحدة", "Workshop content": "محتوى الورشة", "Exercises in this module": "تمارين هذه الوحدة", "Module": "الوحدة", "Explanation": "الشرح", "Exercises": "التمارين", "Go to Exercises": "انتقل إلى التمارين", "Example": "مثال", "Running case · Internal request handovers": "الحالة المشتركة · تسليم الطلبات الداخلية", "Check & Challenge": "تحقّق وتحدَّ الافتراضات", "Compare & Choose": "قارن واختر", "Critique, Validate & Convince": "راجع القرار وتحقّق منه وأقنع صاحب القرار", "Test what the available information supports before you act on it.": "تحقّق مما تدعمه المعلومات المتاحة قبل أن تتصرّف بناءً عليها.", "Check which options can proceed, then compare the eligible options against the same criteria.": "حدّد الخيارات التي يمكن المضي بها، ثم قارن الخيارات المؤهّلة باستخدام المعايير نفسها.", "Challenge the recommendation, revisit it when evidence changes, and explain what you want approved.": "تحدَّ التوصية وراجعها عندما يتغيّر الدليل، ثم وضّح ما تطلب الموافقة عليه.", "Your pharmaceutical company has piloted a new process for handing over requests between departments. The project team wants to roll it out across the company.": "جرّبت شركة الأدوية طريقة جديدة لتسليم الطلبات بين الأقسام. يريد فريق المشروع تطبيقها في جميع أقسام الشركة.", "Classification": "التصنيف", "Fact": "حقيقة", "Assumption": "افتراض", "Catch the Bias": "اكتشف التحيّز", "The project team is discussing the handover pilot. Listen for what may be shaping each colleague’s judgment.": "يناقش فريق المشروع تجربة تسليم الطلبات. انتبه لما قد يؤثّر على حكم كل زميل.", "“This process is faster, so it must give us the best overall result.”": "«هذه الطريقة أسرع، إذن لا بد أنها تعطي أفضل نتيجة إجمالاً».", "“Let’s k idation?": "حقيقة أم افتراض أم دليل أم تحقّق؟", "Evidence": "دليل", "Validation": "تحقّق", "Group 1 reviews items 1–4. Group 2 reviews items 5–8. Choose one category per item. A fact states what happened, evidence points to a record or finding, and validation asks how to check a claim.": "تراجع المجموعة الأولى البنود 1–4، والثانية البنود 5–8. اختر تصنيفاً واحداً لكل بند. الحقيقة تصف ما حدث، والدليل يشير إلى سجل أو نتيجة، والتحقّق يطرح سؤالاً لفحص ادّعاء.", "The pilot started on Monday in two departments.": "بدأت التجربة يوم الاثنين في قسمين.", "“If two departments managed the change, every department will find it easy.”": "«إذا قدر قسمان يطبّقوا التغيير، أكيد كل الأقسام رح تلاقيه سهل».", "The pilot log shows that 19 of 20 routine requests reached the intended team.": "يبيّن سجل التجربة أن 19 من أصل 20 طلباً عادياً وصلت إلى الفريق المعني.", "Can we test whether urgent requests reach the intended team on both shifts?": "هل يمكننا اختبار وصول الطلبات العاجلة إلى الفريق المعني في كلتا الورديتين؟", "The team used the same handover form throughout the pilot.": "استخدم الفريق نموذج تسليم الطلبات نفسه طوال التجربة.", "“The day shift found the form easy to use, so the night shift will too.”": "«الوردية النهارية لقت النموذج سهل الاستخدام، إذن الوردية الليلية رح تلاقيه سهل كمان».", "Can we compare both shifts’ handover records to check whether the error rate is similar?": "هل يمكننا مقارنة سجلات التسليم للورديتين للتحقّق مما إذا كان معدل الأخطاء متقارباً؟", "The signed attendance sheet lists 8 of the 10 pilot staff at the process briefing.": "تُظهر ورقة الحضور الموقّعة أن 8 من أصل 10 موظفين شاركوا في جلسة شرح الإجراء.", "Group 1 reviews situations 1–4. Group 2 reviews situations 5–8. Match each situation to a bias or decision pattern. Each option can be used once.": "تراجع المجموعة الأولى المواقف 1–4، والثانية المواقف 5–8. اختر التحيّز أو نمط التفكير لكل موقف. يمكنك استخدام كل خيار مرة واحدة.", "Case": "الحالة", "Must or Want? · The Label Printer Request": "شرط إلزامي أم معيار const storageKey = 'dad-decision-making-activities-v1';
const byId = (id) => document.getElementById(id);
const content = byId('content');
const caseList = modules.flatMap(m=>m.cases);
let storageError = false;
let saved = {};
try {
  const raw = localStorage.getItem(storageKey);
  if (raw) {
    const data = JSON.parse(raw);
    if (data && typeof data === 'object' && !Array.isArray(data)) saved = data;
  }
} catch {
  storageError = true;
}
const draft = Object.create(null);
for (const c of caseList) {
  const entry = saved[c.id];
  const answers = Object.create(null);
  const outdatedRatings = c.ratingScale && entry?.ratingScale !== c.ratingScale
    ? new Set([...c.matrix.flatMap(row=>row.fields),...finalScores].map(f=>f.id))
    : null;
  for (const [key,value] of Object.entries(entry?.answers ?? {})) {
    if (typeof value === 'string' && !outdatedRatings?.has(key)) answers[key] = value;
  }
  if (c.uniqueChoices) {
    const used=new Set();
    const retained=Object.create(null);
    for (const {fields:[f]} of c.rows) {
      const value=answers[f.id];
      if (f.choices.includes(value)&&!used.has(value)) {
        retained[f.id]=value;
        used.add(value);
      }
    }
    draft[c.id] = {answers:retained,revealed:false};
  } else {
    draft[c.id] = {answers,revealed:entry?.revealed === true};
  }
}
let moduleIndex = 0;

function tr(text) {
  if (language!=='ar') return text;
  if (Object.hasOwn(arabic,text)) return arabic[text];
  const dynamic = /^(.+) rating for Option ([ABC])$/.exec(text);
  if (dynamic) return 'تقييم '+tr(dynamic[1])+' للخيار '+dynamic[2];
  const total = /^Weighted total for Option ([ABC])$/.exec(text);
  return total?'المجموع المرجّح للخيار '+total[1]:text;
}

function escT(text) { return escapeHtml(tr(text)); }

function displayHeader() {
  document.documentElement.lang=language;
  document.documentElement.dir=language==='ar'?'rtl':'ltr';
  byId('language').textContent=language==='ar'?'English':'العربية';
  byId('language').setAttribute('lang',language==='ar'?'en':'ar');
  byId('skip-link').textContent=tr('Skip to workshop content');
  byId('brand').textContent=tr('DAD Academy');
  byId('page-title').textContent=tr('Decision Making & Critical Thinking');
  byId('page-intro').textContent=tr('Three modules and seven workplace exercises.');
  document.title=tr('Decision Making & Critical Thinking')+' | '+tr('DAD Academy');
  byId('module-nav').setAttribute('aria-label',tr('Modules'));
  byId('view-nav').setAttribute('aria-label',tr('Module content'));
  content.setAttribute('aria-label',tr('Workshop content'));
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function tabs(nav, labels, current, choose, panel) {
  nav.setAttribute('role','tablist');
  nav.replaceChildren();
  labels.forEach((label,i)=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tab';
    b.id = nav.id+'-tab-'+i;
    b.setAttribute('role','tab');
    b.setAttribute('aria-selected',String(i===current));
    b.setAttribute('aria-controls',panel);
    b.tabIndex = i===current ? 0 : -1;
    b.innerHTML = label;
    b.addEventListener('click',()=>choose(i));
    b.addEventListener('keydown',e=>{
      const step=language==='ar'?-1:1;
      const next = {ArrowLeft:(i+labels.length-step)%labels.length,ArrowRight:(i+labels.length+step)%labels.length,Home:0,End:labels.length-1}[e.key];
      if(next===undefined) return;
      e.preventDefault();
      choose(next);
    });
    nav.append(b);
  });
}

function showModule(i) {
  moduleIndex=i;
  render('module-nav-tab-'+i);
}

function showView(next, focus = true) {
  view=next;
  render(focus ? 'view-nav-tab-'+(view==='explanation'?0:1) : '');
}

function showCase(i) {
  caseIndices[moduleIndex]=i;
  render('case-nav-tab-'+i);
}

      <p class="intro">${escT(m.intro)}</p>
      <div class="callout"><strong>${escT('Running case · Internal request handovers')}</strong><p>${escapeHtml(lessonContent[moduleIndex].case[language])}</p></div>
      <div class="lesson-grid">${lessonContent[moduleIndex].steps.map(step=>'<section><h3>'+escapeHtml(step[language][0])+'</h3><p>'+escapeHtml(step[language][1])+'</p><p class="example"><strong>'+escT('Example')+'</strong><br>'+escapeHtml(step[language][2])+'</p></section>').join('')}</div>
      <div class="actions"><button type="button" class="button" id="go-exercises">${escT('Go to Exercises')}</button><button type="button" class="button secondary" data-action="export">${escT('Export My Answers')}</button></div>
      <p class="message" id="message" role="status" aria-live="polite"></p>`;
    byId('go-exercises').addEventListener('click',()=>showView('exercises'));
  } else {
    const c=m.cases[index];
    const state=draft[c.id];
    content.innerHTML = '<nav id="case-nav" class="tabs cases" aria-label="Exercises in this module"></nav><div id="case-panel" role="tabpanel" aria-labelledby="case-nav-tab-'+index+'">'+caseMarkup(c,state)+'</div>';
    byId('case-nav').setAttribute('aria-label',tr('Exercises in this module'));
    tabs(byId('case-nav'),m.cases.map((_,i)=>tr('Case')+' '+(i+1)),index,showCase,'case-panel');
    const form=byId('case-form');
    form.addEventListener('input',event=>{
      const input=event.target;
      if (!input.name || input.disabled) return;
      state.answers[input.name]=input.value;
      if (c.uniqueChoices) {
        for (const {fields:[f]} of c.rows) {
          const select=byId(f.id);
          if (select) select.innerHTML=optionMarkup(f,state,true);
        }
      }
      refreshCaseStatus(c);
      if (validated.delete(c.id)) byId('validation-results').innerHTML='';
      setMessage('');
    });
    form.addEventListener('submit',event=>{
      event.preventDefault();
      saveCase(c.id);
    });
    byId('validate-button')?.addEventListener('click',()=>validateCase(c));
    byId('reset-all-button').addEventListener('click',resetAllAnswers);
    byId('reveal-button')?.addEventListener('click',()=>revealCase(c));
    refreshCaseStatus(c);
  }
  content.querySelector('[data-action="export"]').addEventListener('click',exportAnswers);
  if(focusId) byId(focusId)?.focus();
}

function tableMarkup(headers, items) {
  return '<div class="table-wrap"><table><thead><tr>'+headers.map(h=>'<th scope="col">'+escT(h)+'</th>').join('')+'</tr></thead><tbody>'+items.map(row=>'<tr>'+row.map((v,i)=>i===0?'<th scope="row">'+escT(v)+'</th>':'<td>'+escT(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
}

function optionMarkup(f,state,unique) {
  const selected=state.answers[f.id]??'';
  const used=unique?new Set(Object.entries(state.answers).filter(([key])=>key!==f.id).map(([,value])=>value)):null;
  return '<option value="">'+escT('Select…')+'</option>'+f.choices.filter(value=>!used?.has(value)||value===selected).map(value=>'<option value="'+escapeHtml(value)+'"'+(value===selected?' selected':'')+'>'+escT(value)+'</option>').join('');
}

function inputMarkup(f, state, locked=false, unique=false) {
  const name=escapeHtml(f.id);
  const value=state.answers[f.id]??'';
  const disabled=locked?' disabled':'';
  if(f.choices) return '<select name="'+name+'" id="'+name+'"'+disabled+'>'+optionMarkup(f,state,unique)+'</select>';
  if(f.number) return '<input name="'+name+'" id="'+name+'" type="text" inputmode="decimal" value="'+escapeHtml(value)+'"'+disabled+'>';
  return '<textarea name="'+name+'" id="'+name+'" rows="2"'+disabled+'>'+escapeHtml(value)+'</textarea>';
}

function question(f,state,locked=false,unique=false) {
  return '<label class="question" for="'+escapeHtml(f.id)+'"><span>'+escT(f.label)+'</span>'+inputMarkup(f,state,locked,unique)+'</label>';
}

function matrixMarkup(c,state) {
  return '<div class="table-wrap"><table class="matrix"><thead><tr><th scope="col">'+escT('Criterion')+'</th><th scope="col">'+escT('Weight')+'</th><th scope="col">'+escT('A rating')+'</th><th scope="col">'+escT('B rating')+'</th><th scope="col">'+escT('C rating')+'</th></tr></thead><tbody>'+c.matrix.map(row=>'<tr><th scope="row">'+escT(row.label)+'</th><td>'+escapeHtml(row.weight)+'</td>'+row.fields.map(f=>'<td>'+inputMarkup(f,state).replace(' id=',' aria-label="'+escT(f.label)+'" id=')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
}

function caseMarkup(c,state) {
  const locked=c.before && state.revealed;
  const rowsMarkup=(c.rows??[]).map((row,i)=>'<fieldset class="response-row"><legend>'+(i+1)+'. '+escT(row.text)+'</legend><div class="input-grid">'+row.fields.map(f=>question(f,state,false,c.uniqueChoices)).join('')+'</div></fieldset>').join('');
  const beforeMarkup=c.before?'<h3 class="stage-title">'+escT('Initial response')+'</h3>'+c.before.map(f=>question(f,state,locked)).join('')+(locked?'<p class="hint">'+escT('Your initial response is recorded above.')+'</p>':'<div class="actions"><button type="button" id="reveal-button" class="button">'+escT(c.revealLabel)+'</button></div>'):'';
  const afterMarkup=(!c.before||state.revealed)
    ? (c.revealTitle?'<section class="reveal" id="new-evidence" tabindex="-1"><h3>'+escT(c.revealTitle)+'</h3><p>'+escT(c.revealText)+'</p></section>':'')
      +(c.afterInstruction?'<p class="hint">'+escT(c.afterInstruction)+'</p>':'')
      +(c.matrix?matrixMarkup(c,state):'')
      +(c.stakeholder?'<div class="callout"><strong>'+escT('Stakeholder challenge')+'</strong><p>'+escT(c.stakeholder)+'</p></div>':'')
      +c.fields.map(f=>question(f,state)).join('')
    : '';
  return `
    <div class="case-header"><h2>${escT(c.title)}</h2><span id="case-status" class="status-label"></span></div>
    <p class="intro">${escT(c.brief)}</p>
    ${c.callout?'<div class="callout">'+escT(c.callout)+'</div>':''}
    ${c.firstTable?tableMarkup(c.firstTable.headers,c.firstTable.items):''}
    <p>${escT(c.instruction)}</p>
    <form id="case-form" autocomplete="off" novalidate>
      ${rowsMarkup}${beforeMarkup}${afterMarkup}
      <div class="actions">
        <button type="submit" class="button secondary">${escT('Save Answers')}</button>
        <button type="button" class="button" id="validate-button">${escT('Save & Validate Answers')}</button>
        <button type="button" class="button secondary" data-action="export">${escT('Export My Answers')}</button>
        <button type="button" class="button reset" id="reset-all-button">${escT('Reset All Answers')}</button>
      </div>
      <p class="message" id="message" role="status" aria-live="polite"></p>
      <p class="hint">${escT('Save in this browser or export a copy to keep or share.')}</p>
      <div id="validation-results" aria-live="polite" tabindex="-1">${validated.has(c.id)?resultsMarkup(c):''}</div>
    </form>`;
}

function setMessage(value,error=false) {
  const node=byId('message');
  node.textContent=tr(value);
  node.classList.toggle('error',error);
}

function serializedAnswers(answers) {
  return Object.fromEntries(Object.entries(answers).filter(([,value])=>typeof value==='string' && value.trim()).sort(([a],[b])=>a.localeCompare(b)));
}

function snapshot(c) {
  return {answers:serializedAnswers(draft[c].answers),revealed:draft[c].revealed,ratingScale:caseList.find(item=>item.id===c)?.ratingScale};
}

function refreshCaseStatus(c) {
  const status=byId('case-status');
  const stored=saved[c.id];
  const current=snapshot(c.id);
  const hasResponse=Object.keys(current.answers).length>0;
  const same=stored && JSON.stringify(serializedAnswers(stored.answers??{}))===JSON.stringify(current.answers) && stored.revealed===current.revealed;
  status.dataset.state=same?'saved':hasResponse||stored?'draft':'empty';
  status.textContent=tr(same?'Saved on this browser':hasResponse||stored?'Unsaved changes':'');
}

function persist(id) {
  const next={...saved,[id]:snapshot(id)};
  try {
    localStorage.setItem(storageKey,JSON.stringify(next));
    saved=next;
    storageError=false;
    return true;
  } catch {
    storageError=true;
    return false;
  }
}

function saveCase(id) {
  if (!Object.keys(snapshot(id).answers).length && !saved[id]) {
    setMessage('Enter at least one response before saving.',true);
    return;
  }
  const ok=persist(id);
  refreshCaseStatus(caseList.find(c=>c.id===id));
  setMessage(ok?'Answers saved.':'This browser could not save locally. Export your answers to keep a copy.',!ok);
}

function revealCase(c) {
  const state=draft[c.id];
  const blank=c.before.find(f=>!state.answers[f.id]?.trim());
  if (blank) {
    setMessage('Complete your initial response before revealing the next step.',true);
    byId(blank.id)?.focus();
    return;
  }
  state.revealed=true;
  const ok=persist(c.id);
  render('new-evidence');
  setMessage(ok?'Initial response saved.':'The next step is open. Export your answers to keep a copy.',!ok);
}

const ratingKey = (prefix,values) => Object.fromEntries(['A','B','C'].map((letter,i)=>[prefix+letter,values[i]]));
const keyByCase = {
  'm1-classify':Object.fromEntries(["Fact", "Assumption", "Evidence", "Validation", "Fact", "Assumption", "Validation", "Evidence"].map((answer,i)=>['classification'+(i+1),answer])),
  'm1-bias':Object.fromEntries([
    'Overweighting one criterion','Familiarity','Anchoring','Confirmation','Urgency','Sunk cost','Authority','Availability',
  ].map((answer,i)=>['bias'+(i+1),answer])),
  'm2-musts':{...Object.fromEntries(mustPrompts.map((_,i)=>['must'+i,i<3?'Must':'Want'])),eligible:'No'},
  'm2-purchase':{purchase0:'Want',purchase1:'Must',purchase2:'Must',purchase3:'Want',purchase4:'Want',purchase5:'Must',eligible:'No'},
  'm2-matrix':{
    ...ratingKey('reliability',['1','5','10']),...ratingKey('effort',['10','5','1']),
    ...ratingKey('coverage',['1','5','10']),...ratingKey('speed',['10','5','1']),
    ...ratingKey('total',[5.05,5.00,5.95]),finalChoice:choicesABC[2],
  },
  'm3-handover':{...ratingKey('updatedRating',['1','10','5']),...ratingKey('total',[5.05,6.75,4.20]),changeType:'A weighted criterion'},
  'm3-training':{option:'Keep the current form until both shifts are signed off'},
};
const writtenReview = {
  'm2-musts':'Check whether your reason names the failed compatibility requirement and explains why an option that fails a Must stops before scoring.',
  'm2-purchase':'Check whether your reason identifies the delivery deadline. Seven business days exceeds the five-business-day Must, even though the option is within budget and offers the preferred features.',
  'm2-matrix':'Your first impression and reason are for reflection. The feedback checks the ratings, weighted totals, and highest-scoring option.',
  'm3-handover':'Review your pitch. Does it request a clear decision, cite the repeat test, explain the difference in request coverage, and assign someone to verify priority request types?',
  'm3-training':'Review your pitch. Does it explain the missed sign-off, address the shared record, and name who will confirm readiness before the common changeover?',
};

function numericResponse(value) {
  const normalized=value.replace(/[٠-٩۰-۹]/g,digit=>String(digit.charCodeAt(0)%16)).replace(/[٫,]/g,'.');
  return /^\d+(?:\.\d+)?$/.test(normalized)?Number(normalized):NaN;
}

function gradeCase(c) {
  const answers=draft[c.id].answers;
  const fields=[
    ...(c.rows??[]).flatMap((row,i)=>row.fields.map(f=>({...f,label:(i+1)+'. '+tr(row.text)+' · '+tr(f.label)}))),
    ...(c.matrix??[]).flatMap(row=>row.fields),
    ...c.fields,
  ];
  return fields.filter(f=>Object.hasOwn(keyByCase[c.id],f.id)).map(f=>{
    const expected=keyByCase[c.id][f.id];
    const accepted=Array.isArray(expected)?expected:[expected];
    const response=answers[f.id]?.trim()??'';
    const correct=accepted.some(value=>typeof value==='number' ? response!==''&&Math.abs(numericResponse(response)-value)<0.005 : value===response);
    return {label:f.label,response,expected:accepted,result:response?(correct?'Correct':'Incorrect'):'Not answered'};
  });
}

function resultsMarkup(c) {
  const results=gradeCase(c);
  const count=result=>results.filter(r=>r.result===result).length;
  const summary=['Correct','Incorrect','Not answered'].map(label=>escT(label)+' '+count(label)).join(' · ');
  const rows=results.map(r=>{
    const expected=r.expected.map(value=>typeof value==='number'?value.toFixed(2):escT(value)).join(' / ');
    const statusClass=r.result==='Correct'?'correct':r.result==='Incorrect'?'incorrect':'';
    return '<li><strong>'+escT(r.label)+'</strong><br><span class="'+statusClass+'">'+escT(r.result)+'</span>'
      +(r.response?' · '+escT('Your answer')+' '+escT(r.response):'')
      +(r.result==='Incorrect'?' · '+escT('Expected')+' '+expected:'')+'</li>';
  }).join('');
  const review=writtenReview[c.id];
  const reviewMarkup=review?'<h3>'+escT('Review your written answers')+'</h3><p>'+escT(review)+'</p><p class="hint">'+escT('Written responses are for self-review and do not receive a right or wrong mark.')+'</p>':'';
  return '<section class="validation"><h3>'+escT('Validation results')+'</h3><p>'+summary+'</p><ul>'+rows+'</ul>'+reviewMarkup+'</section>';
}

function validateCase(c) {
  if (c.before&&!draft[c.id].revealed) {
    setMessage('Record your initial response and open the next step before validating.',true);
    return;
  }
  if (!Object.keys(snapshot(c.id).answers).length) {
    setMessage('Enter at least one response before saving.',true);
    return;
  }
  const ok=persist(c.id);
  validated.add(c.id);
  refreshCaseStatus(c);
  byId('validation-results').innerHTML=resultsMarkup(c);
  byId('validation-results').focus();
  setMessage(ok?'Answers saved and checked.':'Answers checked. This browser could not save locally, so export a copy.',!ok);
}

function resetAllAnswers() {
  if (!window.confirm(tr('Clear all answers across all seven cases and start again? This cannot be undone.'))) return;
  try {
    localStorage.removeItem(storageKey);
    storageError=false;
  } catch {
    storageError=true;
  }
  saved={};
  for (const c of caseList) {
    draft[c.id]={answers:Object.create(null),revealed:false};
  }
  validated.clear();
  moduleIndex=0;
  caseIndices.fill(0);
  view='exercises';
  render('case-nav-tab-0');
  setMessage(storageError?'Responses on this page were reset, but the browser could not clear previously saved answers.':'All answers were reset.',storageError);
}

function exportAnswers() {
  const lines=[tr('DAD Academy'),tr('Decision Making & Critical Thinking'),tr('Workshop responses'),tr('Exported')+' '+new Date().toLocaleString(language),''];
  let answerCount=0;
  modules.forEach((m,i)=>{
    lines.push(tr('Module')+' '+(i+1)+' · '+tr(m.title),'');
    m.cases.forEach((c,index)=>{
      lines.push(tr('Case')+' '+(index+1)+' · '+tr(c.title));
      const state=draft[c.id];
      const pairs=[];
      const add=(f,prefix='')=>{
        const answer=state.answers[f.id]?.trim();
        if(answer) pairs.push([prefix+tr(f.label),f.choices?tr(answer):answer]);
      };
      for(const [i,row] of (c.rows??[]).entries()) {
        for(const f of row.fields) add(f,(i+1)+'. '+tr(row.text)+' · ');
      }
      for(const f of c.before??[]) add(f,tr('Initial response')+' · ');
      for(const row of c.matrix??[]) for(const f of row.fields) add(f);
      for(const f of c.fields) add(f);
      if(!pairs.length) lines.push(tr('No responses recorded.'));
      for(const [prompt,answer] of pairs) lines.push(prompt,answer,'');
      answerCount+=pairs.length;
      lines.push('');
    });
  });
  if (!answerCount) {
    setMessage('Enter an answer before exporting.',true);
    return;
  }
  const url=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}));
  const link=document.createElement('a');
  link.href=url;
  link.download='DAD_Workshop_My_Answers.txt';
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
  setMessage(storageError?'Answers exported. Local saving is unavailable in this browser.':'Answers exported.');
}

byId('language').addEventListener('click',()=>{
  language=language==='en'?'ar':'en';
  try { localStorage.setItem(storageKey+'-language',language); } catch {}
  render('language');
});
render();
</script>
