alidation?": "حقيقة أم افتراض أم دليل أم تحقّق؟", "Evidence": "دليل", "Validation": "تحقّق", "The pilot started on Monday in two departments.": "بدأت التجربة يوم الاثنين في قسمين.", "“If two departments managed the change, every department will find it easy.”": "«إذا قدر قسمان يطبّقوا التغيير، أكيد كل الأقسام رح تلاقيه سهل».", "The pilot log shows that 19 of 20 routine requests reached the intended team.": "يبيّن سجل التجربة أن 19 من أصل 20 طلباً عادياً وصلت إلى الفريق المعني.", "Can we test whether urgent requests reach the intended team on both shifts?": "هل يمكننا اختبار وصول الطلبات العاجلة إلى الفريق المعني في كلتا الورديتين؟", "The team used the same handover form throughout the pilot.": "استخدم الفريق نموذج تسليم الطلبات نفسه طوال التجربة.", "“The day shift found the form easy to use, so the night shift will too.”": "«الوردية النهارية لقت النموذج سهل الاستخدام، إذن الوردية الليلية رح تلاقيه سهل كمان».", "Can we compare both shifts’ handover records to check whether the error rate is similar?": "هل يمكننا مقارنة سجلات التسليم للورديتين للتحقّق مما إذا كان معدل الأخطاء متقارباً؟", "The signed attendance sheet lists 8 of the 10 pilot staff at the process briefing.": "تُظهر ورقة الحضور الموقّعة أن 8 من أصل 10 موظفين شاركوا في جلسة شرح الإجراء.", "Case": "الحالة", "Must or Want? · The Label Printer Request": "شرط إلزامي أم معيار تفضيلي؟ · طلب شراء طابعة ملصقات", "A manager asks an employee to buy a label printer for shared office storage. “Wi-Fi would be useful. The printer must work with our existing label software and arrive within five business days. I’d prefer an extra roll and a two-year warranty. Keep the total cost within JOD 200.”": "طلب مدير من موظف شراء طابعة ملصقات لمساحة التخزين المشتركة في المكتب. قال له: «الاتصال عبر Wi-Fi سيكون مفيداً. يجب أن تعمل الطابعة مع برنامج الملصقات الحالي وأن تصل خلال خمسة أيام عمل. أفضّل وجود لفة ملصقات إضافية وكفالة لمدة سنتين. خلّيك ضمن ميزانية إجمالية لا تتجاوز 200 دينار أردني».", "Option Y costs JOD 165 and works with dard templates and manual routing": "D · قوالب موحّدة وتوجيه يدوي", "E · Service desk request queue": "E · قائمة انتظار الطلبات لدى مكتب الدعم", "Approval history": "سجل الموافقات", "Ready in (business days)": "مدة الجاهزية (أيام عمل)", "Requests routed on time": "الطلبات الموجّهة في موعدها", "Complete on first submission": "الطلبات المكتملة عند أول إرسال", "Setup effort": "جهد الإعداد", "Training per user": "تدريب لكل مستخدم", "Support response": "زمن استجابة الدعم", "Eligible": "مؤهّل", "Ineligible": "غير مؤهّل", "D rating": "تقييم D", "E rating": "تقييم E", "Which option would you select?": "أي خيار ستختار؟", "2 hours": "2 ساعات", "4 hours": "4 ساعات", "6 hours": "6 ساعات", "8 hours": "8 ساعات", "18 hours": "18 ساعة", "26 hours": "26 ساعة", "40 hours": "40 ساعة", "52 hours": "52 ساعة", "76 hours": "76 ساعة", "20 min": "20 دقيقة", "25 min": "25 دقيقة", "35 min": "35 دقيقة", "40 min": "40 دقيقة", "60 min": "60 دقيقة", "5 days": "5 أيام عمل", "14 days": "14 يوم عمل", "18 days": "18 يوم عمل", "Selecting a Vendor for the Training Booking Portal": "اختيار مورّد لبوابة حجز التدريب", "Fictional case · Four vendors responded to DAD Academy’s request for a portal for training and onboarding bookings.": "حالة افتراضية · قدّم أربعة مورّدين عروضاً لأكاديمية دار الدواء لإنشاء بوابة لحجز التدريب وبرامج التهيئة.", "Sponsor’s email": "رسالة راعي المشروع", "Team, training requests currently come through email and spreadsheets. Coordinators often spend time confirming seats and compiling attendance records. We need one portal where staff can book sessions and coordinators can manage rosters across departments.": "فريق العمل، تصل طلبات التدريب حالياً عبر البريد الإلكتروني والجداول. يقضي المنسّقون وقتاً في تأكيد المقاعد وتجميع سجلات الحضور. نحتاج إلى بوابة واحدة يحجز فيها الموظفون الجلسات ويدير المنسّقون قوائم المشاركين من مختلف الأقسام.", "The portal must use existing DAD sign-in and give coordinators separate permissions. It must export booking and attendance data to CSV for monthly reporting, be ready within 20 business days of approval, and cost no more than JOD 3,500 for setup and the first year of support.": "يجب أن تستخدم البوابة تسجيل الدخول الحالي في دار الدواء، وأن تمنح المنسّقين صلاحيات منفصلة. ويجب أن تصدّر بيانات الحجز والحضور إلى CSV للتقارير الشهرية، وتكون جاهزة خلال 20 يوم عمل من الموافقة، وألّا تتجاوز تكلفة الإعداد والسنة الأولى من الدعم 3,500 دينار أردني.", "For options that meet those requirements, I’d prefer shorter staff onboarding, faster support, automatic reminders, calendar invitations, and a lower total cost within budget. We can run some tasks manually if the other benefits justify the extra work.": "للخيارات التي تستوفي الشروط، أفضّل تهيئة أقصر للموظفين، ودعماً أسرع، وتذكيرات تلقائية، ودعوات على التقويم، وتكلفة إجمالية أقل ضمن الميزانية. يمكننا تنفيذ بعض المهام يدوياً إذا كانت الفوائد الأخرى تبرّر الجهد الإضافي.", "Please review the proposals, record the Musts and Wants in your own words, and recommend one vendor. Be ready to explain which criterion mattered most.": "راجعوا العروض وسجّلوا الشروط الإلزامية والمعايير التفضيلية بكلماتكم، ثم أوصوا بمورّد واحد ووضّحوا أي معيار كان الأهم.", "Vendor proposals": "عروض المورّدين", "A · Cedar Learning Systems": "A · Cedar Learning Systems", "B · Orbit Training Solutions": "B · Orbit Training Solutions", "C · SwiftEnroll": "C · SwiftEnroll", "D · Bridge Training Services": "D · Bridge Training Services", "We can configure your training booking portal for JOD 2,600 and hand it over in 12 business days. Our offer includes the first year of support, DAD sign-in, separate coordinator and participant roles, and CSV export. Staff can join a 30-minute onboarding session. We respond within eight business hours and send confirmations by email. Calendar invitations can be sent manually by coordinators.": "يمكننا إعداد بوابة حجز التدريب بتكلفة 2,600 دينار وتسليمها خلال 12 يوم عمل. يشمل العرض السنة الأولى من الدعم، وتسجيل دخول دار الدواء، وصلاحيات منفصلة للمنسّقين والمشاركين، وتصدير CSV. يمكن للموظفين حضور جلسة تهيئة مدتها 30 دقيقة. نردّ خلال ثماني ساعات عمل ونرسل التأكيدات بالبريد الإلكتروني. يمكن للمنسّقين إرسال دعوات التقويم يدوياً.", "Our JOD 3,300 offer includes setup and the first year of support. We can deliver in 18 business days. The portal supports DAD sign-in, coordinator and participant roles, and CSV export. Users receive calendar invitations and automatic reminders. Onboarding takes 60 minutes per group, and we respond within two business hours.": "يشمل عرضنا بقيمة 3,300 دينار الإعداد والسنة الأولى من الدعم. يمكننا التسليم خلال 18 يوم عمل. تدعم البوابة تسجيل دخول دار الدواء وصلاحيات المنسّقين والمشاركين وتصدير CSV. يتلقّى المستخدمون دعوات التقويم وتذكيرات تلقائية. تستغرق التهيئة 60 دقيقة لكل مجموعة، ونردّ خلال ساعتَي عمل.", "We can deliver in seven business days for JOD 2,200 including the first year of support. We offer DAD sign-in, CSV export, automatic reminders, and 20 minutes of onboarding. Our standard package gives all signed-in staff the same access. Separate coordinator permissions are unavailable in this package. We respond within four business hours.": "يمكننا التسليم خلال سبعة أيام عمل بتكلفة 2,200 دينار تشمل السنة الأولى من الدعم. نقدّم تسجيل دخول دار الدواء وتصدير CSV وتذكيرات تلقائية وتهيئة مدتها 20 دقيقة. تمنح الحزمة القياسية جميع الموظفين المسجّلين الصلاحيات نفسها، ولا تتضمّن صلاحيات منفصلة للمنسّقين. نردّ خلال أربع ساعات عمل.", "Our JOD 2,950 proposal covers implementation and one year of support. We can go live in 15 business days with DAD sign-in, separate roles, and CSV export. Training takes 40 minutes. Calendar invitations are included, and coordinators can send reminder emails manually. Our response target is four business hours.": "يشمل عرضنا بقيمة 2,950 دينار التنفيذ وسنة من الدعم. يمكن تشغيل البوابة خلال 15 يوم عمل مع تسجيل دخول دار الدواء وصلاحيات منفصلة وتصدير CSV. يستغرق التدريب 40 دقيقة. تشمل البوابة دعوات التقويم، ويمكن للمنسّقين إرسال التذكيرات بالبريد يدوياً. نستهدف الردّ خلال أربع ساعات عمل.", "Enter up to five Musts and mark each vendor against each requirement. Then enter your Wants and their weights. Rate eligible vendors from 1 to 10. Each cell shows the weighted result, and the bottom row adds the scores when the weights total 100%.": "أدخل حتى خمسة شروط إلزامية، وحدّد هل يحقّق كل مورّد كل شرط. ثم أدخل المعايير التفضيلية وأوزانها. قيّم المورّدين المؤهّلين من 1 إلى 10. تعرض كل خانة النتيجة المرجّحة، ويجمعها الصف الأخير عندما يصل مجموع الأوزان إلى 100%.", "Which vendor would you recommend?": "بأي مورّد توصي؟", "What is the main reason for your selection?": "ما السبب الرئيسي لاختيارك؟", "Meets": "يحقّق الشرط", "Does not meet": "لا يحقّق الشرط", "Pending": "قيد التقييم", "Must / Want": "شرط إلزامي / معيار تفضيلي", "Weight (%)": "الوزن (%)", "Rating": "التقييم", "Musts · Eligibility screening": "الشروط الإلزامية · فحص الأهلية", "Eligibility": "الأهلية", "Wants · Weighted scoring": "المعايير التفضيلية · التقييم المرجّح", "Weighted total / 10": "المجموع المرجّح من 10", "Weights total 100%. Complete the ratings for each eligible vendor.": "مجموع الأوزان 100%. أكمل تقييم كل مورّد مؤهّل.", "Enter your Wants and weights totaling 100% to display final scores.": "أدخل المعايير التفضيلية وأوزاناً مجموعها 100% لعرض النتائج النهائية.", "Module 3 Quiz · Challenge, Validate & Convince": "اختبار الوحدة 3 · تحدَّ القرار وتحقّق منه وأقنع صاحب القرار", "Ten short workplace questions on the Devil’s Advocate, decision validation, and convincing the stakeholder.": "عشرة أسئلة قصيرة من بيئة العمل حول دور المعارض البنّاء والتحقّق من القرار وإقناع صاحب القرار.", "Choose one answer": "اختر إجابة واحدة", "Quiz": "الاختبار", "Quiz score": "نتيجة الاختبار", "Three checks before asking for approval": "ثلاث مهارات قبل طلب الموافقة", "Devil’s Advocate": "المعارض البنّاء", "Validate the Decision": "التحقّق من القرار", "Convince the Stakeholder": "إقناع صاحب القرار", "The team chose the fastest way to process internal requests. Which question would the Devil’s Advocate ask?": "اختار الفريق أسرع طريقة لمعالجة الطلبات الداخلية. ما السؤال الذي يطرحه المعارض البنّاء؟", "Who will announce the change?": "من سيعلن عن التغيير؟", "What did we assume about errors and rework when we chose the fastest option?": "ماذا افترضنا بشأن الأخطاء وإعادة العمل عندما اخترنا الأسرع؟", "When should we schedule the kickoff?": "متى نحدّد موعد بدء التنفيذ؟", "This question challenges whether speed still makes the option better once errors and rework are considered.": "يتحدّى السؤال فكرة أن السرعة تجعل الخيار أفضل حتى بعد أخذ الأخطاء وإعادة العمل بعين الاعتبار.", "A manager wants to expand a pilot after a strong result in one department. Which question challenges that decision?": "يريد المدير توسيع التجربة بعد نجاحها في قسم واحد. ما السؤال الذي يتحدّى القرار؟", "Which departments will receive the update first?": "أي الأقسام ستتلقّى التحديث أولاً؟", "Who will prepare the rollout slides?": "من سيجهّز شرائح التطبيق؟", "Which conditions in other departments might make the pilot results hard to repeat?": "أي ظروف في الأقسام الأخرى قد تجعل تكرار نتائج التجربة صعباً؟", "A good challenge tests whether evidence from one department applies elsewhere.": "التحدّي الجيد يفحص هل تنطبق أدلة قسم واحد على الأقسام الأخرى.", "The team picked a familiar supplier for office equipment. What would a Devil’s Advocate ask before approval?": "اختار الفريق مورّداً مألوفاً لمعدّات المكتب. ماذا يسأل المعارض البنّاء قبل الموافقة؟", "What recent performance evidence would make us reconsider this supplier?": "أي دليل حديث على الأداء قد يدفعنا لإعادة النظر في هذا المورّد؟", "Where should we file the quotation?": "أين نحفظ عرض السعر؟", "Who will issue the purchase order?": "من سيصدر أمر الشراء؟", "The question invites evidence that could overturn a preference based on familiarity.": "يدعو السؤال إلى البحث عن دليل قد يغيّر تفضيلاً مبنياً على الألفة.", "Purchasing chose a scanner. HR requires it by Thursday, but the vendor confirms delivery on Sunday. Would you change your decision, and why?": "اختار قسم المشتريات ماسحاً ضوئياً تحتاجه الموارد البشرية بحلول الخميس، لكن المورّد أكّد التسليم يوم الأحد. هل تغيّر قرارك؟ ولماذا؟", "Keep the order because the scanner still meets the budget.": "أبقِ الطلب لأن الماسح ما زال ضمن الميزانية.", "Keep the order because the vendor provided a confirmed date.": "أبقِ الطلب لأن المورّد أعطى تاريخاً مؤكداً.", "Reconsider the order because the confirmed date fails a Must.": "أعد النظر في الطلب لأن تاريخ التسليم المؤكّد يخالف شرطاً إلزامياً.", "The delivery date is a Must. Meeting the budget cannot make an option eligible after it misses the deadline.": "موعد التسليم شرط إلزامي. الالتزام بالميزانية لا يعوّض الإخفاق في الموعد.", "The team chose Room C for orientation. Its price drops from JOD 280 to JOD 260, and everything else stays the same. Would you change your choice, and why?": "اختار الفريق القاعة C للتهيئة. انخفض سعرها من 280 إلى 260 ديناراً وبقيت كل التفاصيل الأخرى كما هي. هل تغيّر اختيارك؟ ولماذا؟", "Recheck the cost rating and keep C if it still ranks first.": "راجع تقييم التكلفة وأبقِ على C إذا بقيت الأولى.", "Switch to the runner-up because the information changed.": "انتقل إلى الخيار الثاني لأن المعلومات تغيّرت.", "Remove C because its price differs from the first quote.": "استبعد C لأن السعر يختلف عن العرض الأول.", "New information calls for a check. A price decrease can strengthen the original choice.": "المعلومة الجديدة تستدعي المراجعة. وقد يدعم انخفاض السعر الاختيار الأصلي.", "A supplier claims a new model is more reliable. The claim comes from a brochure, and the supplier has shared no test results. Would you change your decision, and why?": "يقول المورّد إن الطراز الجديد أكثر موثوقية. الادّعاء وارد في منشور، ولم يشارك المورّد أي نتائج اختبار. هل تغيّر قرارك؟ ولماذا؟", "Switch now because the supplier knows the model well.": "غيّر الاختيار الآن لأن المورّد يعرف الطراز جيداً.", "Hold the decision open until you verify the reliability claim.": "اترك القرار مفتوحاً إلى أن تتحقّق من ادّعاء الموثوقية.", "Keep your first decision without looking into the claim.": "أبقِ على القرار الأول دون فحص الادّعاء.", "Verify the claim with comparable test results before giving it weight in the decision.": "تحقّق من الادّعاء بنتائج اختبار قابلة للمقارنة قبل إعطائه وزناً في القرار.", "Your manager is concerned about delays. Which opening best supports your recommendation to approve Option B?": "مديرك قلق من التأخير. أي افتتاح يدعم توصيتك بالموافقة على الخيار B بشكل أفضل؟", "“We compared three options and can walk you through the whole analysis.”": "«قارنّا ثلاثة خيارات ويمكننا شرح التحليل كاملاً». ", "“Most team members preferred B after the discussion.”": "«معظم أعضاء الفريق فضّلوا B بعد النقاش». ", "“I recommend approving B. Its confirmed delivery date meets our deadline.”": "«أوصي بالموافقة على B. موعد تسليمه المؤكّد يناسب الموعد المطلوب».", "A clear request paired with evidence about the manager’s concern gives them a reason to act.": "الطلب الواضح المدعوم بدليل مرتبط بقلق المدير يعطيه سبباً لاتخاذ القرار.", "Finance asks why you recommend a room that costs JOD 40 more. Which response makes the trade-off clear?": "تسأل المالية لماذا توصي بقاعة أغلى بـ40 ديناراً. أي رد يوضّح ما تحصل عليه مقابل الفرق؟", "“The extra JOD 40 gives us on-site support during the demonstrations, and we stay within budget.”": "«فرق الـ40 ديناراً يوفّر لنا دعماً داخل القاعة خلال العروض، ونبقى ضمن الميزانية». ", "“The venue has an excellent reputation, so I think the price is fair.”": "«سمعة المكان ممتازة، لذلك أرى أن السعر عادل». ", "“The project team liked the room, so we would like to book it.”": "«الفريق أعجبته القاعة، لذلك نرغب بحجزها».", "This response explains both the extra cost and the benefit it buys.": "يوضّح الرد التكلفة الإضافية والفائدة التي نحصل عليها مقابلها.", "A department head asks whether the night shift can use the new workflow. Which evidence is most relevant?": "يسأل رئيس القسم إن كانت الوردية الليلية تستطيع استخدام مسار العمل الجديد. أي دليل هو الأقرب لسؤاله؟", "Feedback from staff who attended the daytime demonstration.": "آراء الموظفين الذين حضروا العرض النهاري.", "Results from a trial run by the night shift with its usual requests.": "نتائج تجربة نفّذتها الوردية الليلية باستخدام طلباتها المعتادة.", "The project team’s estimate of setup time for all shifts.": "تقدير فريق المشروع لوقت الإعداد لكل الورديات.", "A night-shift trial directly addresses how the workflow performs under the conditions the stakeholder asked about.": "تجربة الوردية الليلية تجيب مباشرة عن أداء المسار في الظروف التي سأل عنها صاحب القرار.", "You recommend a scanner, but IT has yet to confirm compatibility. Which approval request is strongest?": "توصي بشراء ماسح ضوئي، لكن قسم التكنولوجيا لم يؤكّد التوافق بعد. أي طلب موافقة هو الأقوى؟", "“Please approve the order today. IT can test the scanner after it arrives.”": "«رجاءً وافقوا على الطلب اليوم. يمكن لقسم التكنولوجيا اختبار الماسح بعد وصوله». ", "“Please approve the order because this is our preferred supplier.”": "«رجاءً وافقوا على الطلب لأن هذا هو مورّدنا المفضّل». ", "“Please approve the order subject to IT confirming compatibility before we purchase.”": "«رجاءً وافقوا على الطلب بشرط أن يؤكّد قسم التكنولوجيا التوافق قبل الشراء».", "A conditional request states what must be checked, who checks it, and when.": "طلب الموافقة المشروطة يحدّد ما يجب فحصه ومن يفحصه ومتى.", "Choose one category, then select Check Answer. A fact states what happened, evidence points to a record or finding, and validation asks how to check a claim.": "اختر تصنيفاً واحداً ثم اضغط «تحقّق من الإجابة». الحقيقة تصف ما حدث، والدليل يشير إلى سجل أو نتيجة، والتحقّق يطرح سؤالاً لفحص ادّعاء.", "Match each situation to a bias or decision pattern, then select Check Answer. Each option can be used once.": "اختر التحيّز أو نمط التفكير المناسب، ثم اضغط «تحقّق من الإجابة». يمكن استخدام كل خيار مرة واحدة.", "Choose one answer per question. Submit the quiz after question 10 to see your score and review all the answers.": "اختر إجابة واحدة لكل سؤال. سلّم الاختبار بعد السؤال العاشر لعرض نتيجتك ومراجعة جميع الإجابات.", "The start day and number of departments describe what happened in the pilot.": "يوم البدء وعدد الأقسام يصفان ما حدث في التجربة.", "Success in two departments does not establish how easy the change will be elsewhere.": "نجاح قسمين لا يثبت أن التغيير سيكون سهلاً في بقية الأقسام.", "The pilot log and its 19-of-20 result are evidence you can inspect.": "سجل التجربة ونتيجة 19 من 20 دليل يمكن مراجعته.", "The question proposes a test for urgent requests on both shifts.": "السؤال يقترح اختبار الطلبات العاجلة في كلتا الورديتين.", "Using the same form throughout is a description of what the team did.": "استخدام النموذج نفسه طوال التجربة يصف ما فعله الفريق.", "The statement predicts the night shift’s experience using only the day shift’s experience.": "العبارة تتوقّع تجربة الوردية الليلية بالاعتماد على تجربة الوردية النهارية فقط.", "The question proposes comparing records to verify whether the shifts have similar error rates.": "السؤال يقترح مقارنة السجلات للتحقّق من تقارب معدلات الأخطاء بين الورديتين.", "The signed attendance sheet provides a record you can inspect.": "ورقة الحضور الموقّعة تقدّم سجلاً يمكن مراجعته.", "Speed is being treated as the only criterion for the overall decision.": "العبارة تتعامل مع السرعة كأنها المعيار الوحيد للقرار.", "The form is preferred because the team is used to it.": "السبب المذكور لتفضيل النموذج هو أن الفريق اعتاد عليه.", "The first estimate of 20 days is shaping how the later estimate is judged.": "التقدير الأول البالغ 20 يوماً يؤثّر في الحكم على التقدير اللاحق.", "The team is selecting evidence that supports its belief and leaving out contrary evidence.": "الفريق يختار الأدلة التي تدعم اعتقاده ويترك الأدلة التي تعارضه.", "The deadline pressure is leading the team to skip a readiness check.": "ضغط الموعد يدفع الفريق لتجاوز فحص الجاهزية.", "Time already spent is driving the decision to continue despite the pilot results.": "الوقت الذي صُرف سابقاً يدفع الفريق للاستمرار رغم نتائج التجربة.", "The director’s position is driving the decision without discussion of the evidence.": "منصب المدير يحسم القرار دون مناقشة الأدلة.", "A recent, memorable error is being used to judge how common that problem is.": "يُستخدم خطأ حديث ويسهل تذكّره للحكم على مدى تكرار المشكلة.", "The announcement owner matters for implementation. It does not test whether speed was a sound basis for the choice.": "مسؤول الإعلان مهم للتنفيذ، لكنه لا يختبر إذا كانت السرعة أساساً سليماً للاختيار.", "A kickoff date helps schedule the work. It does not challenge the decision criteria.": "تحديد موعد الانطلاق يساعد في الجدولة، لكنه لا يتحدّى معايير القرار.", "Rollout order is an implementation question. It assumes the expansion is already justified.": "ترتيب التطبيق سؤال تنفيذي يفترض مسبقاً أن التوسّع مبرّر.", "Slide preparation helps communicate the change. It does not test whether the pilot results generalize.": "تجهيز الشرائح يساعد في شرح التغيير، لكنه لا يختبر إذا كانت نتائج التجربة تنطبق على أقسام أخرى.", "Filing the quotation is an administrative task. It does not test supplier performance.": "حفظ عرض السعر مهمة إدارية لا تختبر أداء المورّد.", "Issuing an order comes after the choice. This question does not test the basis for approval.": "إصدار الطلب يأتي بعد الاختيار، والسؤال لا يختبر أساس الموافقة.", "Staying within budget cannot compensate for failing the mandatory delivery date.": "البقاء ضمن الميزانية لا يعوّض الإخفاق في موعد التسليم الإلزامي.", "A confirmed date is useful, but Sunday is later than the required Thursday.": "التاريخ المؤكّد مفيد، لكن الأحد يأتي بعد الخميس المطلوب.", "A change in information triggers a review. It does not automatically favor the runner-up.": "تغيّر المعلومة يستدعي المراجعة، ولا يعني تلقائياً أن الخيار الثاني أصبح أفضل.", "A lower quote is a change to the cost criterion, not a reason by itself to exclude the room.": "انخفاض السعر يغيّر معيار التكلفة، لكنه بحد ذاته ليس سبباً لاستبعاد القاعة.", "Familiarity with a product does not establish comparative reliability.": "معرفة المورّد بالطراز لا تثبت أنه أكثر موثوقية من البدائل.", "Ignoring the claim leaves relevant new information unchecked.": "تجاهل الادّعاء يترك معلومة جديدة مرتبطة بالقرار دون فحص.", "Offering a full walkthrough postpones the recommendation and does not address the delay concern.": "عرض شرح التحليل كاملاً يؤخّر التوصية ولا يجيب عن القلق بشأن التأخير.", "Team preference does not show that the delivery deadline will be met.": "تفضيل الفريق لا يثبت الالتزام بموعد التسليم.", "Reputation may be useful, but this answer does not explain what the extra cost buys.": "السمعة قد تكون مفيدة، لكن الرد لا يوضّح ما نحصل عليه مقابل فرق السعر.", "The team’s preference does not explain the benefit Finance is being asked to pay for.": "تفضيل الفريق لا يوضّح الفائدة التي يُطلب من المالية دفع فرق السعر لأجلها.", "Daytime feedback does not show how the workflow performs on the night shift.": "آراء الوردية النهارية لا توضّح أداء المسار في الوردية الليلية.", "Setup time is a different issue from whether night-shift staff can use the workflow for their usual requests.": "وقت الإعداد يختلف عن قدرة الوردية الليلية على استخدام المسار لطلباتها المعتادة.", "Testing after delivery leaves compatibility unresolved at the time of purchase.": "الاختبار بعد التسليم يترك التوافق دون تأكيد عند الشراء.", "Supplier preference does not resolve the outstanding compatibility check.": "تفضيل المورّد لا يحسم فحص التوافق المعلّق.", "Question": "السؤال", "Quiz progress": "التقدّم في الاختبار", "Previous Question": "السؤال السابق", "Next Question": "السؤال التالي", "Check Answer": "تحقّق من الإجابة", "Submit Quiz": "سلّم الاختبار", "Finish Exercise": "أنهِ التمرين", "Correct answer": "الإجابة الصحيحة", "Questions to review": "الأسئلة التي تحتاج إلى مراجعة", "Answer every question before submitting.": "أجب عن كل الأسئلة قبل التسليم."};

    case:{en:'Should DAD expand a new way to hand over internal requests between departments? A team says the pilot was successful. Your first task is to see what its evidence actually supports.',ar:'هل توسّع دار الدواء استخدام طريقة جديدة لتسليم الطلبات بين الأقسام؟ يقول الفريق إن التجربة نجحت. مهمتك الأولى أن تحدّد ما تدعمه الأدلة فعلاً.'},
    steps:[
      {en:['Separate the claim from the evidence','A claim is a statement someone makes. Evidence is a record, observation, or test you can inspect. A supported conclusion stays within the limits of that evidence.','Claim: “The new process works for everyone.” Evidence: The pilot log shows 19 of 20 routine requests reached the intended team. Conclusion: Routing worked for most routine requests in this pilot.'],ar:['افصل الادّعاء عن الدليل','الادّعاء هو عبارة يقولها أحدهم. الدليل سجل أو ملاحظة أو اختبار يمكنك مراجعته. الاستنتاج المدعوم يبقى ضمن حدود الدليل.','الادّعاء: «الطريقة الجديدة تناسب الجميع». الدليل: يبيّن سجل التجربة أن 19 من 20 طلباً عادياً وصلت إلى الفريق المقصود. الاستنتاج: نجح التوجيه في معظم الطلبات العادية ضمن هذه التجربة.']},
       {en:['Fact, assumption, evidence, and validation','A fact states what happened. An assumption is something we are treating as true before checking it. Evidence is the record or finding that supports a statement. A validation question asks what to check or test.','Fact: The pilot ran on two shifts. Assumption: It will work equally well on every shift. Evidence: The tracker recorded one missed handover. Validation: Can we compare the missed handovers by shift?'],ar:['الحقيقة والافتراض والدليل والتحقّق','الحقيقة تصف ما حدث. الافتراض فكرة نتعامل معها على أنها صحيحة قبل فحصها. الدليل هو السجل أو النتيجة التي تدعم العبارة. وسؤال التحقّق يحدّد ما يمكن مراجعته أو اختباره.','حقيقة: شملت التجربة ورديتين. افتراض: ستنجح الطريقة بالقدر نفسه في كل وردية. دليل: سجّل نظام التتبّع عملية تسليم واحدة لم تتم. تحقّق: هل يمكننا مقارنة عمليات التسليم التي لم تتم حسب الوردية؟']},
      {en:['Check what the test covered','Ask who collected the data, what counted as success, which requests were included, and what was left out. Use the answer to decide how much confidence to place in the claim.','Before extending the pilot, ask whether it included urgent requests or requests that move between shifts.'],ar:['راجع نطاق الاختبار','اسأل من جمع البيانات، وكيف عرّف النجاح، وما الطلبات التي شملها الاختبار، وما الذي غاب عنه. الإجابات تساعدك في تحديد مدى ثقتك بالادّعاء.','قبل توسيع التجربة، اسأل إن كانت شملت الطلبات العاجلة أو الطلبات التي تنتقل بين الورديات.']},
      {en:['Catch the bias','Notice when a familiar option, the first estimate, a senior person’s preference, or a recent incident steers the decision. Ask a question that brings the discussion back to evidence.','“Show the successful handovers only” suggests confirmation bias. Ask: “What do the failed handovers tell us?”'],ar:['انتبه للتحيّز','انتبه عندما يوجّه القرارَ خيارٌ مألوف، أو أول تقدير، أو رأي مسؤول، أو حادثة حديثة. اطرح سؤالاً يعيد النقاش إلى الدليل.','عبارة «اعرض عمليات التسليم الناجحة فقط» تشير إلى التحيّز التأكيدي. اسأل: «ماذا نتعلّم من عمليات التسليم التي فشلت؟»']},

  {
    case:{en:'DAD is comparing three ways to hand over internal requests: a shared tracker, a standard form and queue, and a dedicated workflow. Check which options qualify before comparing them.',ar:'تقارن دار الدواء بين ثلاث طرق لتسليم الطلبات الداخلية: سجل مشترك، ونموذج موحّد مع قائمة انتظار، ومسار عمل مخصّص. تحقّق أولاً من أهلية الخيارات قبل المقارنة بينها.'},
    steps:[
      {en:['Start with the decision and the Musts','State what the team is deciding. A Must is a condition an option has to meet to be eligible. If a condition fails, stop scoring that option as proposed. If it is unverified, record what is needed to check it.','If the new process has to work with the current tracking system, an option that cannot use it stays out of the scoring.'],ar:['ابدأ بالقرار والشروط الإلزامية','حدّد القرار المطلوب. الشرط الإلزامي هو شرط يجب أن يحقّقه الخيار حتى يكون مؤهّلاً. إذا أخفق الخيار في شرط، لا يدخل التقييم بصورته الحالية. وإذا لم يُتحقّق من الشرط بعد، حدّد ما يلزم للتحقق منه.','إذا كان لا بد أن تعمل الطريقة الجديدة مع نظام التتبّع الحالي، فالخيار غير المتوافق معه لا يدخل التقييم.']},
      {en:['Identify the Wants','Wants distinguish options that have met the Musts. Select criteria that matter for the decision and define which direction is better for each one.','Higher reliability is better. Lower implementation effort is better. A shorter time to start is better.'],ar:['حدّد المعايير التفضيلية','المعايير التفضيلية تساعدك في المقارنة بين الخيارات التي حقّقت الشروط الإلزامية. اختر المعايير المرتبطة بالقرار وحدّد ما يُعد نتيجة أفضل في كل معيار.','موثوقية أعلى أفضل. جهد تنفيذ أقل أفضل. ومدة أقصر لبدء العمل أفضل.']},
      {en:['Weight and rate consistently','Weights show how important each criterion is. The weights add up to 100%. Apply the same rating scale to every eligible option.','On a 1–10 scale, this exercise uses 10 for the strongest result, 5 for the middle, and 1 for the weakest.'],ar:['استخدم الأوزان والتقييمات بشكل موحّد','الوزن يبيّن أهمية كل معيار، ومجموع الأوزان يساوي 100%. استخدم مقياس التقييم نفسه لكل خيار مؤهّل.','المقياس من 1 إلى 10. في هذا التمرين نعطي 10 للنتيجة الأقوى، و5 للوسطى، و1 للأضعف.']},
      {en:['Calculate the weighted total','Multiply each rating by the criterion’s weight as a decimal. Add the weighted ratings to get the total, then compare the eligible options.','For a criterion weighted at 35%, a rating of 10 adds 10 × 0.35 = 3.50 points to the total out of 10.'],ar:['احسب المجموع المرجّح','اضرب كل تقييم بوزن المعيار بعد تحويل الوزن إلى عدد عشري. اجمع النتائج للحصول على المجموع، ثم قارن الخيارات المؤهّلة.','إذا كان وزن المعيار 35% وتقييم الخيار 10، يضيف هذا المعيار 10 × 0.35 = 3.50 نقطة إلى المجموع من 10.']},

const storageKey = 'dad-decision-making-activities-v1';
const byId = (id) => document.getElementById(id);
const content = byId('content');
const caseList = modules.flatMap(m=>m.cases);
let storageError = false;
let saved = {};
try {
  const raw = localStorage.getItem(storageKey);
  if (raw) {
    const data = JSON.parse(raw);
    if (data && typeof data === 'object' && !Array.isArray(data)) saved = data;
  }
} catch {
  storageError = true;
}
const draft = Object.create(null);
for (const c of caseList) {
  const entry = saved[c.id];
  const answers = Object.create(null);
  const outdatedRatings = c.ratingScale && entry?.ratingScale !== c.ratingScale
    ? new Set([...c.matrix.flatMap(row=>row.fields),...finalScores].map(f=>f.id))
    : null;
  for (const [key,value] of Object.entries(entry?.answers ?? {})) {
    if (typeof value === 'string' && !outdatedRatings?.has(key)) answers[key] = value;
  }
  if (c.uniqueChoices) {
    const used=new Set();
    const retained=Object.create(null);
    for (const {fields:[f]} of c.rows) {
      const value=answers[f.id];
      if (f.choices.includes(value)&&!used.has(value)) {
        retained[f.id]=value;
        used.add(value);
      }
    }
    draft[c.id] = {answers:retained,revealed:false};
  } else {
    draft[c.id] = {answers,revealed:entry?.revealed === true};
  }
}
let moduleIndex = 0;
let view = 'explanation';
const caseIndices = [0,0,0];
let language = 'en';
try { if (localStorage.getItem(storageKey+'-language')==='ar') language='ar'; } catch {}
const validated = new Set();

function tr(text) {
  if (language!=='ar') return text;
  if (Object.hasOwn(arabic,text)) return arabic[text];
  const dynamic = /^(.+) rating for Option ([A-E])$/.exec(text);
  if (dynamic) return 'تقييم '+tr(dynamic[1])+' للخيار '+dynamic[2];
  const vendorLabel = /^(Must|Want|Weight \(%\)|Rating)([ ·]+)([1-5])(.*)$/.exec(text);
  if (vendorLabel) return tr(vendorLabel[1])+vendorLabel[2]+vendorLabel[3]+vendorLabel[4];
  const weight = /^Weight \(%\) for (.+)$/.exec(text);
  if (weight) return 'وزن '+tr(weight[1])+' (%)';
  const total = /^Weighted total for Option ([A-E])$/.exec(text);
  return total?'المجموع المرجّح للخيار '+total[1]:text;
}

function escT(text) { return escapeHtml(tr(text)); }

function displayHeader() {
  document.documentElement.lang=language;
  document.documentElement.dir=language==='ar'?'rtl':'ltr';
  byId('language').textContent=language==='ar'?'English':'العربية';
  byId('language').setAttribute('lang',language==='ar'?'en':'ar');
  byId('skip-link').textContent=tr('Skip to workshop content');
  byId('brand').textContent=tr('DAD Academy');
  byId('page-title').textContent=tr('Decision Making & Critical Thinking');
  byId('page-intro').textContent=tr('Three modules and eight workplace activities.');
  document.title=tr('Decision Making & Critical Thinking')+' | '+tr('DAD Academy');
  byId('module-nav').setAttribute('aria-label',tr('Modules'));
  byId('view-nav').setAttribute('aria-label',tr('Module content'));
  content.setAttribute('aria-label',tr('Workshop content'));
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function tabs(nav, labels, current, choose, panel) {
  nav.setAttribute('role','tablist');
  nav.replaceChildren();
  labels.forEach((label,i)=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tab';
    b.id = nav.id+'-tab-'+i;
    b.setAttribute('role','tab');
    b.setAttribute('aria-selected',String(i===current));
    b.setAttribute('aria-controls',panel);
    b.tabIndex = i===current ? 0 : -1;
    b.innerHTML = label;
    b.addEventListener('click',()=>choose(i));
    b.addEventListener('keydown',e=>{
      const step=language==='ar'?-1:1;
      const next = {ArrowLeft:(i+labels.length-step)%labels.length,ArrowRight:(i+labels.length+step)%labels.length,Home:0,End:labels.length-1}[e.key];
      if(next===undefined) return;
      e.preventDefault();
      choose(next);
    });
    nav.append(b);
  });
}

function showModule(i) {
  moduleIndex=i;
  render('module-nav-tab-'+i);
}

function showView(next, focus = true) {
  view=next;
  render(focus ? 'view-nav-tab-'+(view==='explanation'?0:1) : '');
}

function showCase(i) {
  caseIndices[moduleIndex]=i;
  render('case-nav-tab-'+i);
}

function render(focusId='') {
  displayHeader();
  const m=modules[moduleIndex];
  const index=caseIndices[moduleIndex];
  tabs(byId('module-nav'),modules.map((module,i)=>tr('Module')+' '+(i+1)+'<small>'+escT(module.title)+'</small>'),moduleIndex,showModule,'module-panel');
  byId('module-panel').setAttribute('aria-labelledby','module-nav-tab-'+moduleIndex);
  tabs(byId('view-nav'),['Explanation','Exercises'].map(tr),view==='explanation'?0:1,i=>showView(i===0?'explanation':'exercises'),'content');
  content.setAttribute('role','tabpanel');
  content.setAttribute('aria-labelledby','view-nav-tab-'+(view==='explanation'?0:1));
  if(view==='explanation') {
    content.innerHTML = `
      <h2>${escT(m.title)}</h2>
      <p class="intro">${escT(m.intro)}</p>
      <div class="callout"><strong>${escT(lessonContent[moduleIndex].caseTitle??'Running case · Internal request handovers')}</strong><p>${escapeHtml(lessonContent[moduleIndex].case[language])}</p></div>
      <div class="lesson-grid">${lessonContent[moduleIndex].steps.map(step=>'<section><h3>'+escapeHtml(step[language][0])+'</h3><p>'+escapeHtml(step[language][1])+'</p><p class="example"><strong>'+escT('Example')+'</strong><br>'+escapeHtml(step[language][2])+'</p></section>').join('')}</div>
      <div class="actions"><button type="button" class="button" id="go-exercises">${escT('Go to Exercises')}</button><button type="button" class="button secondary" data-action="export">${escT('Export My Answers')}</button></div>
      <p class="message" id="message" role="status" aria-live="polite"></p>`;
    byId('go-exercises').addEventListener('click',()=>showView('exercises'));
  } else {
    const c=m.cases[index];
    const state=draft[c.id];
    content.innerHTML = '<nav id="case-nav" class="tabs cases" aria-label="Exercises in this module"></nav><div id="case-panel" role="tabpanel" aria-labelledby="case-nav-tab-'+index+'">'+caseMarkup(c,state)+'</div>';
    byId('case-nav').setAttribute('aria-label',tr('Exercises in this module'));
    tabs(byId('case-nav'),m.cases.map((item,i)=>item.quiz?tr('Quiz'):tr('Case')+' '+(i+1)),index,showCase,'case-panel');
    if (c.readingOnly) {
      if (focusId) byId(focusId)?.focus();
      return;
    }
    const form=byId('case-form');
    form.addEventListener('input',event=>{
      const input=event.target;
      if (!input.name || input.disabled) return;
      state.answers[input.name]=input.value;
      if (isStepQuiz(c)) {
        stepState(c).checked.delete(stepState(c).index);
        refreshStep(c);
      }
      if (c.vendorMatrix) refreshVendorMatrix(state);
      if (c.uniqueChoices) {
        for (const {fields:[f]} of c.rows) {
          const select=byId(f.id);
          if (select) select.innerHTML=optionMarkup(f,state,true);
        }
      }
      refreshCaseStatus(c);
      if (validated.delete(c.id)) byId('validation-results').innerHTML='';
      setMessage('');
    });
    form.addEventListener('submit',event=>{
      event.preventDefault();
      saveCase(c.id);
    });
    byId('validate-button')?.addEventListener('click',()=>validateCase(c));
    byId('reset-all-button').addEventListener('click',resetAllAnswers);
    byId('reveal-button')?.addEventListener('click',()=>revealCase(c));
    refreshCaseStatus(c);
    if (isStepQuiz(c)) bindStepQuiz(c);
    if (c.vendorMatrix) refreshVendorMatrix(state);
  }
  content.querySelector('[data-action="export"]').addEventListener('click',exportAnswers);
  if(focusId) byId(focusId)?.focus();
}

function tableMarkup(headers, items) {
  return '<div class="table-wrap"><table><thead><tr>'+headers.map(h=>'<th scope="col">'+escT(h)+'</th>').join('')+'</tr></thead><tbody>'+items.map(row=>'<tr>'+row.map((v,i)=>i===0?'<th scope="row">'+escT(v)+'</th>':'<td>'+escT(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
}

function optionMarkup(f,state,unique) {
  const selected=state.answers[f.id]??'';
  const used=unique?new Set(Object.entries(state.answers).filter(([key])=>key!==f.id).map(([,value])=>value)):null;
  return '<option value="">'+escT('Select…')+'</option>'+f.choices.filter(value=>!used?.has(value)||value===selected).map(value=>'<option value="'+escapeHtml(value)+'"'+(value===selected?' selected':'')+'>'+escT(value)+'</option>').join('');
}

function inputMarkup(f, state, locked=false, unique=false) {
  const name=escapeHtml(f.id);
  const value=state.answers[f.id]??'';
  const disabled=locked?' disabled':'';
  if(f.choices) return '<select name="'+name+'" id="'+name+'"'+disabled+'>'+optionMarkup(f,state,unique)+'</select>';
  if(f.short) return '<input name="'+name+'" id="'+name+'" type="text" value="'+escapeHtml(value)+'"'+disabled+'>';
  if(f.number) return '<input name="'+name+'" id="'+name+'" type="text" inputmode="decimal" value="'+escapeHtml(value)+'"'+disabled+'>';
  return '<textarea name="'+name+'" id="'+name+'" rows="2"'+disabled+'>'+escapeHtml(value)+'</textarea>';
}

function question(f,state,locked=false,unique=false) {
  if (f.radio) return '<div class="quiz-options">'+f.choices.map((value,i)=>{
    const id=escapeHtml(f.id+'-'+i);
    return '<label for="'+id+'"><input type="radio" id="'+id+'" name="'+escapeHtml(f.id)+'" value="'+escapeHtml(value)+'"'
      +(state.answers[f.id]===value?' checked':'')+'><span>'+escT(value)+'</span></label>';
  }).join('')+'</div>';
  return '<label class="question" for="'+escapeHtml(f.id)+'"><span>'+escT(f.label)+'</span>'+inputMarkup(f,state,locked,unique)+'</label>';
}

function matrixMarkup(c,state) {
  const letters=c.matrixLetters??['A','B','C'];
  const cell=f=>inputMarkup(f,state).replace(' id=',' aria-label="'+escT(f.label)+'" id=');
  const headers=letters.map(letter=>'<th scope="col">'+escT(letter+' rating')+'</th>').join('');
  return '<div class="table-wrap"><table class="matrix"><thead><tr><th scope="col">'+escT('Criterion')+'</th><th scope="col">'+escT('Weight')+'</th>'+headers+'</tr></thead><tbody>'+c.matrix.map(row=>'<tr><th scope="row">'+escT(row.label)+'</th><td>'+(row.weightField?cell(row.weightField):escapeHtml(row.weight))+'</td>'+row.fields.map(f=>'<td>'+cell(f)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
}

function vendorMatrixMarkup(state) {
  const input=(f,locked=false)=>inputMarkup(f,state,locked).replace(' id=',' aria-label="'+escT(f.label)+'" id=');
  const columns=vendorOffers.map(([name])=>'<th scope="col">'+escT(name)+'</th>').join('');
  const checkRows=vendorRows.map(row=>'<tr><td>'+input(row.must)+'</td><td></td>'+row.checks.map(f=>'<td>'+input(f,true)+'</td>').join('')+'</tr>').join('');
  const scoreRows=vendorRows.map((row,i)=>'<tr><td>'+input(row.want)+'</td><td>'+input(row.weight)+'</td>'+row.scores.map((f,j)=>'<td>'+input(f,true)+'<output id="vendor-point-'+i+'-'+j+'" class="vendor-points"></output></td>').join('')+'</tr>').join('');
  const outputs=(prefix)=>vendorOffers.map((_,j)=>'<td><output id="'+prefix+j+'"></output></td>').join('');
  return '<div class="table-wrap"><table class="matrix vendor-matrix"><thead><tr><th scope="col">'+escT('Must / Want')+'</th><th scope="col">'+escT('Weight (%)')+'</th>'+columns+'</tr></thead>'
    +'<tbody><tr class="matrix-section"><th colspan="6" scope="rowgroup">'+escT('Musts · Eligibility screening')+'</th></tr>'+checkRows
    +'<tr><th scope="row">'+escT('Eligibility')+'</th><td></td>'+outputs('vendor-eligibility-')+'</tr></tbody>'
    +'<tbody><tr class="matrix-section"><th colspan="6" scope="rowgroup">'+escT('Wants · Weighted scoring')+'</th></tr>'+scoreRows+'</tbody>'
    +'<tfoot><tr><th scope="row">'+escT('Weighted total / 10')+'</th><td><output id="vendor-weight-total"></output></td>'+outputs('vendor-total-')+'</tr></tfoot></table></div>'
    +'<p class="hint" id="vendor-matrix-hint" role="status"></p>';
}

function vendorMatrixResults(answers) {
  const activeMusts=vendorRows.filter(row=>answers[row.must.id]?.trim());
  const activeWants=vendorRows.filter(row=>answers[row.want.id]?.trim());
  const weights=activeWants.map(row=>numericResponse(answers[row.weight.id]?.trim()??''));
  const weightTotal=weights.filter(Number.isFinite).reduce((sum,weight)=>sum+weight,0);
  const validWeights=activeWants.length>0&&weights.every(w=>w>=0&&w<=100)
    &&Math.abs(weightTotal-100)<0.00001;
  const vendors=vendorOffers.map((_,j)=>{
    const checks=activeMusts.map(row=>answers[row.checks[j].id]);
    const eligibility=checks.includes('Does not meet')?'Ineligible':checks.length&&checks.every(value=>value==='Meets')?'Eligible':'Pending';
    const points=vendorRows.map(row=>{
      const score=answers[row.scores[j].id];
      const weight=numericResponse(answers[row.weight.id]?.trim()??'');
      return eligibility==='Eligible'&&answers[row.want.id]?.trim()&&weight>=0&&weight<=100&&ratings.includes(score)
        ? Number(score)*weight/100 : null;
    });
    const activePoints=points.filter(value=>value!==null);
    const total=validWeights&&activePoints.length===activeWants.length
      ? activePoints.reduce((sum,value)=>sum+value,0) : null;
    return {eligibility,points,total};
  });
  return {vendors,weightTotal,validWeights};
}

function refreshVendorMatrix(state) {
  const {vendors,weightTotal,validWeights}=vendorMatrixResults(state.answers);
  byId('vendor-weight-total').textContent=String(Number(weightTotal.toFixed(2)))+'%';
  byId('vendor-matrix-hint').textContent=tr(validWeights
    ? 'Weights total 100%. Complete the ratings for each eligible vendor.'
    : 'Enter your Wants and weights totaling 100% to display final scores.');
  vendors.forEach(({eligibility,points,total},j)=>{
    byId('vendor-eligibility-'+j).textContent=tr(eligibility);
    byId('vendor-total-'+j).textContent=total===null?'—':total.toFixed(2);
    vendorRows.forEach((row,i)=>{
      byId(row.checks[j].id).disabled=!state.answers[row.must.id]?.trim();
      byId(row.scores[j].id).disabled=eligibility!=='Eligible'||!state.answers[row.want.id]?.trim();
      byId('vendor-point-'+i+'-'+j).textContent=points[i]===null?'':points[i].toFixed(2);
    });
  });
}

const stepProgress = new Map();

function isStepQuiz(c) { return c.quiz||c.immediateFeedback; }

function stepState(c) {
  if (!stepProgress.has(c.id)) stepProgress.set(c.id,{index:0,checked:new Set()});
  return stepProgress.get(c.id);
}

function stepFeedbackMarkup(c) {
  const result=gradeCase(c)[stepState(c).index];
  const correct=result.result==='Correct';
  return '<div class="step-feedback '+(correct?'correct':'incorrect')+'"><strong>'+escT(result.result)+'</strong>'
    +(correct?'':'<p><strong>'+escT('Correct answer')+'</strong> '+escT(result.expected[0])+'</p>')
    +'<p>'+escT(result.feedback)+'</p></div>';
}

function refreshStep(c) {
  const progress=stepState(c);
  const {index}=progress;
  const answered=Boolean(draft[c.id].answers[c.rows[index].fields[0].id]);
  const checked=progress.checked.has(index);
  byId('step-next').disabled=!answered||(c.immediateFeedback&&!checked);
  if (c.immediateFeedback) {
    byId('step-check').disabled=!answered||checked;
    byId('step-feedback').innerHTML=checked?stepFeedbackMarkup(c):'';
  }
}

function bindStepQuiz(c) {
  byId('step-check')?.addEventListener('click',()=>{
    const progress=stepState(c);
    if (!draft[c.id].answers[c.rows[progress.index].fields[0].id]) return;
    progress.checked.add(progress.index);
    refreshStep(c);
    byId('step-feedback').focus();
  });
  byId('step-back')?.addEventListener('click',()=>{
    const progress=stepState(c);
    if (progress.index>0) progress.index--;
    render('step-question');
  });
  byId('step-next')?.addEventListener('click',()=>{
    const progress=stepState(c);
    const answered=draft[c.id].answers[c.rows[progress.index].fields[0].id];
    if (!answered||(c.immediateFeedback&&!progress.checked.has(progress.index))) return;
    if (progress.index+1===c.rows.length) {
      validateCase(c);
      return;
    }
    progress.index++;
    render('step-question');
  });
  if (!validated.has(c.id)) refreshStep(c);
}

function stepQuizMarkup(c,state) {
  const {index,checked}=stepState(c);
  const row=c.rows[index];
  const topic=c.quiz?quizQuestions[index].group:'';
  const last=index+1===c.rows.length;
  const resultPage=validated.has(c.id);
  return `
    <div class="case-header"><h2>${escT(c.title)}</h2><span id="case-status" class="status-label"></span></div>
    ${resultPage?'' : '<p class="intro">'+escT(c.instruction)+'</p>'}
    <form id="case-form" autocomplete="off" novalidate>
      ${resultPage?'<div id="validation-results">'+resultsMarkup(c)+'</div>':`
      <div class="step-position"><span>${escT('Question')} ${index+1} / ${c.rows.length}</span>${topic?'<span>'+escT(topic)+'</span>':''}</div>
      <progress max="${c.rows.length}" value="${index+1}" aria-label="${escT('Quiz progress')}"></progress>
      <div class="step-appear">
        <fieldset class="response-row">
          <legend id="step-question" tabindex="-1">${escT(row.text)}</legend>
          <div class="quiz-response">${question(row.fields[0],state,false,c.uniqueChoices)}</div>
        </fieldset>
        ${c.immediateFeedback?'<div id="step-feedback" role="status" tabindex="-1">'+(checked.has(index)?stepFeedbackMarkup(c):'')+'</div>':''}
      </div>
      <div class="actions">
        ${index>0?'<button type="button" class="button secondary" id="step-back">'+escT('Previous Question')+'</button>':''}
        ${c.immediateFeedback?'<button type="button" class="button secondary" id="step-check">'+escT('Check Answer')+'</button>':''}
        <button type="button" class="button" id="step-next">${escT(last?(c.quiz?'Submit Quiz':'Finish Exercise'):'Next Question')}</button>
      </div>`}
      <div class="actions">
        <button type="submit" class="button secondary">${escT('Save Answers')}</button>
        <button type="button" class="button secondary" data-action="export">${escT('Export My Answers')}</button>
        <button type="button" class="button reset" id="reset-all-button">${escT('Reset All Answers')}</button>
      </div>
      <p class="message" id="message" role="status" aria-live="polite"></p>
    </form>`;
}

function caseMarkup(c,state) {
  if (isStepQuiz(c)) return stepQuizMarkup(c,state);
  if (c.readingOnly) return `
    <h2>${escT(c.title)}</h2>
    <p class="intro">${escT(c.brief)}</p>
    <div class="callout">${escT(c.callout)}</div>
    <p>${escT(c.instruction)}</p>
    ${tableMarkup(c.firstTable.headers,c.firstTable.items)}`;
  const offers=c.vendorMatrix?`
    <div class="callout"><h3>${escT('Sponsor’s email')}</h3>${c.sponsorEmail.map(paragraph=>'<p>'+escT(paragraph)+'</p>').join('')}</div>
    <h3>${escT('Vendor proposals')}</h3>
    ${vendorOffers.map(([name,body])=>'<section class="vendor-proposal"><h4>'+escT(name)+'</h4><p>'+escT(body)+'</p></section>').join('')}`:'';

  const locked=c.before && state.revealed;
  const rowsMarkup=(c.rows??[]).map((row,i)=>'<fieldset class="response-row"><legend>'+(i+1)+'. '+escT(row.text)+'</legend><div class="input-grid">'+row.fields.map(f=>question(f,state,false,c.uniqueChoices)).join('')+'</div></fieldset>').join('');
  const beforeMarkup=c.before?'<h3 class="stage-title">'+escT('Initial response')+'</h3>'+c.before.map(f=>question(f,state,locked)).join('')+(locked?'<p class="hint">'+escT('Your initial response is recorded above.')+'</p>':'<div class="actions"><button type="button" id="reveal-button" class="button">'+escT(c.revealLabel)+'</button></div>'):'';
  const afterMarkup=(!c.before||state.revealed)
    ? (c.revealTitle?'<section class="reveal" id="new-evidence" tabindex="-1"><h3>'+escT(c.revealTitle)+'</h3><p>'+escT(c.revealText)+'</p></section>':'')
      +(c.afterInstruction?'<p class="hint">'+escT(c.afterInstruction)+'</p>':'')
      +(c.matrix?matrixMarkup(c,state):'')
      +(c.stakeholder?'<div class="callout"><strong>'+escT('Stakeholder challenge')+'</strong><p>'+escT(c.stakeholder)+'</p></div>':'')
      +(c.vendorMatrix?vendorMatrixMarkup(state)+c.fields.slice(-2).map(f=>question(f,state)).join(''):c.fields.map(f=>question(f,state)).join(''))
    : '';
  return `
    <div class="case-header"><h2>${escT(c.title)}</h2><span id="case-status" class="status-label"></span></div>
    <p class="intro">${escT(c.brief)}</p>
    ${c.callout?'<div class="callout">'+escT(c.callout)+'</div>':''}
    ${c.firstTable?tableMarkup(c.firstTable.headers,c.firstTable.items):''}
    ${offers}
    <p>${escT(c.instruction)}</p>
    <form id="case-form" autocomplete="off" novalidate>
      ${rowsMarkup}${beforeMarkup}${afterMarkup}
      <div class="actions">
        <button type="submit" class="button secondary">${escT('Save Answers')}</button>
        ${c.vendorMatrix?'':'<button type="button" class="button" id="validate-button">'+escT('Save & Validate Answers')+'</button>'}
        <button type="button" class="button secondary" data-action="export">${escT('Export My Answers')}</button>
        <button type="button" class="button reset" id="reset-all-button">${escT('Reset All Answers')}</button>
      </div>
      <p class="message" id="message" role="status" aria-live="polite"></p>
      <p class="hint">${escT('Save in this browser or export a copy to keep or share.')}</p>
      <div id="validation-results" aria-live="polite" tabindex="-1">${validated.has(c.id)?resultsMarkup(c):''}</div>
    </form>`;
}

function setMessage(value,error=false) {
  const node=byId('message');
  node.textContent=tr(value);
  node.classList.toggle('error',error);
}

function serializedAnswers(answers) {
  return Object.fromEntries(Object.entries(answers).filter(([,value])=>typeof value==='string' && value.trim()).sort(([a],[b])=>a.localeCompare(b)));
}

function snapshot(c) {
  return {answers:serializedAnswers(draft[c].answers),revealed:draft[c].revealed,ratingScale:caseList.find(item=>item.id===c)?.ratingScale};
}

function refreshCaseStatus(c) {
  const status=byId('case-status');
  const stored=saved[c.id];
  const current=snapshot(c.id);
  const hasResponse=Object.keys(current.answers).length>0;
  const same=stored && JSON.stringify(serializedAnswers(stored.answers??{}))===JSON.stringify(current.answers) && stored.revealed===current.revealed;
  status.dataset.state=same?'saved':hasResponse||stored?'draft':'empty';
  status.textContent=tr(same?'Saved on this browser':hasResponse||stored?'Unsaved changes':'');
}

function persist(id) {
  const next={...saved,[id]:snapshot(id)};
  try {
    localStorage.setItem(storageKey,JSON.stringify(next));
    saved=next;
    storageError=false;
    return true;
  } catch {
    storageError=true;
    return false;
  }
}

function saveCase(id) {
  if (!Object.keys(snapshot(id).answers).length && !saved[id]) {
    setMessage('Enter at least one response before saving.',true);
    return;
  }
  const ok=persist(id);
  refreshCaseStatus(caseList.find(c=>c.id===id));
  setMessage(ok?'Answers saved.':'This browser could not save locally. Export your answers to keep a copy.',!ok);
}

function revealCase(c) {
  const state=draft[c.id];
  const blank=c.before.find(f=>!state.answers[f.id]?.trim());
  if (blank) {
    setMessage('Complete your initial response before revealing the next step.',true);
    byId(blank.id)?.focus();
    return;
  }
  state.revealed=true;
  const ok=persist(c.id);
  render('new-evidence');
  setMessage(ok?'Initial response saved.':'The next step is open. Export your answers to keep a copy.',!ok);
}

const ratingKey = (prefix,values) => Object.fromEntries(['A','B','C'].map((letter,i)=>[prefix+letter,values[i]]));
const keyByCase = {
  'm3-quiz':Object.fromEntries(quizQuestions.map((q,i)=>['quiz'+i,q.choices[q.correct]])),
  'm1-classify':Object.fromEntries(["Fact", "Assumption", "Evidence", "Validation", "Fact", "Assumption", "Validation", "Evidence"].map((answer,i)=>['classification'+(i+1),answer])),
  'm1-bias':Object.fromEntries([
    'Overweighting one criterion','Familiarity','Anchoring','Confirmation','Urgency','Sunk cost','Authority','Availability',
  ].map((answer,i)=>['bias'+(i+1),answer])),
  'm2-musts':{...Object.fromEntries(mustPrompts.map((_,i)=>['must'+i,i<3?'Must':'Want'])),eligible:'No'},
  'm2-purchase':{purchase0:'Want',purchase1:'Must',purchase2:'Must',purchase3:'Want',purchase4:'Want',purchase5:'Must',eligible:'No'},
  'm2-matrix':{
    ...ratingKey('reliability',['1','5','10']),...ratingKey('effort',['10','5','1']),
    ...ratingKey('coverage',['1','5','10']),...ratingKey('speed',['10','5','1']),
    ...ratingKey('total',[5.05,5.00,5.95]),finalChoice:choicesABC[2],
  },
};
const writtenReview = {
  'm2-musts':'Check whether your reason names the failed compatibility requirement and explains why an option that fails a Must stops before scoring.',
  'm2-purchase':'Check whether your reason identifies the delivery deadline. Seven business days exceeds the five-business-day Must, even though the option is within budget and offers the preferred features.',
  'm2-matrix':'Your first impression and reason are for reflection. The feedback checks the ratings, weighted totals, and highest-scoring option.',
};

function numericResponse(value) {
  const normalized=value.replace(/[٠-٩۰-۹]/g,digit=>String(digit.charCodeAt(0)%16)).replace(/[٫,]/g,'.');
  return /^\d+(?:\.\d+)?$/.test(normalized)?Number(normalized):NaN;
}

function gradeCase(c) {
  const answers=draft[c.id].answers;
  const key=keyByCase[c.id];
  const fields=[
    ...(c.before??[]),
    ...(c.rows??[]).flatMap((row,i)=>row.fields.map(f=>({...f,index:i,label:(i+1)+'. '+tr(row.text)+(c.quiz?'':' · '+tr(f.label))}))),
    ...(c.matrix??[]).flatMap(row=>row.fields),
    ...c.fields,
  ];
  return fields.filter(f=>Object.hasOwn(key,f.id)).map(f=>{
    const expected=key[f.id];
    const accepted=Array.isArray(expected)?expected:[expected];
    const response=answers[f.id]?.trim()??'';
    const correct=accepted.some(value=>typeof value==='number' ? response!==''&&Math.abs(numericResponse(response)-value)<0.005 : value===response);
    const feedback=c.quiz?quizQuestions[f.index].feedback:immediateReasons[c.id]?.[f.index]??'';
    const wrongIndex=c.quiz?f.choices.filter(value=>value!==expected).indexOf(response):-1;
    const wrongReason=wrongIndex>=0?quizWrongReasons[f.index][wrongIndex]:'';
    return {label:f.label,index:f.index,response,expected:accepted,feedback,wrongReason,result:response?(correct?'Correct':'Incorrect'):'Not answered'};
  });
}

function resultsMarkup(c) {
  const results=gradeCase(c);
  const count=result=>results.filter(r=>r.result===result).length;
  const summary=['Correct','Incorrect','Not answered'].map(label=>escT(label)+' '+count(label)).join(' · ');
  const rows=results.map(r=>{
    const expected=r.expected.map(value=>typeof value==='number'?value.toFixed(2):escT(value)).join(' / ');
    const statusClass=r.result==='Correct'?'correct':r.result==='Incorrect'?'incorrect':'';
    return '<li><strong>'+escT(r.label)+'</strong><br><span class="'+statusClass+'">'+escT(r.result)+'</span>'
      +(r.response?' · '+escT('Your answer')+' '+escT(r.response):'')
      +(c.quiz?'<br><strong>'+escT('Correct answer')+'</strong> '+expected:(r.result==='Incorrect'?' · '+escT('Expected')+' '+expected:''))
      +(r.wrongReason?'<br>'+escT(r.wrongReason):'')
      +(r.response&&r.feedback?'<br>'+escT(r.feedback):'')+'</li>';
  }).join('');
  const review=writtenReview[c.id];
  const reviewMarkup=review?'<h3>'+escT('Review your written answers')+'</h3><p>'+escT(review)+'</p><p class="hint">'+escT('Written responses are for self-review and do not receive a right or wrong mark.')+'</p>':'';
  const score=isStepQuiz(c)?'<p><strong>'+escT('Quiz score')+' '+count('Correct')+' / '+results.length+'</strong></p>':'';
  const incorrect=results.filter(r=>r.result==='Incorrect').map(r=>r.index+1);
  const misses=c.quiz&&incorrect.length?'<p><strong>'+escT('Questions to review')+'</strong> '+incorrect.join(', ')+'</p>':'';
  return '<section class="validation"><h3 id="step-results-title" tabindex="-1">'+escT('Validation results')+'</h3>'+score+'<p>'+summary+'</p>'+misses+'<ul>'+rows+'</ul>'+reviewMarkup+'</section>';
}

function validateCase(c) {
  if (c.before&&!draft[c.id].revealed) {
    setMessage('Record your initial response and open the next step before validating.',true);
    return;
  }
  if (!Object.keys(snapshot(c.id).answers).length) {
    setMessage('Enter at least one response before saving.',true);
    return;
  }
  if (isStepQuiz(c)&&c.rows.some(row=>!draft[c.id].answers[row.fields[0].id])) {
    setMessage('Answer every question before submitting.',true);
    return;
  }
  const ok=persist(c.id);
  validated.add(c.id);
  if (isStepQuiz(c)) render('step-results-title');
  else {
    refreshCaseStatus(c);
    byId('validation-results').innerHTML=resultsMarkup(c);
    byId('validation-results').focus();
  }
  setMessage(ok?'Answers saved and checked.':'Answers checked. This browser could not save locally, so export a copy.',!ok);
}

function resetAllAnswers() {
  if (!window.confirm(tr('Clear all answers across all eight activities and start again? This cannot be undone.'))) return;
  try {
    localStorage.removeItem(storageKey);
    storageError=false;
  } catch {
    storageError=true;
  }
  saved={};
  for (const c of caseList) {
    draft[c.id]={answers:Object.create(null),revealed:false};
  }
  validated.clear();
  stepProgress.clear();
  moduleIndex=0;
  caseIndices.fill(0);
  view='exercises';
  render('case-nav-tab-0');
  setMessage(storageError?'Responses on this page were reset, but the browser could not clear previously saved answers.':'All answers were reset.',storageError);
}

function exportAnswers() {
  const lines=[tr('DAD Academy'),tr('Decision Making & Critical Thinking'),tr('Workshop responses'),tr('Exported')+' '+new Date().toLocaleString(language),''];
  let answerCount=0;
  modules.forEach((m,i)=>{
    lines.push(tr('Module')+' '+(i+1)+' · '+tr(m.title),'');
    m.cases.forEach((c,index)=>{
      lines.push(c.quiz?tr(c.title):tr('Case')+' '+(index+1)+' · '+tr(c.title));
      const state=draft[c.id];
      const pairs=[];
      const add=(f,prefix='')=>{
        const answer=state.answers[f.id]?.trim();
        if(answer) pairs.push([prefix+tr(f.label),f.choices?tr(answer):answer]);
      };
      for(const [i,row] of (c.rows??[]).entries()) {
        for(const f of row.fields) add(f,(i+1)+'. '+tr(row.text)+' · ');
      }
      for(const f of c.before??[]) add(f,tr('Initial response')+' · ');
      for(const row of c.matrix??[]) {
        if(row.weightField) add(row.weightField);
        for(const f of row.fields) add(f);
      }
      for(const f of c.fields) add(f);
      if(c.vendorMatrix) vendorMatrixResults(state.answers).vendors.forEach(({eligibility,total},j)=>{
        const name=tr(vendorOffers[j][0]);
        if(eligibility!=='Pending') pairs.push([name+' · '+tr('Eligibility'),tr(eligibility)]);
        if(total!==null) pairs.push([name+' · '+tr('Weighted total / 10'),total.toFixed(2)]);
      });
      if(!pairs.length) lines.push(tr('No responses recorded.'));
      for(const [prompt,answer] of pairs) lines.push(prompt,answer,'');
      answerCount+=pairs.length;
      lines.push('');
    });
  });
  if (!answerCount) {
    setMessage('Enter an answer before exporting.',true);
    return;
  }
  const url=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}));
  const link=document.createElement('a');
  link.href=url;
  link.download='DAD_Workshop_My_Answers.txt';
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
  setMessage(storageError?'Answers exported. Local saving is unavailable in this browser.':'Answers exported.');
}

byId('language').addEventListener('click',()=>{
  language=language==='en'?'ar':'en';
  try { localStorage.setItem(storageKey+'-language',language); } catch {}
  render('language');
});
render();
</script>
